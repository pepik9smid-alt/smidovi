<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<script src="firebase-config.js"></script>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="PEVE FIT">
<title>PEVE FIT</title>
<style>
  :root{
    color-scheme:light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --s1:#2a78d6; --s1-track:#cde2fb;
    --s3:#1baf7a; --s3-track:#c7ede0;
    --s2:#eb6834;
    --good:#006300; --accent-soft:rgba(42,120,214,.08);
  }
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])){
      color-scheme:dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --s1:#3987e5; --s1-track:#184f95;
      --s3:#199e70; --s3-track:#0d4f38;
      --s2:#d95926;
      --good:#0ca30c; --accent-soft:rgba(57,135,229,.12);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s1-track:#184f95;
    --s3:#199e70; --s3-track:#0d4f38;
    --s2:#d95926;
    --good:#0ca30c; --accent-soft:rgba(57,135,229,.12);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--page);color:var(--text-primary);
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 14px 40px}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  h1{font-size:22px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--text-secondary);font-size:12.5px;margin:1px 0 0}
  .ghost{background:var(--surface-1);color:var(--text-secondary);border:1px solid var(--border);
         border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .ghost:hover{color:var(--text-primary)}

  nav.tabs{display:flex;gap:2px;background:var(--surface-1);border:1px solid var(--border);
           border-radius:12px;padding:4px;margin-bottom:18px}
  nav.tabs button{flex:1;background:none;border:0;border-radius:9px;padding:8px 2px;
                  font:inherit;font-size:13px;color:var(--text-secondary);cursor:pointer;line-height:1.25;
                  transition:background .14s ease,color .14s ease}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--text-primary);font-weight:600}
  .ticon{display:block;font-size:17px;line-height:1.15}
  @media(max-width:740px){
    nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0;border-radius:0;
             border-left:0;border-right:0;border-bottom:0;
             padding:6px 3px calc(6px + env(safe-area-inset-bottom))}
    nav.tabs button{font-size:11px;min-width:0;padding:6px 0}
    nav.tabs .ticon{font-size:21px;line-height:1.1}
    body{padding-bottom:88px}
  }
  @media(min-width:741px){ .ticon{display:inline;margin-right:6px;font-size:15px} }

  .subnav[hidden]{display:none}
  .subnav{display:flex;gap:3px;background:var(--surface-1);border:1px solid var(--border);
          border-radius:12px;padding:4px;margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{flex:1 1 auto;min-width:0;white-space:nowrap;background:none;border:0;border-radius:9px;
          padding:8px 9px;font:inherit;
          font-size:13.5px;color:var(--text-secondary);cursor:pointer;line-height:1.2;
          transition:background .14s ease,color .14s ease}
  .subnav button[aria-selected="true"]{background:var(--accent-soft);color:var(--text-primary);font-weight:600}
  @media(max-width:740px){ .subnav{margin-top:-4px} }

  .ring-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ring{width:112px;height:112px;flex:none}
  .ring circle{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
  .ring .bg1{stroke:var(--s1-track)} .ring .fg1{stroke:var(--s1);transition:stroke-dasharray .5s ease}
  .ring .bg3{stroke:var(--s3-track)} .ring .fg3{stroke:var(--s3);transition:stroke-dasharray .5s ease}
  .ring text{font:600 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text-primary)}
  .ring text.sm{font-size:9.5px;font-weight:500;fill:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .rkey{font-size:12.5px;color:var(--text-secondary);display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .rkey b{color:var(--text-primary);font-variant-numeric:tabular-nums}
  .rkey s{width:9px;height:9px;border-radius:50%;display:block;flex:none}

  .sess{position:fixed;inset:0;z-index:110;background:var(--page);overflow-y:auto;
        padding:0 12px calc(112px + env(safe-area-inset-bottom))}
  .sess[hidden]{display:none}
  .sess-head{position:sticky;top:0;z-index:3;margin:0 -12px 12px;padding:12px 14px;
             background:color-mix(in srgb, var(--surface-1) 92%, transparent);
             backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
             border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .sess-head .t{flex:1;min-width:130px}
  .sess-head .nm{font-size:15.5px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
  .sess-head .mt{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums;margin-top:2px}
  .sess-head .clock{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .sess-bar{height:4px;border-radius:3px;background:var(--grid);margin:-6px -12px 12px;overflow:hidden}
  .sess-bar i{display:block;height:100%;background:var(--s3);transition:width .25s ease}

  .setrow{display:grid;grid-template-columns:24px 1fr 66px 58px 40px;gap:7px;align-items:center;padding:4px 0}
  .setrow .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
  .setrow .prev{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .setrow input{width:100%;text-align:center;padding:9px 2px;margin:0;font-size:14.5px}
  .setrow .okbtn{width:100%;height:38px;border-radius:9px;border:1px solid var(--border);
                 background:var(--surface-1);color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0}
  .setrow.done .okbtn{background:var(--s3);border-color:var(--s3);color:#fff}
  .setrow.done input{opacity:.55}
  .sethead{display:grid;grid-template-columns:24px 1fr 66px 58px 40px;gap:7px;
           font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
           padding-bottom:4px;border-bottom:1px solid var(--grid);margin-bottom:4px}
  .sethead span:nth-child(3),.sethead span:nth-child(4){text-align:center}
  .exhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .exhead .n{font-size:15px;font-weight:600;flex:1;min-width:0;line-height:1.25}
  .exhead .tgt{font-size:12px;color:var(--text-secondary);white-space:nowrap}
  .addset{background:none;border:1px dashed var(--border);border-radius:9px;color:var(--text-secondary);
          font:inherit;font-size:12.5px;padding:7px;width:100%;cursor:pointer;margin-top:7px}
  .sess-foot{position:fixed;left:0;right:0;bottom:0;z-index:115;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
             background:color-mix(in srgb, var(--surface-1) 94%, transparent);
             backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
             border-top:1px solid var(--border);display:flex;gap:9px}
  .sess-foot button{flex:1;padding:14px 8px;font-size:15px;border-radius:12px}
  .prbadge{background:var(--s2);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}

  .cook{position:fixed;inset:0;z-index:100;background:var(--surface-1);overflow-y:auto;
        padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .cook[hidden]{display:none}
  .cook .chead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
  .cook h2{margin:0;font-size:19px;text-transform:none;letter-spacing:0;color:var(--text-primary);flex:1}
  .cook .xbtn{background:none;border:1px solid var(--border);border-radius:10px;color:var(--text-secondary);
              font:inherit;font-size:14px;padding:6px 11px;cursor:pointer;flex:none}
  .cook .cstep{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin-bottom:8px}
  .cook .ctext{font-size:23px;line-height:1.42;font-weight:500;margin:0 0 20px}
  .cook .cnav{display:flex;gap:9px;margin:22px 0 16px;position:sticky;bottom:0;background:var(--surface-1);padding:10px 0}
  .cook .cnav button{flex:1;padding:15px 8px;font-size:15.5px;border-radius:12px}
  .cook .dots{display:flex;gap:5px;margin-bottom:16px}
  .cook .dots i{flex:1;height:4px;border-radius:3px;background:var(--grid);display:block}
  .cook .dots i.on{background:var(--s1)}
  .cook .cing{font-size:14px;line-height:1.85}
  .cook .tset{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}

  .chart{width:100%;height:150px;display:block;margin:6px 0 4px}
  .chart .ax{stroke:var(--baseline);stroke-width:1}
  .chart .gl{stroke:var(--grid);stroke-width:1}
  .chart text{font:500 10px system-ui,-apple-system,sans-serif;fill:var(--muted)}
  .chart .avg{stroke-dasharray:none}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:2px 0 8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:3px;border-radius:2px;display:block}
  .legend i.dot{width:9px;height:9px;border-radius:50%}

  .fotky{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:8px 0}
  .fotky figure{margin:0;flex:none;width:104px}
  .fotky img{width:104px;height:139px;object-fit:cover;border-radius:10px;border:1px solid var(--border);display:block}
  .fotky figcaption{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
  .fotky figcaption button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:0 3px}
  .cmp{display:flex;gap:10px;align-items:flex-start}
  .cmp figure{flex:1;margin:0;min-width:0}
  .cmp img{width:100%;border-radius:11px;border:1px solid var(--border);display:block}
  .cmp figcaption{font-size:11.5px;color:var(--muted);text-align:center;margin-top:4px}
  .cyk{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .cyk .den{font-size:27px;font-weight:700;line-height:1;min-width:46px}

  .odzbox{max-height:462px;overflow-y:auto;margin-top:10px;padding-right:2px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:12px;
    mask-image:linear-gradient(to bottom,#000 92%,transparent);
    -webkit-mask-image:linear-gradient(to bottom,#000 92%,transparent)}
  .odz{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px}
  .odzbox .odz{margin-top:0;padding-bottom:26px}
  .odz .o{text-align:center;padding:11px 6px;border:1px solid var(--border);border-radius:12px}
  .odz .o.on{background:var(--accent-soft);border-color:var(--s1)}
  .odz .e{font-size:25px;line-height:1.15;filter:grayscale(1);opacity:.35}
  .odz .o.on .e{filter:none;opacity:1}
  .odz .t{font-size:11.5px;font-weight:600;margin-top:4px;line-height:1.25}
  .odz .s{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3}
  .hbar{display:grid;grid-template-columns:1fr;gap:7px;margin-top:10px}
  .hbar .row{display:grid;grid-template-columns:1fr 58px;gap:9px;align-items:center}
  .hbar .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbar .tr{height:9px;border-radius:5px;background:var(--grid);overflow:hidden;margin-top:3px}
  .hbar .tr i{display:block;height:100%;border-radius:5px;background:var(--s1)}
  .hbar .vl{font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;color:var(--text-secondary)}
  .stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:10px 0 8px;gap:2px;background:var(--grid)}
  .stack i{display:block;height:100%}
  .stack-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary)}
  .stack-leg s{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;text-decoration:none}
  .kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 2px}
  @media(min-width:741px){ .kpi{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .kpi div{background:var(--accent-soft);border-radius:11px;padding:9px 10px}
  .kpi .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;line-height:1.3}
  .kpi .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}

  .odz-next{display:flex;align-items:center;gap:11px;margin-top:10px;background:var(--accent-soft);
            border:1px solid var(--border);border-radius:12px;padding:9px 12px}
  .odz-next .e{font-size:24px;flex:none;line-height:1;filter:grayscale(.55);opacity:.75}
  .odz-next .b{flex:1;min-width:0;font-size:13px;line-height:1.35}
  .odz-next .kdy{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
                 background:var(--surface-1);border:1px solid var(--border);border-radius:999px;padding:4px 10px}
  .rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 4px}
  .rep-grid div{background:var(--accent-soft);border-radius:11px;padding:10px}
  .rep-grid .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .rep-grid .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
  .rep-grid .p{font-size:11.5px;color:var(--text-secondary)}

  .form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:9px}
  .form-row label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;
                  display:block;margin-bottom:3px}
  .form-row .f{flex:1;min-width:120px}
  .form-row input, .form-row select{width:100%;margin-top:0}
  textarea.f2{width:100%;background:var(--surface-1);color:var(--text-primary);border:1px solid var(--border);
              border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;min-height:78px;line-height:1.5}
  .mine{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
  .mine:last-child{border-bottom:none}
  .mine .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:17px;padding:0 4px;line-height:1}

  .bell{position:relative;background:var(--surface-1);border:1px solid var(--border);border-radius:11px;
        width:38px;height:34px;display:grid;place-items:center;font-size:17px;cursor:pointer;flex:none;
        transition:background .15s ease,border-color .15s ease}
  .bell:hover{border-color:var(--s1)}
  .bell .dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;
             background:var(--s2);border:2px solid var(--surface-1)}
  .bell .dot[hidden]{display:none}

  .sheet{position:fixed;inset:0;z-index:130;background:var(--page);overflow-y:auto;
         padding:0 12px calc(28px + env(safe-area-inset-bottom))}
  .sheet[hidden]{display:none}
  .livetr{margin-top:10px;padding:10px 11px;border-radius:12px;border:1px solid var(--border);
   background:var(--surface-1)}
 .livetr.on{border-color:var(--s2)}
 .livetr .lt-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px}
 .duoswitch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
 .duoswitch button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 11px;
   border-radius:12px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);
   font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:left;min-width:0}
 .duoswitch button i{font-style:normal;font-size:11.5px;font-weight:600;opacity:.8;
   font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
 .duoswitch button.on{background:var(--s1);border-color:var(--s1);color:#fff}
 .duoscore{font-size:13px;padding:9px 12px;border-radius:11px;margin:0 0 12px;line-height:1.4;
   border:1px solid var(--border);background:var(--surface-1)}
 .duoscore.vedes{border-color:var(--s3)}
 .duoscore.prohravas{border-color:var(--s2)}
 .duotag{font-size:11.5px;color:var(--text-secondary);margin:-2px 0 6px}
 .duotag b{color:var(--text-primary)}
 .duobadge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;
   background:var(--s1-track);color:var(--text-primary);vertical-align:middle;margin-left:4px}
 .duomini{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;
   border-top:1px solid var(--grid);font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
 .duomini b{color:var(--text-primary)}
 .duomini em{font-style:normal;margin-left:auto;font-weight:700;color:var(--s1)}
 .sparcard{border-color:var(--s1-track)}
 .sparbil{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12.5px;
   color:var(--text-secondary);font-variant-numeric:tabular-nums}
 .sparbil span{background:var(--surface-1);border:1px solid var(--border);border-radius:99px;padding:4px 10px}
 .sparrow{padding:11px 0;border-bottom:1px solid var(--grid)}
 .sparrow:last-of-type{border-bottom:0}
 .sparrow .sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
 .sbar{position:relative;height:20px;border-radius:7px;background:var(--grid);overflow:hidden;margin:7px 0}
 .sbar i{display:block;height:100%;background:var(--s3)}
 .sbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
   font-size:11.5px;font-weight:700;color:var(--text-primary)}
 td.num.win{color:var(--s3);font-weight:700}
 .nrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
   padding:11px 0;border-bottom:1px solid var(--grid)}
 .nrow:last-child{border-bottom:0}
 .nlab{min-width:0;flex:1 1 150px;display:flex;flex-direction:column;gap:2px;font-size:14px}
 .nlab .dim{font-size:12px;line-height:1.35}
 .nctl{flex:0 0 auto;display:flex;align-items:center;gap:8px}
 .nctl select{width:auto;min-width:132px;padding:7px 9px;font-size:13.5px}
 .nnum{display:inline-flex;align-items:center;gap:6px;background:var(--surface-1);border:1px solid var(--border);
   border-radius:9px;padding:2px 9px 2px 4px}
 .nnum input{width:78px;border:0;background:transparent;color:var(--text-primary);font:inherit;
   font-weight:700;font-size:14.5px;text-align:right;padding:6px 2px}
 .nnum input::-webkit-outer-spin-button,.nnum input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
 .nnum i{font-style:normal;font-size:12px;color:var(--text-secondary)}
 .dnyp{display:flex;flex-wrap:wrap;gap:6px}
 .dnyp button{padding:7px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface-1);
   color:var(--text-secondary);font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-width:40px}
 .dnyp button.on{background:var(--s1);border-color:var(--s1);color:#fff}
 .caslist{margin-top:8px;gap:8px}

<script type="text/plain" id="healthSrc">
// PEVE FIT — most z Apple Health do appky
// Scriptable · vygenerováno appkou. Nic tu nemusíš měnit.
//
// Volá se ze Zkratky akcí "Run Script" (Spustit skript) s parametrem:
//   spanek 7.5          · hodiny, minuty i vteřiny — pozná si to samo
//   vaha 94.2           · kilogramy
//   trenink 52 480      · minuty a spálené kalorie (kalorie nepovinné)
//   voda 1              · přidá sklenici
// Když skript spustíš přímo ve Scriptable, zeptá se sám.

const FAM = "__FAM__";
const ME  = "__ME__";
const KEY = "__KEY__";
const DB  = "__DB__";

/* ---------- vstupenka na server ---------- */
async function token(){
  const r = new Request("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + KEY);
  r.method = "POST";
  r.headers = { "Content-Type": "application/json" };
  r.body = JSON.stringify({ returnSecureToken: true });
  const j = await r.loadJSON();
  if (!j || !j.idToken) throw new Error("Server nepustil dovnitř. Zkontroluj připojení.");
  return j.idToken;
}

/* ---------- odeslání lístečku ---------- */
async function posli(obj){
  const t = await token();
  const r = new Request(DB + "/rodiny/" + FAM + "/inbox.json?auth=" + t);
  r.method = "POST";
  r.headers = { "Content-Type": "application/json" };
  r.body = JSON.stringify(obj);
  await r.loadJSON();
}

function dnesISO(){
  const d = new Date();
  const dv = n => (n < 10 ? "0" : "") + n;
  return d.getFullYear() + "-" + dv(d.getMonth() + 1) + "-" + dv(d.getDate());
}
function cislo(x){
  const n = parseFloat(String(x).replace(",", ".").replace(/[^\d.\-]/g, ""));
  return isNaN(n) ? 0 : n;
}

/* Health posílá trvání někdy v sekundách, jindy v minutách nebo hodinách.
   Radši si to přebereme tady, než aby to musel řešit člověk ve Zkratce. */
function naHodiny(v){
  if (v > 1000) return v / 3600;   // sekundy
  if (v > 24)   return v / 60;     // minuty
  return v;                        // rovnou hodiny
}
function naMinuty(v){
  if (v > 600) return v / 60;      // sekundy
  return v;
}

/* ---------- co přišlo ze Zkratky ---------- */
function vstup(){
  let p = args.shortcutParameter;
  if (p && typeof p === "object") p = p.value !== undefined ? p.value : JSON.stringify(p);
  if (p === undefined || p === null || String(p).trim() === ""){
    if (args.plainTexts && args.plainTexts.length) p = args.plainTexts[0];
  }
  return String(p === undefined || p === null ? "" : p).trim();
}

async function zeptejSe(){
  const a = new Alert();
  a.title = "PEVE FIT — Health";
  a.message = "Co poslat do appky? Například:\nspanek 7.5\nvaha 94.2\ntrenink 52 480";
  a.addTextField("spanek 7.5");
  a.addAction("Poslat");
  a.addCancelAction("Zrušit");
  const i = await a.presentAlert();
  return i === 0 ? a.textFieldValue(0) : "";
}

/* Jedna zkratka může poslat víc věcí naráz — každou na svůj řádek
   nebo oddělenou středníkem:  "spanek 7.5 ; vaha 94.2"            */
async function main(){
  let txt = vstup();
  if (!txt && config.runsInApp) txt = await zeptejSe();
  if (!txt) return "Nic k odeslání.";

  const casti = txt.split(/[\n;]+/).map(x => x.trim()).filter(x => x !== "");
  if (casti.length > 1){
    const vysledky = [];
    for (const cast of casti) vysledky.push(await jeden(cast));
    return vysledky.join("\n");
  }
  return await jeden(txt);
}

async function jeden(txt){
  const c = txt.split(/[\s,|]+/).filter(x => x !== "");
  const typ = (c[0] || "").toLowerCase()
    .replace(/[áà]/g, "a").replace(/[éě]/g, "e").replace(/í/g, "i")
    .replace(/[óô]/g, "o").replace(/[úů]/g, "u").replace(/ý/g, "y");
  const d = dnesISO();

  if (typ.indexOf("span") === 0 || typ.indexOf("sleep") === 0){
    const h = Math.round(naHodiny(cislo(c[1])) * 2) / 2;
    if (h <= 0 || h > 14) return "Divná hodnota spánku: " + c[1];
    await posli({ typ: "spanek", kdo: ME, d: d, h: h });
    return "😴 Spánek " + String(h).replace(".", ",") + " h zapsán.";
  }
  if (typ.indexOf("vah") === 0 || typ.indexOf("weight") === 0){
    const kg = Math.round(cislo(c[1]) * 10) / 10;
    if (kg < 30 || kg > 250) return "Divná váha: " + c[1];
    await posli({ typ: "vaha", kdo: ME, d: d, kg: kg });
    return "⚖️ Váha " + String(kg).replace(".", ",") + " kg zapsána.";
  }
  if (typ.indexOf("tren") === 0 || typ.indexOf("workout") === 0){
    const min = Math.round(naMinuty(cislo(c[1])));
    const kcal = Math.round(cislo(c[2]));
    if (min < 1 || min > 600) return "Divná délka tréninku: " + c[1];
    const nazev = c[3] ? c.slice(3).join(" ").slice(0, 20) : "Z hodinek";
    await posli({ typ: "trenink", kdo: ME, d: d, min: min, kcal: kcal, nazev: nazev });
    return "🏋️ Trénink " + min + " min" + (kcal ? " · " + kcal + " kcal" : "") + " zapsán.";
  }
  return "Neznámý typ: " + (c[0] || "(prázdné)") + ". Zkus spanek / vaha / trenink.";
}

let hlaska;
try { hlaska = await main(); }
catch (e){ hlaska = "Nepovedlo se: " + (e && e.message ? e.message : e); }

Script.setShortcutOutput(hlaska);
if (config.runsInApp){
  const a = new Alert();
  a.title = "PEVE FIT";
  a.message = hlaska;
  a.addAction("OK");
  await a.presentAlert();
}
Script.complete();
</script>
<script type="text/plain" id="widgetSrc">
// PEVE FIT — widget na plochu a zamčenou obrazovku
// Scriptable · vygenerováno appkou. Nic tu nemusíš měnit.
// Varianty: kolecko / obdelnik / radek (zamčená obrazovka), malý / střední (plocha)

const FAM = "__FAM__";
const ME  = "__ME__";
const KEY = "__KEY__";
const DB  = "__DB__";
const WEB = "__WEB__";

const BARVA = { p: new Color("#2a78d6"), v: new Color("#eb6834"),
                ok: new Color("#1baf7a"), dim: new Color("#8b8f98") };

// ---------- přihlášení (anonymní, token se schová do cache) ----------
async function token(){
  const fm = FileManager.local();
  const cesta = fm.joinPath(fm.cacheDirectory(), "pevefit-token.json");
  let d = null;
  if (fm.fileExists(cesta)){ try { d = JSON.parse(fm.readString(cesta)); } catch(e){} }
  if (d && d.id && d.exp > Date.now() + 60000) return d.id;

  let id = null, ref = null, exp = 0;
  if (d && d.ref){
    try {
      const r = new Request("https://securetoken.googleapis.com/v1/token?key=" + KEY);
      r.method = "POST";
      r.headers = { "Content-Type": "application/x-www-form-urlencoded" };
      r.body = "grant_type=refresh_token&refresh_token=" + encodeURIComponent(d.ref);
      const j = await r.loadJSON();
      if (j.id_token){ id = j.id_token; ref = j.refresh_token; exp = Date.now() + (+j.expires_in - 120) * 1000; }
    } catch(e){}
  }
  if (!id){
    const r = new Request("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + KEY);
    r.method = "POST";
    r.headers = { "Content-Type": "application/json" };
    r.body = JSON.stringify({ returnSecureToken: true });
    const j = await r.loadJSON();
    if (!j.idToken) throw new Error("Přihlášení selhalo");
    id = j.idToken; ref = j.refreshToken; exp = Date.now() + (+j.expiresIn - 120) * 1000;
  }
  fm.writeString(cesta, JSON.stringify({ id: id, ref: ref, exp: exp }));
  return id;
}

async function nacti(){
  const t = await token();
  const r = new Request(DB + "/rodiny/" + FAM + "/widget.json?auth=" + t);
  r.timeoutInterval = 12;
  const j = await r.loadJSON();
  return j || {};
}

// ---------- pomocníci ----------
const cislo = n => Math.round(n || 0).toLocaleString("cs-CZ").replace(/ /g, " ");
const pct = (a, b) => Math.max(0, Math.min(100, Math.round((a || 0) * 100 / (b || 1))));

// POZOR: widget je jen obrázek, který iOS překreslí, kdy se mu zachce.
// Relativní čas ("teď") by v tom obrázku zamrzl a lhal by. Proto ukazujeme
// pevné hodiny: čas dat a čas posledního překreslení. Ty se porovnají samy.
function hod(iso){
  const d = iso ? new Date(iso) : new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function stari(d){
  if (!d || !d.kdy) return hod() + " ⟳";
  const t = hod(d.kdy), n = hod();
  return t === n ? t : t + " ⟳" + n;
}
// delší verze pro střední widget, kde je místo
function stariDlouhy(d){
  if (!d || !d.kdy) return "kresleno " + hod();
  const t = hod(d.kdy), n = hod();
  return t === n ? "data " + t : "data " + t + " · kresleno " + n;
}
// je záznam čerstvý v okamžiku kreslení?
function cerstve(d){
  if (!d || !d.kdy) return false;
  return (Date.now() - new Date(d.kdy).getTime()) < 12 * 60000;
}

function coTed(d){
  if (!d) return { ic: "🍽️", t: "Otevři appku", p: "žádná data", url: WEB };
  if (d.sess) return { ic: "🏋️",
    t: "Trénink " + d.sess.rid + " běží" + (d.sess.kdo && d.sess.kdo !== ME && d.sess.jm ? " (" + d.sess.jm + ")" : ""),
    p: d.sess.hot + "/" + d.sess.cel + " sérií · " + d.sess.min + " min" + (d.sess.bud ? " · s " + d.sess.bud : ""),
    url: WEB + "?tab=trenink&akce=sess" };
  if (d.tr && !d.tr.hot) return { ic: "🏋️", t: "Dneska " + d.tr.co, p: "zatím nezapsáno", url: WEB + "?tab=trenink" };
  if (d.next) return { ic: "🍽️", t: d.next.cas + " · " + d.next.n, p: "další na řadě", url: WEB + "?tab=dnes" };
  const zbyva = (d.cil || 0) - (d.kcal || 0);
  if (zbyva > 0) return { ic: "🌙", t: cislo(zbyva) + " kcal do cíle", p: "dojeď to", url: WEB + "?tab=dnes" };
  return { ic: "✅", t: "Dnešek splněný", p: cislo(d.kcal) + " kcal", url: WEB + "?tab=progres" };
}

function pruh(st, hod, max, barva, sirka){
  const c = st.addStack();
  c.size = new Size(sirka, 5);
  c.cornerRadius = 2.5;
  c.backgroundColor = new Color("#8b8f98", 0.28);
  const i = c.addStack();
  i.size = new Size(Math.max(3, sirka * pct(hod, max) / 100), 5);
  i.cornerRadius = 2.5;
  i.backgroundColor = barva;
  c.addSpacer();            // ať pruh roste zleva, ne od středu
  return c;
}

function radek(st, popis, hod, max, jednotka, barva, sirka){
  const r = st.addStack();
  r.layoutHorizontally();
  r.size = new Size(sirka, 0);
  const a = r.addText(popis);
  a.font = Font.systemFont(10);
  a.textColor = BARVA.dim;
  r.addSpacer();
  const b = r.addText(cislo(hod) + " / " + cislo(max) + (jednotka || ""));
  b.font = Font.mediumSystemFont(10);
  b.textColor = pct(hod, max) >= 100 ? BARVA.ok : Color.dynamic(Color.black(), Color.white());
  st.addSpacer(3);
  pruh(st, hod, max, barva, sirka);
  st.addSpacer(7);
}

function pozadi(w){
  const g = new LinearGradient();
  g.colors = [
    Color.dynamic(new Color("#ffffff"), new Color("#1b1d22")),
    Color.dynamic(new Color("#eef3fa"), new Color("#14161a"))
  ];
  g.locations = [0, 1];
  w.backgroundGradient = g;
}

function nadpis(w, c, vpravo){
  const hl = w.addStack();
  hl.layoutHorizontally();
  hl.centerAlignContent();
  const nm = hl.addText("PEVE FIT");
  nm.font = Font.boldSystemFont(9.5);
  nm.textColor = BARVA[ME] || BARVA.p;
  hl.addSpacer();
  if (vpravo){
    const v = hl.addText(vpravo);
    v.font = Font.systemFont(9.5);
    v.textColor = BARVA.dim;
  }
  w.addSpacer(6);
  const t = w.addText(c.ic + " " + c.t);
  t.font = Font.boldSystemFont(14.5);
  t.lineLimit = 2;
  t.minimumScaleFactor = 0.85;
  const p = w.addText(c.p);
  p.font = Font.systemFont(10.5);
  p.textColor = BARVA.dim;
  p.lineLimit = 1;
}

function odstavec(st, ic, text, barva){
  const r = st.addStack();
  r.layoutHorizontally();
  const a = r.addText(ic + " " + text);
  a.font = Font.systemFont(10.5);
  a.textColor = barva || BARVA.dim;
  a.lineLimit = 1;
  st.addSpacer(4);
}

// ---------- zamčená obrazovka ----------
function kolecko(d){
  const w = new ListWidget();
  const c = coTed(d);
  w.url = c.url;
  if (d && d.sess){
    const e = w.addText("🏋️"); e.centerAlignText(); e.font = Font.systemFont(11);
    const t = w.addText(d.sess.hot + "/" + d.sess.cel);
    t.font = Font.boldSystemFont(15); t.centerAlignText();
  } else {
    const z = Math.max(0, ((d && d.cil) || 0) - ((d && d.kcal) || 0));
    const t = w.addText(pct(d && d.kcal, d && d.cil) + "%");
    t.font = Font.boldSystemFont(17); t.centerAlignText();
    const u = w.addText(z > 999 ? Math.round(z / 100) / 10 + "k" : cislo(z));
    u.font = Font.systemFont(9); u.centerAlignText(); u.textColor = BARVA.dim;
  }
  return w;
}

function obdelnik(d){
  const w = new ListWidget();
  const c = coTed(d);
  w.url = c.url;
  const h = w.addText(c.ic + " " + c.t);
  h.font = Font.boldSystemFont(13);
  h.lineLimit = 1;
  h.minimumScaleFactor = 0.8;
  const p = w.addText(c.p);
  p.font = Font.systemFont(11);
  p.textColor = BARVA.dim;
  p.lineLimit = 1;
  w.addSpacer(3);
  const s = w.addText("🔥 " + ((d && d.serie) || 0) + "   💧 " + ((d && d.voda) || 0) + "/" + ((d && d.vodaCil) || 0)
    + "   🍽 " + pct(d && d.kcal, d && d.cil) + "%   " + stari(d));
  s.font = Font.systemFont(10);
  s.textColor = BARVA.dim;
  s.lineLimit = 1;
  return w;
}

function radekWidget(d){
  const w = new ListWidget();
  const c = coTed(d);
  w.url = c.url;
  w.addText(c.ic + " " + c.t);
  return w;
}

// ---------- plocha ----------
function maly(d){
  const w = new ListWidget();
  const c = coTed(d);
  w.url = c.url;
  pozadi(w);
  w.setPadding(12, 13, 11, 13);
  nadpis(w, c, stari(d));
  w.addSpacer();
  radek(w, "kalorie", d && d.kcal, d && d.cil, "", BARVA[ME] || BARVA.p, 132);
  radek(w, "bílkoviny", d && d.prot, d && d.cilP, " g", BARVA.ok, 132);
  const s = w.addText("🔥 " + ((d && d.serie) || 0) + "   💧 " + ((d && d.voda) || 0) + "/" + ((d && d.vodaCil) || 0));
  s.font = Font.systemFont(10);
  s.textColor = BARVA.dim;
  return w;
}

function sloupecOsoba(st, d, barva, sirka){
  const s = st.addStack();
  s.layoutVertically();
  s.size = new Size(sirka, 0);
  const hl = s.addStack();
  hl.layoutHorizontally();
  hl.centerAlignContent();

/* ============ storage (safe) ============ */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem("pv_"+k); return v!==null ? JSON.parse(v) : (k in mem ? mem[k] : d); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k]=v; try{ localStorage.setItem("pv_"+k, JSON.stringify(v)); }catch(e){} }
};

/* Pozvánku z odkazu vyřídíme hned tady, dřív než se cokoli vykreslí —
   jinak by appka stihla založit zprávy se jmény původních majitelů. */
(function pozvankaHned(){
 const CISTY = { jm:"", pohl:"m", vek:30, vyska:178, vaha:80, cil:"drzet", akt:1.42, sada:"silova" };
 try {
  const q = new URLSearchParams(location.search);
  const kod = q.get("kod"), kdo = q.get("kdo");
  if (store.get("famId", null)) return;

  if (kod && /^[A-Z0-9-]{15,30}$/i.test(kod)){
   store.set("solo", false);
   store.set("famId", kod.toUpperCase());
   if (kdo === "p" || kdo === "v") store.set("meId", kdo);
   store.set("onb", true);
   return;
  }

  /* Buď přišel s pozvánkou „měj vlastní appku", nebo si appku prostě otevřel
     někdo úplně nový. V obou případech tu nemá co dělat cizí jméno — a platí
     to i pro spuštění z plochy, které má vlastní úložiště a čistou adresu. */
  const zna = store.get("meId", null) || store.get("profil_p", null)
           || store.get("profil_v", null) || store.get("onb", false);
  if (q.get("nova") === "1" || !zna){
   store.set("solo", true);
   store.set("meId", "p");
   store.set("profil_v", null);
   store.set("profil_p", Object.assign({}, CISTY, { jm: (q.get("jm") || "").slice(0,16) }));
   store.set("onb", false);
  }
 } catch(e){}
})();

/* 5. pád — „Radek" → „Radku", „Jana" → „Jano". U cizích jmen radši nechá
   první pád, než aby vyrobila zvěrstvo. */
function oslov(jm){
 const n = String(jm || "").trim();
 if (!n || n.length < 2) return n;
 if (/[aA]$/.test(n)) return n.slice(0,-1) + "o";                    // Jana → Jano, Honza → Honzo
 if (/[eěiíyýouůE]$/.test(n)) return n;                              // Marie, Niki, Lou — beze změny
 if (/(ch)$/i.test(n)) return n + "u";
 if (/[kg]$/.test(n)) return n.slice(0,-1) + (n.slice(-1) === "k" ? "ku" : "gu");
 if (/[hH]$/.test(n)) return n + "u";
 if (/[šžčřcjďťňsz]$/i.test(n)) return n + "i";                      // Tomáš → Tomáši
 if (/r$/.test(n) && /[bcdfghjklmnpqstvwxzř]r$/i.test(n)) return n.slice(0,-1) + "ře";  // Petr → Petře
 return n + "e";                                                     // Martin → Martine
}

function vahaZapis(who, kg){
 try {
  const iso = new Date().toISOString().slice(0,10);
  const arr = (wtArr(who) || []).filter(x => x.d !== iso).concat([{ d: iso, kg: kg }]);
  arr.sort((a,b)=>a.d.localeCompare(b.d));
  if (who === "p"){ state.wtP = arr; store.set("wtP", arr); }
  else { state.wtV = arr; store.set("wtV", arr); }
 } catch(e){}
}

 try {

 } catch(e){}
 return profil(who).vaha || 75;
}

 const c = CILE.find(x => x[0] === pr.cil) || CILE[1];
 const vydej = Math.round(bmr(pr, kg) * (pr.akt || 1.42));
 let kcal = Math.round(vydej * c[3] / 10) * 10;
 const podlaha = pr.pohl === "z" ? 1500 : 1800;
 if (kcal < podlaha) kcal = podlaha;
 const prot = Math.round(kg * c[4] / 5) * 5;
 const tuky = Math.round(kcal * 0.25 / 9 / 5) * 5;
 const sach = Math.max(0, Math.round((kcal - prot*4 - tuky*9) / 4 / 5) * 5);
 const voda = Math.max(1500, Math.round(kg * 34 / 250) * 250);
 return { bmr: bmr(pr, kg), vydej, kcal, prot, tuky, sach, voda,
          minKcal: Math.round(kcal * 0.87 / 10) * 10, kg, cil: c };
}

/* ================= SPÁNEK =================
   Sval neroste v posilovně — roste v posteli. Zapisuje se ráno jedním
   ťuknutím: kolik hodin a jak to bylo. Sdílí se jako všechno ostatní.  */
function spanekCil(who){ return nast("spanek_" + who, 8); }
function spanekGet(who, iso){
 const z = (store.get("spanek", {}) || {})[iso + "|" + who];
 return z && z.h ? z : null;
}
function spanekSet(who, iso, h, q){
 const all = store.get("spanek", {}) || {};
 const k = iso + "|" + who;
 if (h === null){ delete all[k]; }
 else {
  const st0 = all[k] || {};
  all[k] = { h: Math.max(0, Math.min(14, Math.round(h * 2) / 2)),
             q: (q !== undefined ? q : st0.q) || null };
 }
 store.set("spanek", all);
}
function spanekQ(who, iso, q){
 const z = spanekGet(who, iso);
 if (!z) return;
 spanekSet(who, iso, z.h, q);
}
const SPANEK_Q = [[1,"😵","rozlámaný"],[2,"😐","šlo to"],[3,"😴","jako miminko"]];
/* posledních N dní se záznamem */
function spanekDny(who, n){
 const out = [];
 for (let i = 0; i < n; i++){
  const iso = isoPlus(-i);
  const z = spanekGet(who, iso);
  out.push({ iso: iso, h: z ? z.h : null, q: z ? z.q : null });
 }
 return out;
}
function spanekPrumer(who, n){
 const dny = spanekDny(who, n).filter(x => x.h);
 if (dny.length < 2) return null;
 return Math.round(dny.reduce((a,x)=>a+x.h,0) / dny.length * 10) / 10;
}
/* kolik nocí v řadě splněný cíl */
function spanekSerie(who){
 let n = 0;
 for (let i = 0; i < 120; i++){
  const z = spanekGet(who, isoPlus(-i));
  if (z && z.h >= spanekCil(who)) n++;
  else if (i === 0) continue;      // dnešek se ještě může dopsat
  else break;
 }
 return n;
}
function spanekVeta(who){
 const pr = spanekPrumer(who, 7);
 if (pr === null) return "Zapisuj pár dní a appka ti řekne, jak na tom jsi.";
 const cil = spanekCil(who);
 if (pr >= cil) return "Průměr " + String(pr).replace(".", ",") + " h — přesně tak se staví postava. Držet.";
 if (pr >= cil - 0.5) return "Průměr " + String(pr).replace(".", ",") + " h — kousek pod cílem. Půlhodina dřív do postele to srovná.";
 if (pr >= cil - 1.5) return "Průměr " + String(pr).replace(".", ",") + " h — tělo dostává míň, než potřebuje. Regenerace i síla jedou na dluh.";
 return "Průměr " + String(pr).replace(".", ",") + " h — tohle je málo na trénink i na hubnutí. Spánek je první věc k opravě, ne poslední.";
}

function renderPick(){
 const el = document.getElementById("pickSheet");
 if (!el) return;
 const st = state.pick0;
 if (!st){ el.hidden = true; el.innerHTML = ""; return; }
 const sl = JIDLA_SLOTY.find(x => x.key === st.key);
 const list = sl.list();
 const akt = pickIso(st.iso)[st.key];
 const din = dinIso(st.iso);
 const dk = (st.who === "p" ? din.p : din.v).kcal;
 const d = new Date(st.iso + "T12:00:00");
 const den = st.iso === isoDnes() ? "dnes" : DAYS[wdOf(st.iso)] + " " + d.getDate() + ". " + (d.getMonth()+1) + ".";
 const q = (st.q || "").trim().toLowerCase();
 const fav = favJ();

 const idx = list.map((o,i)=>({o:o,i:i}))
   .filter(x => pkFiltr(x.o, st.f))
   .filter(x => !q || x.o.name.toLowerCase().indexOf(q) >= 0);

 // co je s hvězdičkou, jde nahoru — v pořadí, v jakém to bylo označené
 const poradiFav = n => { const i = fav.indexOf(n); return i < 0 ? 1e9 : i; };
 idx.sort((a,b)=>{
  const fa = poradiFav(a.o.name), fb = poradiFav(b.o.name);
  if (fa !== fb) return fa - fb;
  return a.i - b.i;
 });
 const kolikFav = idx.filter(x => fav.indexOf(x.o.name) >= 0).length;
 const deliciCara = (!q && st.f !== "fav" && kolikFav > 0 && kolikFav < idx.length) ? kolikFav : -1;

 const radky = idx.length ? idx.map((x, poz) => {
   const m = porceMult(st.who, st.key, x.o.kcal, dk);
   const por = porceText(m);
   const je = fav.indexOf(x.o.name) >= 0;
   return (poz === 0 && kolikFav > 0 && !q && st.f !== "fav" ? '<div class="pk-sec">⭐ Oblíbené</div>' : '')
    + (poz === deliciCara ? '<div class="pk-sec">Všechno ostatní</div>' : '')
    + '<div class="pk-item'+(x.i === akt ? " on" : "")+'">'
    +'<button class="pk-star'+(je?" on":"")+'" data-pkfav="'+esc(x.o.name)+'" type="button" aria-label="Oblíbené">'+(je?"★":"☆")+'</button>'
    +'<button class="pk-n" style="background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer" data-pksel="'+x.i+'" type="button">'
    + esc(x.o.name)
    +'<span class="pk-m">'+(por ? esc(por)+' · ' : '')+'základ '+fmt(x.o.kcal)+' kcal</span></button>'
    +'<span class="pk-k"><b>'+fmt(Math.round(x.o.kcal*m))+'</b>kcal · '+Math.round(x.o.prot*m)+' g</span>'
    +(x.i === akt ? '<span class="pk-tick">✓</span>' : '')
    +'</div>';
  }).join("")
  : '<div class="pk-none">Nic takového tu není. Zkus kratší slovo — třeba „vejce", „skyr" nebo „kuř". '
    +'Nebo si to <b>přidej jako vlastní recept</b> v Receptech.</div>';

 el.hidden = false;
 el.innerHTML =
  '<div class="pk-top">'
  +'<div class="pk-head"><div><h2>'+esc(sl.n)+'</h2>'
  +'<div class="sub">'+esc(den)+' · '+esc(BASE_T[st.who].name)+' · jídlo je společné pro oba</div></div>'
  +'<button class="ghost" id="pickClose" type="button">Zavřít</button></div>'
  +'<input type="search" class="pk-search" id="pickQ" placeholder="🔍 Hledej — vejce, skyr, kuře, rychlé…" '
  +'value="'+esc(st.q||"")+'" autocomplete="off">'
  +'<div class="pk-chips">'
  + PK_FILTRY.map(t=>{
      const n = t[0]==="all" ? list.length : list.filter(o=>pkFiltr(o,t[0])).length;
      return '<button class="'+(st.f===t[0]?"on":"")+'" data-pkf="'+t[0]+'" type="button">'+t[1]+' '+n+'</button>';
    }).join("")
  +'</div></div>'
  +'<div class="pk-count">'+idx.length+' '+pl(idx.length,"možnost","možnosti","možností")
  +' · ťukni a je vybráno'
  +(kolikFav ? ' · ⭐ '+kolikFav+' nahoře' : '')
  +' <button class="sh" id="pickRnd" type="button">🎲 náhodně</button></div>'
  + radky;
 const inp = document.getElementById("pickQ");
 if (inp && st.qFocus){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

/* Kolik z denního cíle připadá na které jídlo — počítá se z toho,
   co zbyde po večeři (ta má u každého vlastní, ručně nastavenou porci). */
const SLOT_PODIL = { sn: 0.30, sv1: 0.17, ob: 0.36, sv2: 0.17 };

function porceMult(who, key, zaklad, vecereKcal){
 if (!zaklad || zaklad < 60) return 1;
 const zbytek = Math.max(700, target(who).kcal - (vecereKcal || 0));
 const chci = zbytek * (SLOT_PODIL[key] || 0.25);
 let m = Math.round((chci / zaklad) * 4) / 4;
 return Math.max(0.5, Math.min(3, m));
}
function porceText(m){
 if (m === 1) return "";
 if (m === 0.5) return "půl porce";
 if (m === 0.75) return "¾ porce";
 if (m === 1.25) return "1¼ porce";
 if (m === 1.5) return "1½ porce";
 if (m === 1.75) return "1¾ porce";
 if (m === 2) return "dvojitá porce";
 if (m === 2.5) return "2½ porce";
 if (m === 3) return "trojitá porce";
 return String(m).replace(".", ",") + "× porce";
}
const JIDLA_SLOTY = [
 { key:"sn",  slot:"s0", cas:"7:00",  n:"Snídaně",           list:()=>J_SNIDANE },
 { key:"sv1", slot:"s1", cas:"10:30", n:"Dopolední svačina", list:()=>J_SVACINA },
 { key:"ob",  slot:"s2", cas:"13:00", n:"Oběd",              list:()=>J_OBED },
 { key:"sv2", slot:"s3", cas:"16:30", n:"Odpolední svačina", list:()=>J_SVACINA }
];

function planForIso(who, iso){
 const pk = pickIso(iso);
 const din = dinIso(iso);
 const d = who === "p" ? din.p : din.v;
 const out = JIDLA_SLOTY.map(sl => {
  const list = sl.list();
  const idx = Math.min(Math.max(0, pk[sl.key] | 0), list.length - 1);
  const o = list[idx] || list[0];
  const m = porceMult(who, sl.key, o.kcal, d.kcal);
  return { slot: sl.slot, time: posunCas(sl.cas), sekce: sl.n,
           name: o.name, kcal: Math.round(o.kcal * m), prot: Math.round(o.prot * m),
           mult: m, opts: list, key: sl.key, idx: idx };
 });
 out.push({ slot:"s4", time: posunCas("19:30"), sekce:"Večeře",
            name: din.name + " — " + d.por, kcal: d.kcal, prot: d.prot, mult: 1 });
 return out;
}

function suggest(needK, needP){
 // greedy: dokud chybí bílkoviny, ber nejlepší poměr B/kcal; pak dopl kalorie
 const pool = FILLERS.slice();
 const out = [];
 let k = needK, p = needP, guard = 0;
 while ((p > 8 || k > 180) && out.length < 4 && guard++ < 40){
  let best = null, bestScore = -1;
  pool.forEach((f, idx) => {
   if (f.k > k + 200) return;                       // nepřestřelit moc
   const score = p > 8 ? (f.p * 10 - Math.abs(f.k - k) * 0.02)
                       : (f.k <= k + 120 ? f.k : -1);
   if (score > bestScore){ bestScore = score; best = idx; }
  });
  if (best === null) break;
  const f = pool.splice(best, 1)[0];
  out.push(f); k -= f.k; p -= f.p;
 }
 return out;
}

function sugHtml(needK, needP){
 const s = suggest(needK, needP);
 if (!s.length) return '<div class="sugres dim">Na tohle už stačí jedna lžíce oleje navíc do jídla.</div>';
 const sk = s.reduce((a,x)=>a+x.k,0), sp = s.reduce((a,x)=>a+x.p,0);
 return '<div class="sugres"><b>Dej si:</b><ul>'
  + s.map(x=>'<li>'+esc(x.n)+' <span class="dim">'+x.k+' kcal · '+x.p+' g</span></li>').join("")
  + '</ul><div class="dim">Dohromady '+fmt(sk)+' kcal a '+sp+' g bílkovin — chybělo '+fmt(needK)+' kcal a '+needP+' g.</div></div>';
}

/* odhad času vaření podle typu a počtu kroků */
function recTime(r){
 if (r.out) return null;
 const dlouhy = r.steps.length >= 4;
 return { rychlo: dlouhy ? "25–35 min" : "do 25 min",
          svet:   dlouhy ? "40–50 min" : "30–40 min",
          klasika:dlouhy ? "45–60 min" : "35–45 min",
          moje:   dlouhy ? "45–60 min" : "35–45 min",
          trouba: dlouhy ? "90 min +"  : "60–90 min" }[tagOf(r)] || "35–45 min";
}
const SCALES = [[1,"1× (my dva)"],[1.5,"1,5× (návštěva)"],[2,"2× (meal prep)"]];
function qty(n){ const v = Math.round(n * state.scale * 100)/100; return fmt(v); }

/* spíž — nejčastější suroviny napříč recepty */
function pantryList(){
 const cnt = {};
 DINNERS.forEach(r => r.ing.forEach(x => { cnt[x[0]] = (cnt[x[0]]||0)+1; }));
 return Object.keys(cnt).sort((a,b)=> cnt[b]-cnt[a] || a.localeCompare(b,"cs")).slice(0,24);
}
function chybi(r){
 const have = state.pantry;
 return r.ing.map(x=>x[0]).filter(n => !have.includes(n));
}

/* Běží appka z ikony na ploše, nebo jen v prohlížeči? Na iPhonu má appka
   z ikony vlastní úložiště — proto instalace musí být PRVNÍ krok, jinak
   by nové nastavení zůstalo v Safari a ikona by startovala načisto.     */
function jeNainstalovana(){
 try {
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
    || window.navigator.standalone === true;
 } catch(e){ return false; }
}
function jeIphone(){ return /iPhone|iPad|iPod/i.test(navigator.userAgent); }

/* pořadí kroků se skládá podle situace */
function onbKroky(){
 const k = ["vitej"];
 if (!jeNainstalovana()) k.push("instal");
 k.push("profil");                     // v režimu pro dva = výběr, kdo drží telefon
 k.push(solo() ? "parak" : "pair");
 k.push("hotovo");
 return k;
}

/* ---- kuchařský režim ---- */
let wakeLock = null;
async function keepAwake(on){
 try {
  if (on && "wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); }
  else if (wakeLock){ wakeLock.release(); wakeLock = null; }
 } catch(e){}
}
function openCook(id){
 state.cook = { id: id, step: -1 };
 keepAwake(true);
 renderCook();
}
function closeCook(){
 state.cook = null; keepAwake(false);
 const o = document.getElementById("cookOverlay");
 o.hidden = true; o.innerHTML = "";
 document.body.style.overflow = "";
}
function renderCook(){
 const o = document.getElementById("cookOverlay");
 if (!state.cook){ o.hidden = true; return; }
 const r = dinnerById(state.cook.id), st = state.cook.step, n = r.steps.length;
 document.body.style.overflow = "hidden";
 o.hidden = false;
 const dots = '<div class="dots">'+r.steps.map((_,i)=>'<i class="'+(i<=st?"on":"")+'"></i>').join("")+'</div>';
 let telo;
 if (st < 0){
  telo = '<div class="cstep">Nachystej si</div>'
   +'<div class="tset">'+SCALES.map(x=>'<button class="pchip'+(state.scale===x[0]?" on":"")+'" '
     +'data-scale="'+x[0]+'" type="button">'+esc(x[1])+'</button>').join("")+'</div>'
   +'<ul class="cing">'+r.ing.map(x=>'<li>'+esc(x[0])+' — <b>'+qty(x[1])+' '+esc(x[2])+'</b></li>').join("")+'</ul>'
   +'<p class="who" style="margin-top:14px">'+(duo()?esc(jmeno("v"))+' '+esc(r.v.por)+' · '+esc(jmeno("p"))+' '+esc(r.p.por)
      :esc(jmeno(ja()))+' '+esc(ja()==="v"?r.v.por:r.p.por))
   +' · odhadem '+recTime(r)+'</p>';
 } else if (st < n){
  telo = '<div class="cstep">Krok '+(st+1)+' z '+n+'</div>'
   +'<p class="ctext">'+esc(r.steps[st])+'</p>'
   +'<div class="tset">'
   + [["5:00","5 min"],["10:00","10 min"],["20:00","20 min"],["40:00","40 min"]].map(t=>
      '<button class="pchip" data-timer="'+t[0]+'" type="button">⏱ '+t[1]+'</button>').join("")
   +'</div>';
 } else {
  telo = '<div class="cstep">Hotovo</div>'
   +'<p class="ctext">Uvařeno! 🍽️ Nezapomeň si to odškrtnout v Dnes — a zbytek rovnou do krabičky na zítřejší oběd.</p>';
 }
 const zpet = st < 0 ? "" : '<button class="ghost" data-cook="prev" type="button">← Zpět</button>';
 const vpred = st >= n
  ? '<button class="act" data-cook="close" type="button">Zavřít ✓</button>'
  : '<button class="act" data-cook="next" type="button">'+(st < 0 ? "Začít vařit →" : (st === n-1 ? "Hotovo ✓" : "Další krok →"))+'</button>';
 o.innerHTML = '<div class="chead"><h2>'+esc(r.name)+'</h2>'
  +'<button class="xbtn" data-cook="close" type="button">Zavřít</button></div>'
  + dots + telo + '<div class="cnav">'+zpet+vpred+'</div>';
 window.scrollTo(0,0);
}

function parseIng(radek){
 const t = String(radek).trim().replace(/\s+/g," ");
 if (!t) return null;
 const m = t.match(/^(.+?)[\s—–-]+(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|ks|bal|balení|lžíce|hrst|plátky|stroužky)?\.?$/i);
 if (m) return [m[1].replace(/[\s—–-]+$/,"").trim(), parseFloat(m[2].replace(",",".")), (m[3]||"ks")];
 return [t, 0, ""];
}

/* Vyhrává nejdelší shoda, ne pořadí sekcí — jinak „arašídové máslo"
   skončí u másla a „kokosové mléko" u mléka. */
function oddeleniPro(nazev){
 const t = String(nazev).toLowerCase();
 let nej = null, delka = 0;
 for (const o of ODDELENI) o[2].forEach(k => {
  if (t.indexOf(k) >= 0 && k.length > delka){ delka = k.length; nej = o[0]; }
 });
 return nej || "ostatni";
}
/* ---- normalizace jednotek a zaokrouhlení na balení ---- */
function normUnit(q, u){
 if (u === "kg") return [q*1000, "g"];
 if (u === "l")  return [q*1000, "ml"];
 return [q, u];
}
function baleni(q, u){
 if (u === "g"){  return q >= 1000 ? [Math.ceil(q/100)/10, "kg"] : [Math.ceil(q/50)*50, "g"]; }
 if (u === "ml"){ return q >= 1000 ? [Math.ceil(q/100)/10, "l"]  : [Math.ceil(q/100)*100, "ml"]; }
 if (u === "ks" || u === "bal") return [Math.ceil(q), u];
 return [Math.round(q*100)/100, u];
}
function mamDoma(nazev){
 return state.spizOdecist && (state.pantry || []).some(p => p.toLowerCase() === String(nazev).toLowerCase());
}

/* ============ Nedělní příprava ============ */
function nedeleIso(){
 const d = new Date();
 const do_ned = (7 - d.getDay()) % 7;   // 0 = dnes je neděle
 d.setDate(d.getDate() + do_ned);
 return d.toISOString().slice(0,10);
}
function prepKroky(){
 const tyden = Array.from({length:7}, (_,i)=>dinIso(isoPlus(i)));
 const videnoR = {};
 const dopredu = tyden.filter(r => {
  if (r.out || (tagOf(r) !== "trouba" && tagOf(r) !== "klasika")) return false;
  if (videnoR[r.id]) return false;
  videnoR[r.id] = 1; return true;
 }).slice(0,2);
 const kroky = [
  ["Nákup podle seznamu výše", "Celý týden na jeden zátah. Co není doma, to se večer nesní.", 45],
  ["10 vajec natvrdo", "Devět minut varu, pak do studené vody. Vydrží týden a vyřeší svačiny i autobagy.", 12],
  ["6 autobagů do auta", "Ořechy, tyčinka, čoko mléko, sušené ovoce. Ber je ráno, ať už den dopadne jakkoli.", 10]
 ];
 dopredu.forEach(r => kroky.push(["Uvařit dopředu: "+r.name,
   "Vydrží dva dny a je z toho i oběd do krabičky. Ve všední den pak stačí ohřát.", r.tag === "trouba" ? 50 : 35]));
 kroky.push(["Nakrájet zeleninu na tři dny", "Okurka, paprika, mrkev do krabičky. Když je nachystaná, sní se; když ne, zvadne.", 10]);
 kroky.push(["Navážit vločky a ořechy do sáčků", "Pět sáčků na ranní shake. Ráno se pak nic neváží, jen sype.", 6]);
 kroky.push(["Ranní vážení a zápis do Progresu", "Nalačno, po WC, oba. Bez tohohle appka neví, jestli to funguje.", 3]);
 return kroky;
}

function remSel(){
 const ulozeno = state.rem;
 if (ulozeno && typeof ulozeno === "object") return ulozeno;

 PRIPOMINKY.forEach(p => d[p.id] = p.def);

function dvoj(n){ return String(n).padStart(2,"0"); }
function icsStamp(d, hhmm){
 const p = hhmm.split(":");
 return d.getFullYear()+dvoj(d.getMonth()+1)+dvoj(d.getDate())+"T"+dvoj(+p[0])+dvoj(+p[1])+"00";
}
function plusMin(hhmm, min){
 const p = hhmm.split(":");
 const t = (+p[0])*60 + (+p[1]) + min;
 return dvoj(Math.floor(t/60) % 24)+":"+dvoj(t % 60);
}
function nextDow(dow){            // 1 = pondělí … 7 = neděle
 const d = new Date();
 const cur = d.getDay() === 0 ? 7 : d.getDay();
 d.setDate(d.getDate() + ((dow - cur + 7) % 7));
 return d;
}
function prvniPristiho(){
 const d = new Date();
 return new Date(d.getFullYear(), d.getMonth() + (d.getDate() > 1 ? 1 : 0), 1);
}
const DOW_ICS = ["","MO","TU","WE","TH","FR","SA","SU"];

/* UID musí být pro danou připomínku VŽDY stejné, jinak kalendář při dalším
   stažení nepozná, že jde o tutéž událost, a nasype si tam kopie.            */
function icsUid(id, i){ return "pf-" + id + "-" + i + "@pevefit"; }
/* Pořadové číslo verze — vyšší číslo řekne kalendáři „tohle je novější".
   Musí jenom růst, takže si ho držíme sami; hodinové razítko by se jednou
   přetočilo a od té chvíle by kalendář všechny další verze ignoroval. */
function icsSeq(){
 const n = (store.get("icsSeq", 0) || 0) + 1;
 store.set("icsSeq", n);
 return n;
}
/* text v .ics: escapovat čárky, středníky a zalomit dlouhé řádky na 75 znaků */
function icsEsc(t){
 return String(t == null ? "" : t)
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,")
  .replace(/\r?\n/g, "\\n");
}
function icsFold(radky){
 const out = [];
 radky.forEach(r => {
  let x = String(r);
  if (x.length <= 74){ out.push(x); return; }
  out.push(x.slice(0, 74));
  x = x.slice(74);
  while (x.length > 73){ out.push(" " + x.slice(0, 73)); x = x.slice(73); }
  if (x.length) out.push(" " + x);
 });
 return out;
}
function icsNyni(){
 const d = new Date();
 const dv = n => (n < 10 ? "0" : "") + n;
 return d.getUTCFullYear() + dv(d.getUTCMonth()+1) + dv(d.getUTCDate()) + "T"
      + dv(d.getUTCHours()) + dv(d.getUTCMinutes()) + dv(d.getUTCSeconds()) + "Z";
}

function icsText(who){
 const sel = remSel();
 const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//PEVE FIT//CS","CALSCALE:GREGORIAN",
            "METHOD:PUBLISH","X-WR-CALNAME:PEVE FIT — připomínky"];
 const seq = icsSeq();
 const stamp = icsNyni();
 let n = 0;
 PRIPOMINKY.filter(p => sel[p.id]).forEach(p => {
  p.ev(who).forEach((e, ei) => {
   const zac = e.freq === "WEEKLY" ? nextDow(e.dow) : (e.freq === "MONTHLY" ? prvniPristiho() : new Date());
   const rrule = e.freq === "WEEKLY" ? "FREQ=WEEKLY;BYDAY="+DOW_ICS[e.dow]
               : (e.freq === "MONTHLY" ? "FREQ=MONTHLY;BYMONTHDAY="+e.den : "FREQ=DAILY");
   const alarm = e.alarm || 0;
   n++;
   L.push("BEGIN:VEVENT",
     "UID:"+icsUid(p.id, ei),
     "SEQUENCE:"+seq,
     "DTSTAMP:"+stamp,
     "DTSTART:"+icsStamp(zac, e.cas),
     "DTEND:"+icsStamp(zac, plusMin(e.cas, e.min || 10)),
     "RRULE:"+rrule,
     "SUMMARY:"+icsEsc(e.nazev),
     "DESCRIPTION:"+icsEsc(e.popis+" — z appky PEVE FIT"),
     "TRANSP:TRANSPARENT",
     "BEGIN:VALARM","TRIGGER:-PT"+alarm+"M","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(e.nazev),"END:VALARM",
     "END:VEVENT");
  });
 });
 L.push("END:VCALENDAR");
 return { text: icsFold(L).join("\r\n"), pocet: n };
}

/* Zrušovací soubor: pošle kalendáři "tyhle události zruš".
   Kryje i staré, chybně očíslované UID z dřívějších stažení — proto ten rozsah. */
function icsStorno(){
 const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//PEVE FIT//CS","CALSCALE:GREGORIAN",
            "METHOD:CANCEL","X-WR-CALNAME:PEVE FIT — připomínky"];
 const ted = icsStamp(new Date(), "08:00");
 const konec = icsStamp(new Date(), "08:05");
 let n = 0;
 const push = (uid) => {
  L.push("BEGIN:VEVENT",
    "UID:" + uid,
    "DTSTART:" + ted,
    "DTEND:" + konec,
    "SEQUENCE:99999",
    "STATUS:CANCELLED",
    "SUMMARY:PEVE FIT — zrušeno",
    "END:VEVENT");
  n++;
 };
 PRIPOMINKY.forEach(p => {
  for (let i = 0; i < 12; i++) push(icsUid(p.id, i));      // nové stabilní UID
  for (let k = 0; k < 50; k++) push("pf" + k + "-" + p.id + "@pevefit"); // staré posunuté UID
 });
 L.push("END:VCALENDAR");
 return { text: L.join("\r\n"), pocet: n };
}

/* ============ Trénink — deník ============ */
const INC_5KG = ["squat","deadlift","legpress","hacksquat","rdl","hipthrust"];
const incFor = id => INC_5KG.includes(id) ? 5 : 2.5;

function logAll(){ return store.get("tlog", {}); }
function logGet(who, ex){ return logAll()[who+"|"+ex] || []; }
function logSave(who, ex, arr){
  const all = logAll();
  if (arr.length) all[who+"|"+ex] = arr.slice(-40); else delete all[who+"|"+ex];
  store.set("tlog", all);
}
function logAdd(who, ex, kg, reps){
  const arr = logGet(who, ex).slice();
  const iso = new Date().toISOString().slice(0,10);
  let sess = arr.find(x => x.d === iso);
  if (!sess){ sess = { d: iso, s: [] }; arr.push(sess); }
  sess.s.push([kg, reps]);
  arr.sort((a,b)=>a.d.localeCompare(b.d));
  logSave(who, ex, arr);
}
function logDelSet(who, ex, i){
  const arr = logGet(who, ex).slice();
  const iso = new Date().toISOString().slice(0,10);
  const sess = arr.find(x => x.d === iso);
  if (!sess) return;
  sess.s.splice(i, 1);
  logSave(who, ex, sess.s.length ? arr : arr.filter(x => x.d !== iso));
}
function topSet(sets){
  return sets.reduce((a,b)=> (b[0] > a[0] || (b[0] === a[0] && b[1] > a[1])) ? b : a, sets[0]);
}
function repTarget(str){
  const t = String(str);
  if (/co dáš/i.test(t) || /\d\s*s\b/.test(t)) return null;
  const m = t.match(/(\d+)\s*×\s*(\d+)(?:\s*[–-]\s*(\d+))?/);
  if (!m) return null;
  return { sets:+m[1], lo:+m[2], hi:+(m[3] || m[2]) };
}
function czDate(iso){
 if (!iso || typeof iso !== "string" || iso.indexOf("-") < 0) return "—"; const p = iso.split("-"); return (+p[2])+". "+(+p[1])+"."; }

function kgSpark(sessions){
  const pts = sessions.slice(-10).map(x => topSet(x.s)[0]).filter(v => v > 0);
  if (pts.length < 3) return "";
  const w = 300, h = 38, pad = 4;
  const mn = Math.min(...pts), mx = Math.max(...pts), sp = (mx - mn) || 1;
  const xy = pts.map((v,i)=>[ pad + i*(w-2*pad)/(pts.length-1), h-pad - (v-mn)/sp*(h-2*pad) ]);
  return '<svg class="kspark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Vývoj váhy u cviku">'
   +'<polyline points="'+xy.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" fill="none" '
   +'stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
   +'<circle cx="'+xy[xy.length-1][0].toFixed(1)+'" cy="'+xy[xy.length-1][1].toFixed(1)+'" r="4" '
   +'fill="var(--s1)" stroke="var(--surface-1)" stroke-width="2"/></svg>';
}

function logBox(who, exId, presc, pauza){
  const rz = rezim(exId, presc);
  const ph = REZIM_POPIS[rz] || REZIM_POPIS.kg;
  const sessions = logGet(who, exId);
  const iso = new Date().toISOString().slice(0,10);
  const dnes = sessions.find(x => x.d === iso);
  const minule = sessions.filter(x => x.d !== iso).slice(-1)[0];
  const tg = repTarget(presc);

  let hist = '<div class="logline">Zatím sem nic nezapsáno — první série se stane měřítkem.</div>';
  if (minule){
    hist = '<div class="logline">Minule <b>'+czDate(minule.d)+'</b>: '
      + minule.s.map(x => serieText(rz, x[0], x[1])).join(' · ') + '</div>';
  }
  let rada = "";
  if (rz !== "kg"){
    rada = '<div class="logline">Tady se zapisují <b>'+ph.jed+'</b> — kila u tohohle cviku nedávají smysl.'
      + (rz === "reps" ? ' Přidávej opakování, ne váhu.' : '')
      + (rz === "cas" ? ' Výdrž prodlužuj po pěti vteřinách.' : '')
      + (rz === "kardio" ? ' Zapiš, kolik minut jsi jel(a).' : '')
      + (rz === "strec" ? ' Drž 30–45 vteřin a nepruž.' : '')
      + '</div>';
  }
  else if (tg && minule){
    const ok = minule.s.length >= tg.sets && minule.s.every(x => x[1] >= tg.hi);
    const kg = topSet(minule.s)[0];
    if (ok && kg) rada = '<div class="logline tip-up">✓ Minule jsi dal(a) všechny série na horní hranici — '
      +'dneska jdi na <b>'+fmt(Math.round((kg + incFor(exId))*10)/10)+' kg</b>.</div>';
    else if (kg) rada = '<div class="logline">Cíl: <b>'+tg.sets+' série po '+tg.hi+' opakováních</b> s '+fmt(kg)+' kg.</div>';
  }
  const chips = dnes && dnes.s.length
    ? '<div class="setchips">'+dnes.s.map((x,i)=>'<span class="setchip">'+serieText(rz, x[0], x[1])
        +'<button data-delset="'+who+'|'+exId+'|'+i+'" title="Smazat">×</button></span>').join("")+'</div>'
    : "";
  const dopor = rz === "kg" ? dalsiVaha(who, exId, presc) : null;
  const posl = dopor ? [dopor.kg] : (minule && rz === "kg" ? topSet(minule.s) : null);
  return '<div class="logbox">' + hist + rada + (rz === "kg" ? kgSpark(sessions) : "") + chips
   +'<div class="logrow'+(rz!=="kg"?" bezkg":"")+'">'
   + (rz === "kg"
      ? '<input type="number" step="0.5" min="0" max="500" inputmode="decimal" id="lg-'+who+'-'+exId+'-kg" '

/* ============ Plán tréninků ============ */
const MIN_TR = { p: 4, v: 3 };
const ROZVRH = { p: [[1,"A"],[2,"N"],[4,"C"],[6,"G"]], v: [[1,"FB1"],[2,"FB2"],[4,"FB4"]] };
function minTr(who){ return nast("mintr_"+who, MIN_TR[who]); }
function rozvrh(who){ return nast("rozvrh_"+who, ROZVRH[who]) || []; }

function pondeli(posun){
 const d = new Date();
 const cur = d.getDay() === 0 ? 7 : d.getDay();
 d.setDate(d.getDate() - (cur - 1) + (posun||0)*7);
 d.setHours(12,0,0,0);
 return d;
}
function isoZ(d){ return d.getFullYear()+"-"+dvoj(d.getMonth()+1)+"-"+dvoj(d.getDate()); }
function planDne(iso){ return state.plan[iso] || {}; }
function planSet(iso, who, rid){
 const d = Object.assign({}, state.plan[iso] || {});
 if (rid) d[who] = rid; else delete d[who];
 if (Object.keys(d).length) state.plan[iso] = d; else delete state.plan[iso];
 store.set("plan", state.plan);
 if (window.sync && sync.on) sync.pushPlan();
}
function odtrenovano(iso, who){
 return (state.hist || []).some(h => h.d === iso && h.who === who);
}
function tydenPocty(posun){
 const zac = pondeli(posun), dnes = isoZ(new Date());
 let p = 0, v = 0;
 for (let i = 0; i < 7; i++){
  const d = new Date(zac); d.setDate(zac.getDate()+i);
  const x = planDne(isoZ(d));
  if (x.p) p++;
  if (x.v) v++;
 }
 // u probíhajícího týdne se cíl krátí podle toho, kolik tréninkových dnů ještě zbývá
 const cil = {};
 ["p","v"].forEach(who=>{
  if (posun > 0){ cil[who] = minTr(who); return; }
  let zbyva = 0;
  rozvrh(who).forEach(r=>{
   const d = new Date(zac); d.setDate(zac.getDate() + (r[0]-1));
   if (isoZ(d) >= dnes) zbyva++;
  });
  cil[who] = Math.min(minTr(who), Math.max(zbyva, (who==="p"?p:v)));
 });
 return { p:p, v:v, cp:cil.p, cv:cil.v };
}
/* okno se posouvá samo: každý týden odpadne ten starý a přibude nový prázdný */
function uklidPlan(){
 const hranice = new Date(); hranice.setDate(hranice.getDate() - 70);
 const h = isoZ(hranice);
 let smazano = 0;
 Object.keys(state.plan).forEach(k => { if (k < h){ delete state.plan[k]; smazano++; } });
 if (smazano) store.set("plan", state.plan);
}
function planChybi(){
 let celkem = 0, potreba = 0;
 for (let w = 0; w < 4; w++){ const t = tydenPocty(w); celkem += t.p + t.v; potreba += t.cp + t.cv; }
 return Math.max(0, potreba - celkem);
}
function planPripominka(){
 const chybi = planChybi();
 if (!chybi) return;
 // jednou týdně, klíč je pondělí aktuálního týdne
 pushMsg("plan-"+isoZ(pondeli(0)), "📅", "Plán tréninků dojíždí",
   "Ve čtyřtýdenním okně chybí "+chybi+" "+(chybi===1?"trénink":(chybi<5?"tréninky":"tréninků"))
   +". Otevři Trénink → Plán a dej „Doplnit podle rozvrhu\" — je to na jedno kliknutí.");
}

function doplnPlan(){
 for (let w = 0; w < 4; w++){
  const zac = pondeli(w);
  ["p","v"].forEach(who => {
   rozvrh(who).forEach(r => {
    const d = new Date(zac); d.setDate(zac.getDate() + (r[0]-1));
    const iso = isoZ(d);
    if (isoZ(d) < isoZ(new Date())) return;            // minulost neplánujeme
    const dnes = planDne(iso);
    if (dnes[who]) return;                              // co je zadané, neměníme
    planSet(iso, who, r[1]);
   });
  });
 }
}
function vycistitPlan(){
 const dnes = isoZ(new Date());
 Object.keys(state.plan).forEach(k => { if (k >= dnes) delete state.plan[k]; });

}

function zaText(m){
 if (m <= 0) return "teď";

 return "za "+h+" h"+(z ? " "+z+"′" : "");

 if (!me || !BASE_T[me])

 const out = [];
 if (state.sess && state.sess.who === me){

    tab:"trenink", cls:"bezi" });
 }

 const pt = peerTrenink();
 if (pt && pt.cerstve){

    kdy: (zp === null ? pt.s.min+" min" : (zp === 0 ? "poslední série" : "~"+zp+" min do konce")), tab:"trenink" });
 }

 const ted = new Date(), nyni = ted.getHours()*60 + ted.getMinutes();
 const dow = todayIdx + 1, iso = dateOfWeekday(todayIdx);
 const fronta = [];

 const dnesPlan = planDne(iso)[me];
 if (!out.length) (treninky(me) || []).forEach(t => {
  if (t[0] !== dow) return;
  if (dnesPlan && odtrenovano(iso, me)) return;
  const m = minutyZ(t[1]);
  if (m + 120 < nyni) return;
  const co = dnesPlan || (me === "p" ? QUEUE[state.queue] : V_QUEUE[state.fb % V_QUEUE.length]);
  fronta.push({ m:m, ic:"🏋️", tx:"<b>Trénink "+t[1]+"</b> — "+co, tab:"trenink" });
 });

 planFor(me, todayIdx).forEach(j => {
  if (state.checks[iso+"|"+me+"|"+j.slot]) return;
  const m = minutyZ(j.time);
  if (m + 150 < nyni) return;
  fronta.push({ m:m, ic:"🍽️", tx:"<b>"+j.time+"</b> · "+esc(j.name), tab:"dnes" });
 });

 fronta.sort((a,b)=>a.m-b.m).forEach(x=>{
  if (out.length < 3) out.push({ ic:x.ic, tx:x.tx, kdy:zaText(x.m - nyni), tab:x.tab });
 });

 // doplňky, když už toho dneska moc nezbývá

 if (tot.k < t.kcal) zaloha.push({ ic:"🌙", tx:"Do cíle zbývá <b>"+fmt(t.kcal-tot.k)+" kcal</b>", kdy:fmt(tot.k)+" snědeno", tab:"dnes", cls:"male" });
 else if (tot.p < t.prot) zaloha.push({ ic:"🥚", tx:"Chybí <b>"+(t.prot-tot.p)+" g bílkovin</b>", kdy:"dojeď to", tab:"dnes", cls:"male" });
 else zaloha.push({ ic:"✅", tx:"<b>Dnešek splněný</b> — "+fmt(tot.k)+" kcal", kdy:"paráda", tab:"progres", cls:"hotovo male" });

 const sk = waterGet(me, iso), cilSk = Math.round(waterCil(me)/GLASS);
 zaloha.push(sk >= cilSk
  ? { ic:"💧", tx:"<b>Voda splněná</b> — "+(waterCil(me)/1000).toLocaleString("cs-CZ")+" l", kdy:"✓", tab:"dnes", cls:"male" }
  : { ic:"💧", tx:"Voda <b>"+(sk*GLASS/1000).toLocaleString("cs-CZ")+" / "+(waterCil(me)/1000).toLocaleString("cs-CZ")+" l</b>", kdy:"ještě "+(cilSk-sk)+"×", tab:"dnes", cls:"male" });

 const st = streak(me);
 if (st > 0) zaloha.push({ ic:"🔥", tx:"Série <b>"+st+" "+(st===1?"den":(st<5?"dny":"dní"))+" v řadě</b>", kdy:"neztrať ji", tab:"progres", cls:"male" });

 // příští trénink, když dnes žádný není
 if (!fronta.some(x=>x.ic==="🏋️") && !state.sess){
  const dnyCZ = ["","Po","Út","St","Čt","Pá","So","Ne"];
  let nej = null;
  (treninky(me) || []).forEach(x=>{
   const posun = ((x[0] - dow) + 7) % 7;
   const klic = posun === 0 ? 7 : posun;
   if (!nej || klic < nej.k) nej = { k:klic, d:x[0], cas:x[1] };
  });
  if (nej) zaloha.push({ ic:"🏋️", tx:"Další trénink <b>"+dnyCZ[nej.d]+" "+nej.cas+"</b>",
    kdy: nej.k === 1 ? "zítra" : "za "+nej.k+" dny", tab:"trenink", cls:"male" });
 }

 zaloha.forEach(z => { if (out.length < 3) out.push(z); });
 return out.slice(0,3);
}

function profilCard(who){

     +'</select>')

  +'<tr><td>Klidový výdej</td><td class="num">'+fmt(v.bmr)+' kcal</td></tr>'
  +'<tr><td>Celkový denní výdej</td><td class="num">'+fmt(v.vydej)+' kcal</td></tr>'
  +'<tr><td><b>Denní cíl</b></td><td class="num"><b>'+fmt(cilKcal(who))+' kcal</b>'
    +(rucneK?' <span class="dim">(ručně)</span>':'')+'</td></tr>'
  +'<tr><td>Bílkoviny</td><td class="num">'+cilProt(who)+' g'+(rucneP?' <span class="dim">(ručně)</span>':'')+'</td></tr>'
  +'<tr><td>Tuky · sacharidy</td><td class="num">'+v.tuky+' g · ~'+v.sach+' g</td></tr>'
  +'<tr><td>Nikdy pod</td><td class="num">'+fmt(v.minKcal)+' kcal</td></tr>'
  +'<tr><td>Pitný režim</td><td class="num">'+(v.voda/1000).toLocaleString("cs-CZ")+' l</td></tr>'
  +'</tbody></table>'
  +((rucneK||rucneP) ? '<div class="wrow" style="margin-top:8px">'
     +'<button class="ghost" data-prreset="'+who+'" type="button">Vrátit se k vypočítaným číslům</button></div>' : '')

  +'vynásobí se pohybem a upraví podle cíle. Když si čísla přepíšeš výš v <b>Cíle a čísla</b>, '
  +'má tvoje hodnota přednost.</div></div></div>';

function widgetStav(){
 const on = window.sync && sync.on;
 const kdy = window.sync && sync._lastW ? sync._lastW : null;
 const cas = kdy ? dvoj(kdy.getHours())+":"+dvoj(kdy.getMinutes())+":"+dvoj(kdy.getSeconds()) : "zatím nikdy";
 let d = null;
 try { d = on ? sync.widgetData() : null; } catch(e){ d = null; }
 const co = d ? (d.sess ? "🏋️ běžící trénink "+esc(d.sess.rid)+" ("+d.sess.hot+"/"+d.sess.cel+" sérií)"
                        : (d.tr ? "🏋️ dnešní trénink "+esc(d.tr.co) : (d.next ? "🍽️ "+esc(d.next.cas+" "+d.next.n) : "kalorie a voda")))
              : "—";
 return '<div class="nblok" style="margin-top:12px">'
  +'<div class="nh">🔎 Kontrola spojení</div>'
  +'<table><tbody>'
  +'<tr><td>Spojení s databází</td><td class="num">'+(on?'<b style="color:var(--good)">jede</b>':'<b style="color:var(--s2)">nejede</b>')+'</td></tr>'
  +'<tr><td>Naposledy odesláno</td><td class="num">'+cas+'</td></tr>'
  +'<tr><td>Co se právě posílá</td><td class="num">'+co+'</td></tr>'

  +'<div class="wrow" style="margin-top:8px"><button class="act small" id="widPush" type="button">Odeslat teď</button>'
  +'<span class="dim" style="font-size:12.5px">Pak ve Scriptable dej ▶︎ a musí to tam být.</span></div>'

  +'po odškrtnutí jídla, po vodě — a pak ještě každou minutu, dokud je otevřená.</div></div>';
}

/* --- reakce na to, co udělal ten druhý (hlášky se generují lokálně) --- */
let spoluPosl = { hot: -1, in: false };
function spoluReakce(pred, ted){
 const me = store.get("meId", null);
 if (!me || !ted) return;
 const o = me === "p" ? "v" : "p";
 const b = ted[o];
 if (!b) return;

 if (b.in && !spoluPosl.in){
  spoluPosl.in = true;
  if (state.sess) celebrate("🤜");
 }
 if (!b.in) spoluPosl.in = false;

 // nová série toho druhého
 if (b.in && typeof b.hot === "number" && spoluPosl.hot >= 0 && b.hot > spoluPosl.hot){
  const posl = spoluPosledniSerie(b);
  state.spoluTik = { tx: spoluHlaska("serie", o, { kg: posl ? fmt(posl[0]) : "?", op: posl ? posl[1] : "?" }),
                     t: Date.now() };
  if (state.sess) renderSession();
 }
 if (typeof b.hot === "number") spoluPosl.hot = b.hot;
}
function spoluPosledniSerie(b){
 if (!b || !b.sety) return null;
 const klice = Object.keys(b.sety).sort((x,y)=>(+y)-(+x));
 for (const k of klice){
  const a = b.sety[k];
  if (a && a.length) return a[a.length-1];
 }
 return null;
}
function spoluSetyCviku(b, i){
 if (!b || !b.sety) return [];
 return b.sety[i] || b.sety[String(i)] || [];
}

   Ne všude dávají kila smysl. Prkno se měří na vteřiny, kliky na opakování,
   rotoped na minuty a protahování se jen odškrtne.                        */
const EX_KARDIO = ["bike","bikehiit","walkhill","run","rower","ellip","rope"];
const EX_STREC = ["catcow","hipflex","hamstretch","chestdoor","thoracic","childpose","pirifo",
 "quadstr","calfstr","latstr","spinal","butterfly","worlds","downdog","cobra","deepsquat",
 "sholdisl","ankle","neck","armcircle","legswing","bandpull"];

function rezim(exId, presc){
 if (EX_KARDIO.indexOf(exId) >= 0) return "kardio";
 const t = String(presc || "");
 if (EX_STREC.indexOf(exId) >= 0){
  // některé „protahovací" cviky se ve skutečnosti počítají na opakování
  if (/\d\s*(s|sek|vteřin)\b/i.test(t)) return "strec";
  if (/\d\s*min\b/i.test(t)) return "kardio";
  if (/\d\s*(×|x|kruh|opak|pomal|na stranu|vpřed|vzad)/i.test(t)) return "reps";
  return "strec";
 }
 if (/\d\s*(s|sek|vteřin)\b/i.test(t)) return "cas";
 if (/\d\s*min\b/i.test(t)) return "kardio";
 if (VAHY_TELO.indexOf(exId) >= 0 || VAHY_GUMA.indexOf(exId) >= 0) return "reps";
 return VAHY[exId] ? "kg" : "reps";
}

 if (rz === "kg") return (kg ? fmt(kg) + " kg × " : "") + val;
 if (rz === "kardio") return val + " min";
 if (rz === "cas" || rz === "strec") return val + " s";
 return val + "×";
}

/* ---- doporučená váha, která se hýbe s tím, jak trénuješ ----
   Nikdy jsi to nedělal  → odhad z tělesné váhy.
   Dal jsi všechny série na horní hranici → přidáme.
   Nedosáhl jsi ani na spodní hranici     → ubereme.
   Dlouho jsi u toho nebyl                → ubereme, síla mezitím odešla. */
function dalsiVaha(who, exId, presc){
 const sess = logGet(who, exId);
 const iso = new Date().toISOString().slice(0,10);
 const minule = sess.filter(x => x.d !== iso).slice(-1)[0];
 if (!minule || !minule.s.length){
  const d = doporucVaha(who, exId);
  if (!d || !d.kg) return null;
  return { kg: d.kg, ruka: !!d.ruka, smer: "start",
           duvod: "první série — odhad podle tvojí váhy" };
 }
 const kg = topSet(minule.s)[0];
 if (!kg) return null;
 const tg = repTarget(presc);
 const k0 = VAHY[exId];
 const krok = (k0 && k0[2]) || incFor(exId);
 const ruka = !!(k0 && k0[3] === "ruka");
 const pauza = daysBetween(minule.d, iso);

 // dlouhá pauza u cviku — začneme níž, ať to není hrdinství
 if (pauza >= 42) return { kg: zaokr(kg * 0.85, krok), ruka:ruka, smer:"dolu",
   duvod: "u tohohle cviku jsi " + rod(who,"nebyl","nebyla") + " " + pocet(Math.round(pauza/7),"týden","týdny","týdnů")
        + " — ubereme 15 %, do dvou tréninků to doženeš" };
 if (pauza >= 21) return { kg: zaokr(kg * 0.92, krok), ruka:ruka, smer:"dolu",
   duvod: "tři týdny pauzy u tohohle cviku — ubereme 8 % a rozjedeme to znovu" };

 if (!tg) return { kg: kg, ruka:ruka, smer:"stejne", duvod: "jako minule — a přidej opakování" };

 const vsechny = minule.s.length >= tg.sets;
 const nahore  = minule.s.every(x => x[1] >= tg.hi);
 const pod     = minule.s.filter(x => x[1] < tg.lo).length;

 if (vsechny && nahore) return { kg: zaokr(kg + krok, krok), ruka:ruka, smer:"nahoru",
   duvod: "minule všechny série na horní hranici — zasloužíš si přidat " + fmt(krok) + " kg" };
 if (pod >= 2) return { kg: zaokr(kg - krok, krok), ruka:ruka, smer:"dolu",
   duvod: "minule ti " + pocet(pod,"série spadla","série spadly","sérií spadlo") + " pod " + tg.lo + " opakování — ubereme a uděláme to čistě" };
 return { kg: kg, ruka:ruka, smer:"stejne",
   duvod: "drž váhu a dotlač to na " + tg.sets + "× " + tg.hi + " — pak přidáš" };
}
function zaokr(v, krok){
 const k = krok || 2.5;
 return Math.max(k, Math.round(v / k) * k);
}
const SMER_IC = { start:"🎯", nahoru:"⬆️", dolu:"⬇️", stejne:"➡️" };
function dalsiVahaText(who, exId, presc){
 const d = dalsiVaha(who, exId, presc);
 if (!d){
  const z = doporucVaha(who, exId);
  if (z && z.telo) return '<div class="dopbox">Tenhle cvik jede na vlastní váhu — přidávej opakování, ne kila.</div>';
  if (z && z.guma) return '<div class="dopbox">Guma: vyber odpor, u kterého poslední dvě opakování pálí, ale technika drží.</div>';
  return "";
 }
 return '<div class="dopbox '+d.smer+'">'+(SMER_IC[d.smer]||"🎯")+' Dneska zkus <b>'+fmt(d.kg)+' kg</b>'
  +(d.ruka?" v každé ruce":"")+' <span class="dim">— '+esc(d.duvod)+'</span></div>';
}

/* ---- odhad, kolik tréninku ještě zbývá ----
   Do šesté série se opíráme hlavně o plán tréninku, pak čím dál víc
   o skutečné tempo. Jinak by první série s dlouhou pauzou hodila nesmysl. */
function planMinut(who, rid){
 const r = (rutiny(who) || []).find(x => x.id === rid);
 return r ? r.min : null;
}
/* 45 minut je „45:00", ne „00:45" */
function casTrvani(min){
 const m = Math.max(0, Math.round(min || 0));
 return m >= 60 ? (Math.floor(m/60) + ":" + dvoj(m % 60) + " h") : (m + ":00");
}
function zbyvaMin(hot, cel, min, planMin){
 hot = +hot || 0; cel = +cel || 0; min = +min || 0;
 if (cel <= 0) return null;
 const zbyva = Math.max(0, cel - hot);
 if (!zbyva) return 0;
 const planT = (planMin || cel * 2.6) / cel;          // minut na sérii podle plánu
 let tempo = planT;
 if (hot >= 1 && min >= 1){
  const realT = min / hot;
  const w = Math.min(1, hot / 6);                     // váha reality roste s počtem sérií
  tempo = realT * w + planT * (1 - w);
 }
 tempo = Math.max(0.6, Math.min(6, tempo));           // ať to neuletí ani jedním směrem
 return Math.max(1, Math.round(zbyva * tempo));
}
function casZa(min){
 if (min === null || min === undefined) return "";
 const d = new Date(Date.now() + min * 60000);
 return dvoj(d.getHours()) + ":" + dvoj(d.getMinutes());
}
function jeHotovo(hot, cel){ return hot >= cel; }
function zbyvaText(hot, cel, min, planMin, dlouhy){
 if (jeHotovo(hot, cel)) return "hotovo 💪";
 const z = zbyvaMin(hot, cel, min, planMin);
 if (z === null) return "";
 if (z === 0) return "poslední série";
 return "zbývá ~" + z + " min" + (dlouhy ? " · konec " + casZa(z) : "");
}

 const pool = SPOLU_HLASKY[druh] || [];
 const i = Math.floor(Math.random() * pool.length);
 let t = pool[i] || "";
 t = t.replace(/\{jm\}/g, jm).replace(/\{a\}/g, rod(who, "", "a"));
 Object.keys(extra || {}).forEach(k => { t = t.replace(new RegExp("\\{"+k+"\\}", "g"), extra[k]); });
 return t;
}

/* 4. pád (koho) — jsou jen dvě jména, tak je nebudeme hádat regulárním výrazem */
function koho(w){ const j = jmeno(w); return /[aA]$/.test(j) ? j.slice(0,-1)+"u" : j+"a"; }
function spoluData(){ return (window.sync && sync.spolu) ? sync.spolu : null; }
function spoluBezi(){
 const d = spoluData();
 if (!d || d.stav !== "bezi") return null;
 const stari = d.kdy ? (Date.now() - new Date(d.kdy).getTime()) / 60000 : 0;
 return stari > 180 ? null : d;   // po třech hodinách to bereme jako zapomenuté
}
function spoluJaJsem(){
 const d = spoluBezi(), me = store.get("meId", null);
 return !!(d && me && d[me] && d[me].in);
}
function spoluDruhyJe(){

 const o = me === "p" ? "v" : "p";
 return (d[o] && d[o].in) ? Object.assign({ kdo: o }, d[o]) : null;
}
function spoluMozne(){
 return !!(window.sync && sync.on && store.get("meId", null) && store.get("famId", null));
}

 const d = spoluBezi();

 if (!d || !me || !d.pozvanka) return null;
