/* Každý má jinou sadu tréninků, takže „stejný trénink" většinou u druhého
   vůbec neexistuje. Hledáme proto nejbližší svým typem a délkou. */
function spoluProtejsek(me, rid){
 const moje = rutiny(me);
 const presne = moje.find(x => x.id === rid);
 if (presne) return presne;
 const vzor = (ROUTINES.p.concat(ROUTINES.v)).find(x => x.id === rid);
 if (!vzor) return moje[0];
 const stejny = moje.filter(x => x.typ === vzor.typ);
 const zdroj = stejny.length ? stejny : moje;
 return zdroj.slice().sort((a,b)=> Math.abs(a.min - vzor.min) - Math.abs(b.min - vzor.min))[0];
}
function spoluPrijmi(){
 const d = spoluBezi();
 if (!d) return;
 const me = store.get("meId", null);
 if (!me) return;
 const r0 = spoluProtejsek(me, d.rid);
 if (!r0) return;
 const rid = r0.id;
 if (state.sess && state.sess.rid !== rid) cancelSession();
 if (!state.sess) startSession(me, rid, null);
 state.sess.spolu = true; saveSess();
 sync.spoluSet2("pozvanka", null);
 spoluMojeSety();
 spoluUdalost(spoluHlaska("pripoj", me));
 pushMsg("spolu-in-" + d.id + "-" + me, "🤜", jmeno(me) + " se přidal" + rod(me, "", "a") + " k tréninku",
   (rid === d.rid ? "" : "Ty jedeš " + rid + ", protože " + d.rid + " ve tvojí sadě není. ")
   + "Od téhle chvíle vidíte série jeden druhého živě. Ať vyhraje ten poctivější. 🏛️");
 celebrate("🤜"); syncDot();
 renderSession(); renderTrenink(); renderDnes();
}
function spoluOdmitni(){
 if (!spoluMozne()) return;
 const me = store.get("meId");
 sync.spoluSet2("pozvanka", null);
 spoluUdalost(BASE_T[me].name + " tentokrát pasuje. Prý regenerace. 😴");
 renderTrenink(); renderDnes();
}

/* ---- sparing: trénink s parťákem ---- */
/* 7. pád (s kým) — Radek → s Radkem, Jana → s Janou. Není to dokonalá čeština,
   ale je to nekonečně lepší než „s Radek".                                    */
function sKym(n){
 const x = String(n || "").trim();
 if (!x) return x;
 const l = x.toLowerCase();
 if (/[aá]$/.test(l)) return x.slice(0,-1) + "ou";
 if (/[eě]$/.test(l)) return x;
 if (/[íyý]$/.test(l)) return x.slice(0,-1) + "ím";
 if (/o$/.test(l)) return x.slice(0,-1) + "em";
 if (/ěk$/.test(l)) return x.slice(0,-2).replace(/n$/i, m=>m==="N"?"Ň":"ň") + "kem";
 if (/ek$/.test(l)) return x.slice(0,-2) + "kem";
 if (/[eě]l$/.test(l)) return x.slice(0,-2) + "lem";
 if (/[eě]r$/.test(l) && x.length > 4) return x.slice(0,-2) + "rem";
 return x + "em";
}

function partiSeznam(){ return store.get("parti", []); }
function partiPridej(n){
 n = String(n || "").trim().replace(/\s+/g," ").slice(0,18);
 if (!n) return "";
 const a = partiSeznam().filter(x => x.toLowerCase() !== n.toLowerCase());
 a.unshift(n); store.set("parti", a.slice(0,10));
 return n;
}
function partiSmaz(n){
 store.set("parti", partiSeznam().filter(x => x !== n));
}
function budLogAll(){ return store.get("tlogB", {}); }
function budLog(bud, ex){ return budLogAll()[bud+"|"+ex] || []; }
function budLogAdd(bud, ex, kg, reps){
 const all = budLogAll(), k = bud+"|"+ex;
 const arr = (all[k] || []).slice();
 const iso = new Date().toISOString().slice(0,10);
 let ses = arr.find(x => x.d === iso);
 if (!ses){ ses = { d: iso, s: [] }; arr.push(ses); }
 ses.s.push([kg, reps]);
 arr.sort((a,b)=>a.d.localeCompare(b.d));
 all[k] = arr.slice(-30); store.set("tlogB", all);
}
function budMinula(bud, exId){
 const iso = new Date().toISOString().slice(0,10);
 const ses = budLog(bud, exId).filter(x => x.d !== iso);
 return ses.length ? ses[ses.length-1] : null;
}
function budNejlepsi(bud, exId){
 let best = 0;
 budLog(bud, exId).forEach(x => x.s.forEach(pp => { if (pp[0] > best) best = pp[0]; }));
 return best;
}
function sparHist(who){
 const a = store.get("spar", []) || [];
 return who ? a.filter(x => (x.who || "p") === who) : a;
}
function sparUloz(z){
 const a = sparHist().concat([z]).slice(-60);
 store.set("spar", a); state.spar = a;
}

function startSession(who, rid, bud){
 const r = rutiny(who).find(x => x.id === rid);
 if (!r) return;
 bud = bud ? partiPridej(bud) : null;
 state.sess = {
  who: who, rid: rid, start: new Date().toISOString(),
  bud: bud || null, akt: "ty", min: false,
  ex: r.ex.map((e,i) => {
   const exId = state.exsel[rid+"|"+i] || e[0];
   const min = minulaLekce(who, exId);
   const bmin = bud ? budMinula(bud, exId) : null;
   const n = plannedSets(e[1]);
   const rz0 = rezim(exId, e[1]);
   const dop = rz0 === "kg" ? dalsiVaha(who, exId, e[1]) : null;
   const start = (dop && dop.kg) ? dop.kg : "";
   const mk = (m) => Array.from({length:n}, () => ({ kg: start, reps: "", done: false }));
   return {
    id: exId, popis: e[1], pauza: e[3], klic: rid+"|"+i, rz: rezim(exId, e[1]),
    sets: mk(min), bsets: bud ? mk(bmin) : []
   };
  })
 };
 state.sessMin = false;
 store.set("session", state.sess);
 if (window.sync && sync.on) sync.pushWidget();
 if (spoluBezi() && spoluDruhyJe()) { state.sess.spolu = true; saveSess(); spoluMojeSety(); }
 renderSession();
}
function sessKdo(){ return (state.sess && state.sess.akt === "bud") ? "bud" : "ty"; }
function sessSets(i, kdo){
 const x = state.sess.ex[i];
 return (kdo || sessKdo()) === "bud" ? x.bsets : x.sets;
}
function sessJmeno(kdo){
 if (!state.sess) return "";
 return kdo === "bud" ? (state.sess.bud || "Kámoš") : "Ty";
}
function saveSess(){ store.set("session", state.sess); }
function cancelSession(){
 if (spoluJaJsem()) spoluOdejdi();
 state.zrusPtl = false;
 state.sess = null; state.sessMin = false; store.set("session", null);
 if (window.sync && sync.on) sync.pushWidget();
 const o = document.getElementById("sessOverlay");
 o.hidden = true; o.innerHTML = "";
 document.body.style.overflow = "";
 if (state.timer){ state.timer = null; if (timerId){ clearInterval(timerId); timerId = null; }
   const b = document.getElementById("timerBar"); if (b){ b.hidden = true; b.classList.remove("done"); } }
 renderTrenink();
}
function sessPauza(){
 const s0 = state.sess;
 if (!s0) return "2:00";
 for (let i = s0.ex.length-1; i >= 0; i--)
   if (s0.ex[i].sets.some(p=>p.done) || (s0.ex[i].bsets||[]).some(p=>p.done)) return s0.ex[i].pauza;
 return s0.ex[0].pauza;
}
function sessSoucty(kdo){
 const s0 = state.sess;
 let hot = 0, cel = 0, obj = 0, rep = 0;
 s0.ex.forEach(x => {
  const kilove = (x.rz || rezim(x.id, x.popis)) === "kg";
  ((kdo === "bud") ? (x.bsets||[]) : x.sets).forEach(p => {
   cel++; if (p.done){ hot++; rep += (+p.reps || 0); if (kilove) obj += (+p.kg || 0) * (+p.reps || 0); } });
 });
 const min = Math.max(1, Math.round((Date.now() - new Date(s0.start).getTime())/60000));
 return { hot, cel, obj: Math.round(obj), rep, min };
}

/* ---- bilance sparingu ---- */
function sparBilance(who){
 const m = {};
 sparHist(who).forEach(x=>{
  const k = x.bud;
  if (!m[k]) m[k] = { bud:k, v:0, p:0, r:0, oTy:0, oBud:0, min:0, posl:x.d };
  if (x.v === "V") m[k].v++; else if (x.v === "P") m[k].p++; else m[k].r++;
  m[k].oTy += x.oTy || 0; m[k].oBud += x.oBud || 0; m[k].min += x.min || 0;
  if (x.d > m[k].posl) m[k].posl = x.d;
 });
 return Object.keys(m).map(k=>m[k]).sort((a,b)=>(b.v+b.p+b.r)-(a.v+a.p+a.r));
}

 if (b.p > b.v * 2) return "Tady se něco pokazilo. Konkrétně ty. 🫣";
 if (b.p > b.v) return "Prohráváš. Zatím. Odveta je vždycky o jeden trénink dál.";
 return "Naprosto vyrovnané. Tohle je ta nejlepší možná varianta — nikdo nemůže přestat.";
}

];
function partieCviku(exId){

function odhad1RM(kg, reps){
 if (!kg || !reps) return 0;
 if (reps === 1) return kg;
 return Math.round(kg * (1 + reps / 30) * 2) / 2;   // Epley
}
function cislaObdobi(){ return nast("statObd", 90); }

function treninkStat(who){
 const hist = (state.hist || []).filter(x => x.who === who);
 const all = logAll();
 const dnu = cislaObdobi();
 const hranice = dnu === 0 ? "0000-00-00" : isoPlus(-dnu);
 const h = hist.filter(x => x.d >= hranice);

 const partie = {};
 let serie = 0, objem = 0;
 Object.keys(all).filter(k => k.indexOf(who + "|") === 0).forEach(k => {
  const ex = k.split("|")[1];
  const pt = partieCviku(ex);
  all[k].forEach(se => {
   if (se.d < hranice) return;
   se.s.forEach(x => {
    serie++;
    partie[pt] = (partie[pt] || 0) + 1;
    if (x[0]) objem += x[0] * x[1];
   });
  });
 });
 const minuty = h.reduce((a,x)=>a+(x.min||0), 0);
 const dny = new Set(h.map(x=>x.d)).size;
 const denVTydnu = {};
 h.forEach(x => { const d = new Date(x.d+"T12:00:00").getDay(); denVTydnu[d] = (denVTydnu[d]||0)+1; });
 let nejDen = null, nejP = 0;
 Object.keys(denVTydnu).forEach(d => { if (denVTydnu[d] > nejP){ nejP = denVTydnu[d]; nejDen = +d; } });
 const DAYFULL2 = ["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];
 return { treninku: h.length, dny, serie, objem: Math.round(objem), minuty,
          prumer: h.length ? Math.round(minuty / h.length) : 0,
          partie, nejDen: nejDen === null ? null : DAYFULL2[nejDen], hist: h };
}

function topCviky(who){
 const all = logAll();
 const dnu = cislaObdobi();
 const hranice = dnu === 0 ? "0000-00-00" : isoPlus(-dnu);
 const out = [];
 Object.keys(all).filter(k => k.indexOf(who + "|") === 0).forEach(k => {
  const ex = k.split("|")[1];
  let obj = 0, ser = 0;
  all[k].forEach(se => { if (se.d < hranice) return;
    se.s.forEach(x => { ser++; if (x[0]) obj += x[0]*x[1]; }); });
  if (ser) out.push({ ex, obj: Math.round(obj), ser });
 });
 return out.filter(x => x.obj > 0).sort((a,b)=>b.obj-a.obj).slice(0,5);
}
function rekordySeznam(who){
 const all = logAll();
 const rows = Object.keys(all).filter(k => k.indexOf(who+"|") === 0).map(k => {
  const ex = k.split("|")[1];
  if (rezim(ex, "") !== "kg") return null;
  let best = null, bestD = null, best1 = 0, best1D = null, objem = 0, ser = 0;
  all[k].forEach(x => x.s.forEach(p0 => {
   ser++; objem += (p0[0]||0)*(p0[1]||0);
   if (!best || p0[0] > best[0]) { best = p0; bestD = x.d; }
   const o = odhad1RM(p0[0], p0[1]);
   if (o > best1){ best1 = o; best1D = x.d; }
  }));
  if (!best || !best[0]) return null;
  return { ex, best, d: bestD, orm: best1, ormD: best1D, objem: Math.round(objem), ser };
 }).filter(Boolean);
 const sort = nast("rekSort", "kg");
 rows.sort((a,b)=> sort === "1rm" ? b.orm - a.orm
                 : (sort === "abc" ? String((EX[a.ex]||{}).n).localeCompare(String((EX[b.ex]||{}).n))
                 : b.best[0] - a.best[0]));
 return rows;
}

/* ============ Progres ============ */
function spark(entries, color){
 if (entries.length < 2) return '<div class="dim" style="font-size:12.5px;margin:6px 0">Zapiš aspoň dvě hodnoty a ukáže se graf.</div>';
 const w=560,h=100,pad=8;
 const kgs = entries.map(e=>e.kg);
 const mn = Math.min(...kgs), mx = Math.max(...kgs);
 const span = (mx-mn)||1;
 const pts = entries.map((e,i)=>{
  const x = pad + i*(w-2*pad)/(entries.length-1);
  const y = h-pad - (e.kg-mn)/span*(h-2*pad);
  return [x,y];
 });
 const line = pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Vývoj váhy">'
  +'<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
  +pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+color+'" stroke="var(--surface-1)" stroke-width="2"/>').join("")
  +'</svg>';
}
function movAvg(sorted, dny){
 return sorted.map((e,i)=>{
  const od = new Date(e.d).getTime() - dny*86400000;
  const okno = sorted.filter((x,j)=> j <= i && new Date(x.d).getTime() >= od);
  return { d: e.d, kg: okno.reduce((a,x)=>a+x.kg,0)/okno.length };
 });
}
function wtChart(sorted, color){
 if (sorted.length < 2) return '<div class="dim" style="font-size:12.5px;margin:6px 0">'
   +'Zapiš aspoň dvě vážení a objeví se graf s trendem.</div>';
 const w = 560, h = 150, l = 40, r = 10, tp = 12, bt = 22;
 const kgs = sorted.map(e=>e.kg);
 let mn = Math.min(...kgs), mx = Math.max(...kgs);
 const pad = Math.max(0.5, (mx-mn)*0.18); mn -= pad; mx += pad;
 const t0 = new Date(sorted[0].d).getTime(), t1 = new Date(sorted[sorted.length-1].d).getTime();
 const span = (t1-t0) || 1;
 const X = d => l + (new Date(d).getTime()-t0)/span*(w-l-r);
 const Y = v => tp + (mx-v)/(mx-mn)*(h-tp-bt);
 const avg = movAvg(sorted, 14);
 const ticks = [mx, (mx+mn)/2, mn].map(v=>
   '<line class="gl" x1="'+l+'" y1="'+Y(v).toFixed(1)+'" x2="'+(w-r)+'" y2="'+Y(v).toFixed(1)+'"/>'
   +'<text x="'+(l-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end">'+(Math.round(v*10)/10).toLocaleString("cs-CZ")+'</text>').join("");
 const body = sorted.map(e=>'<circle cx="'+X(e.d).toFixed(1)+'" cy="'+Y(e.kg).toFixed(1)+'" r="3.5" fill="'+color
   +'" stroke="var(--surface-1)" stroke-width="2"/>').join("");
 const line = '<polyline points="'+avg.map(e=>X(e.d).toFixed(1)+","+Y(e.kg).toFixed(1)).join(" ")+'" fill="none" stroke="'
   +color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
 const dt = iso => { const p = iso.split("-"); return (+p[2])+". "+(+p[1])+"."; };
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Vývoj váhy">'
  + ticks + line + body
  +'<line class="ax" x1="'+l+'" y1="'+(h-bt)+'" x2="'+(w-r)+'" y2="'+(h-bt)+'"/>'
  +'<text x="'+l+'" y="'+(h-6)+'">'+dt(sorted[0].d)+'</text>'
  +'<text x="'+(w-r)+'" y="'+(h-6)+'" text-anchor="end">'+dt(sorted[sorted.length-1].d)+'</text>'
  +'</svg>'

/* ---- plnění cílů po týdnech ---- */
function tydnyChart(who){
 const t = target(who);
 const tydny = [];
 for (let w0 = 7; w0 >= 0; w0--){
  let sum = 0, dnu = 0;
  for (let i = 0; i < 7; i++){
   const iso = isoDaysAgo(w0*7 + i);
   const tot = dayTotals(who, iso);
   if (tot.k > 0){ sum += tot.k; dnu++; }
  }
  tydny.push({ lab: w0 === 0 ? "teď" : "-"+w0+"t", prum: dnu ? Math.round(sum/7) : 0, dnu: dnu });
 }
 if (!tydny.some(x=>x.prum > 0)) return "";
 const w = 560, h = 150, l = 44, r = 10, tp = 14, bt = 24;
 const mx = Math.max(t.kcal, ...tydny.map(x=>x.prum)) * 1.1;
 const bw = Math.min(24, (w-l-r)/tydny.length - 6);
 const Y = v => tp + (1 - v/mx)*(h-tp-bt);
 const bars = tydny.map((x,i)=>{
  const cx = l + (i+0.5)*(w-l-r)/tydny.length;
  const y = Y(x.prum), hh = Math.max(0, (h-bt) - y);
  const barva = x.prum >= t.kcal*0.95 ? "var(--s3)" : (x.prum >= t.kcal*0.75 ? "var(--s1)" : "var(--s2)");
  return (hh > 0 ? '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)
    +'" rx="4" fill="'+barva+'"/>' : '')
   +'<text x="'+cx.toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+x.lab+'</text>'
   +(i === tydny.length-1 && x.prum ? '<text x="'+cx.toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" '
     +'style="font-weight:700;fill:var(--text-primary)">'+fmt(x.prum)+'</text>' : '');
 }).join("");
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Průměrné kalorie po týdnech">'
  +'<line class="gl" x1="'+l+'" y1="'+Y(t.kcal).toFixed(1)+'" x2="'+(w-r)+'" y2="'+Y(t.kcal).toFixed(1)+'" stroke-dasharray="0"/>'
  +'<text x="'+(l-6)+'" y="'+(Y(t.kcal)+3.5).toFixed(1)+'" text-anchor="end">cíl</text>'
  + bars
  +'<line class="ax" x1="'+l+'" y1="'+(h-bt)+'" x2="'+(w-r)+'" y2="'+(h-bt)+'"/></svg>'
  +'<div class="hint" style="margin-top:2px">Průměr <b>odškrtnutých</b> kalorií na den. Šedá čára je cíl.</div>';
}

function wtArr(w){ return w === "p" ? state.wtP : state.wtV; }
function mrArr(w){ return w === "p" ? state.mrP : state.mrV; }
function trDny(w){
 const all = logAll(), dny = {};
 Object.keys(all).filter(k => k.indexOf(w+"|") === 0).forEach(k => all[k].forEach(x => dny[x.d] = 1));
 return Object.keys(dny).length;
}
function trCviku(w){ return Object.keys(logAll()).filter(k => k.indexOf(w+"|") === 0).length; }
function pokroky(w){
 const all = logAll();
 return Object.keys(all).filter(k => k.indexOf(w+"|") === 0).filter(k => {
  const x = all[k]; if (x.length < 2) return false;
  return topSet(x[x.length-1].s)[0] > topSet(x[0].s)[0];
 }).length;
}
function maPokrok(w){ return pokroky(w) > 0; }
function vodaDny(w){
 const cil = Math.round(waterCil(w)/GLASS);
 return Object.keys(state.water).filter(k => k.slice(-2) === "|"+w && state.water[k] >= cil).length;
}
function suplDny(w){
 return Object.keys(state.checks).filter(k => state.checks[k] && k.indexOf("|"+w+"|sup-cr") > 0).length;
}

function nejdelsi(w){ return histW(w).reduce((a,x)=>Math.max(a, x.min||0), 0); }

function serieCelkem(w){

}

 let n = 0;
 for (let i = 0; i < 120; i++){
  if (dayTotals(w, isoPlus(-i)).p >= target(w).prot) n++;
 }

}

 let m = 0;

}
function zombieTreninky(w){
 const all = store.get("spanek", {}) || {};
 return histW(w).filter(x => { const z = all[x.d+"|"+w]; return z && z.h > 0 && z.h < 6; }).length;
}

 const vse = ROUTINES.p.concat(ROUTINES.v);
 return histW(w).filter(x => { const r = vse.find(r0 => r0.id === x.rid); return r && r.typ === "mobilita"; }).length;

 const c = {};
 sparHist(w).forEach(x => { c[x.bud] = (c[x.bud]||0)+1; });

}
function vahaPohyb(w){
 const arr = wtArr(w).slice().sort((a,b)=>a.d.localeCompare(b.d));
 if (arr.length < 5) return 0;
 return Math.abs(Math.round((arr[arr.length-1].kg - arr[0].kg) * 10) / 10);
}
function vikendoveTreninky(w){
 return histW(w).filter(x => { const d = wdOf(x.d); return d === 5 || d === 6; }).length;
}
function tezkaSerie(w, kg){
 const all = logAll();
 let ok = false;
 Object.keys(all).filter(k => k.indexOf(w+"|") === 0).forEach(k =>
  all[k].forEach(z => z.s.forEach(x => { if ((x[0]||0) >= kg) ok = true; })));
 return ok ? 1 : 0;
}
function dokonaleDny(w){
 // splněné kalorie, bílkoviny i voda v jeden den — sváteční úkaz
 let n = 0;
 for (let i = 0; i < 120; i++){
  const iso = isoPlus(-i);
  const t = dayTotals(w, iso);
  if (t.k >= MIN_KCAL[w] && t.p >= target(w).prot
      && waterGet(w, iso) >= Math.round(waterCil(w)/GLASS)) n++;
 }
 return n;
}

function odzStav(o, w){
 try { const r = o.p(w); return [r[0]||0, r[1]||1]; } catch(e){ return [0,1]; }
}
/* Odznak je důkaz, že se to jednou povedlo — když ti pak spadne série,
   o odznak nepřijdeš. Držíme si proto i seznam už udělených. */
function odzUlozene(w){
 return (store.get("odznaky", []) || []).filter(k => k.indexOf(w + "|") === 0).map(k => k.slice(2));
}
function ziskaneTed(w){ return ODZNAKY.filter(o => { const r = odzStav(o,w); return r[0] >= r[1]; }).map(o => o.id); }
function ziskane(w){
 const set = {};
 ziskaneTed(w).concat(odzUlozene(w)).forEach(id => { if (ODZNAKY.some(o=>o.id===id)) set[id] = 1; });
 return Object.keys(set);
}
function nejblizsi(w){
 let best = null;
 ODZNAKY.forEach(o => {
  const r = odzStav(o,w);
  if (r[0] >= r[1]) return;
  const pom = r[0] / r[1];
  if (!best || pom > best.pom) best = { o:o, cur:r[0], cil:r[1], pom:pom };
 });
 return best;
}

function kontrolaOdznaku(){
 const drive = store.get("odznaky", []) || [];
 const set = {};
 drive.forEach(k => set[k] = 1);
 ["p","v"].forEach(w => ziskaneTed(w).forEach(id => set[w+"|"+id] = 1));
 const ted = Object.keys(set).filter(k => ODZNAKY.some(o => o.id === k.slice(2)));
 ted.filter(k => drive.indexOf(k) < 0).forEach(k => {
  const q = k.split("|"), o = ODZNAKY.find(x => x.id === q[1]);
  if (!o) return;
  const zbyva = ODZNAKY.length - ziskane(q[0]).length;
  const konec = zbyva <= 0 ? "A to byl poslední — všechny!" : "Zbývá " + pocet(zbyva, "odznak", "odznaky", "odznaků") + ".";
  if (o.dom){
   // tenhle si zaslouží celá domácnost — nemá smysl ho psát na jedno jméno
   if (q[0] !== "p") return;
   pushMsg("odz-dom-" + o.id, o.ic, "Nový odznak: " + o.n,
     "Domácnost si právě odemkla odznak „" + o.n + "\". " + konec);
  } else {
   pushMsg("odz-" + k, o.ic, "Nový odznak: " + o.n,
     jmeno(q[0]) + " si právě " + rod(q[0], "odemkl", "odemkla") + " odznak „" + o.n + "\". " + konec);
  }
 });
 store.set("odznaky", ted);
}

/* ---- grafy a statistiky ---- */
function sloupceSvg(data, o){
 o = o || {};
 if (!data.length || !data.some(d=>d.v > 0))
  return '<div class="dim" style="font-size:12.5px;margin:8px 0">'+(o.prazdno || "Zatím není z čeho kreslit.")+'</div>';
 const w = 560, h = o.h || 132, l = o.l || 42, r = 8, tp = 16, bt = 22;
 const mx = Math.max(o.cil || 0, ...data.map(d=>d.v)) * 1.15 || 1;
 const bw = Math.min(24, (w-l-r)/data.length - 7);
 const Y = v => tp + (1 - v/mx)*(h-tp-bt);
 const cil = o.cil ? '<line class="gl" x1="'+l+'" y1="'+Y(o.cil).toFixed(1)+'" x2="'+(w-r)+'" y2="'+Y(o.cil).toFixed(1)+'"/>'
   +'<text x="'+(l-6)+'" y="'+(Y(o.cil)+3.5).toFixed(1)+'" text-anchor="end">'+esc(o.cilLab || "cíl")+'</text>' : '';
 const bars = data.map((d,i)=>{
  const cx = l + (i+0.5)*(w-l-r)/data.length;
  const y = Y(d.v), hh = Math.max(0, (h-bt)-y);
  const col = d.c || o.c || "var(--s1)";
  return (d.v > 0 ? '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)
      +'" height="'+hh.toFixed(1)+'" rx="4" fill="'+col+'"/>' : '')
   +'<text x="'+cx.toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(d.lab)+'</text>'
   +(i === data.length-1 && d.v ? '<text x="'+cx.toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" '
     +'style="font-weight:700;fill:var(--text-primary)">'+esc(d.top || fmt(d.v))+'</text>' : '');
 }).join("");
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.alt||"graf")+'">'
  + cil + bars + '<line class="ax" x1="'+l+'" y1="'+(h-bt)+'" x2="'+(w-r)+'" y2="'+(h-bt)+'"/></svg>';
}

function dvojSloupceSvg(data, o){
 o = o || {};
 if (!data.length || !data.some(d=>d.a > 0 || d.b > 0))
  return '<div class="dim" style="font-size:12.5px;margin:8px 0">'+(o.prazdno || "Zatím není z čeho kreslit.")+'</div>';
 const w = 560, h = 132, l = 42, r = 8, tp = 16, bt = 22;
 const mx = Math.max(o.cil || 0, ...data.map(d=>Math.max(d.a,d.b))) * 1.2 || 1;
 const slot = (w-l-r)/data.length;
 const bw = Math.min(18, slot/2 - 6);
 const Y = v => tp + (1 - v/mx)*(h-tp-bt);
 const cil = o.cil ? '<line class="gl" x1="'+l+'" y1="'+Y(o.cil).toFixed(1)+'" x2="'+(w-r)+'" y2="'+Y(o.cil).toFixed(1)+'"/>'
   +'<text x="'+(l-6)+'" y="'+(Y(o.cil)+3.5).toFixed(1)+'" text-anchor="end">min</text>' : '';
 const bars = data.map((d,i)=>{
  const cx = l + (i+0.5)*slot;
  const xa = cx - bw - 1, xb = cx + 1;
  const ya = Y(d.a), yb = Y(d.b);
  return (d.a ? '<rect x="'+xa.toFixed(1)+'" y="'+ya.toFixed(1)+'" width="'+bw.toFixed(1)
      +'" height="'+Math.max(0,(h-bt)-ya).toFixed(1)+'" rx="4" fill="var(--s1-track)"/>' : '')
   + (d.b ? '<rect x="'+xb.toFixed(1)+'" y="'+yb.toFixed(1)+'" width="'+bw.toFixed(1)
      +'" height="'+Math.max(0,(h-bt)-yb).toFixed(1)+'" rx="4" fill="var(--s3)"/>' : '')
   +'<text x="'+cx.toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(d.lab)+'</text>'
   +(i === data.length-1 ? '<text x="'+xb.toFixed(1)+'" y="'+(Math.min(ya,yb)-5).toFixed(1)+'" text-anchor="middle" '
      +'style="font-weight:700;fill:var(--text-primary)">'+d.a+'/'+d.b+'</text>' : '');
 }).join("");
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Plán a skutečnost">'
  + cil + bars + '<line class="ax" x1="'+l+'" y1="'+(h-bt)+'" x2="'+(w-r)+'" y2="'+(h-bt)+'"/></svg>'
  +'<div class="stack-leg" style="margin-top:-6px"><span><s style="background:var(--s1-track)"></s>naplánováno</span>'
  +'<span><s style="background:var(--s3)"></s>odtrénováno</span></div>';
}

function tydenIndex(iso){                    // 0 = tenhle týden, 1 = minulý …
 return Math.floor(daysBetween(iso, isoZ(pondeli(0))) / 7) + (iso < isoZ(pondeli(0)) ? 0 : 0);
}
function objemPoTydnech(w){
 const out = [];
 for (let k = 7; k >= 0; k--){
  const zac = isoZ(pondeli(-k)), kon = isoZ(new Date(new Date(pondeli(-k)).setDate(pondeli(-k).getDate()+6)));
  const v = histW(w).filter(x => x.d >= zac && x.d <= kon).reduce((a,x)=>a+(x.obj||0),0);
  out.push({ lab: k === 0 ? "teď" : "-"+k, v: Math.round(v/100)/10,
              top: (Math.round(v/100)/10).toLocaleString("cs-CZ")+" t" });
 }
 return out;
}
function planVsRealita(w){
 const out = [];
 for (let k = 3; k >= 0; k--){
  const zacD = pondeli(-k), zac = isoZ(zacD);
  const konD = new Date(zacD); konD.setDate(zacD.getDate()+6);
  const kon = isoZ(konD);
  let nap = 0;
  for (let i = 0; i < 7; i++){ const d = new Date(zacD); d.setDate(zacD.getDate()+i);
   if (planDne(isoZ(d))[w]) nap++; }
  const hot = histW(w).filter(x => x.d >= zac && x.d <= kon).length;
  out.push({ lab: k === 0 ? "teď" : "-"+k+"t", nap: nap, hot: hot });
 }
 return out;
}
function vodaPoDnech(w){
 const cil = Math.round(waterCil(w)/GLASS);
 const out = [];
 for (let i = 13; i >= 0; i--){
  const iso = isoPlus(-i);
  const n = state.water[iso+"|"+w] || 0;
  out.push({ lab: i % 2 === 0 ? DAYS[wdOf(iso)] : "", v: n, c: n >= cil ? "var(--s3)" : "var(--s1)" });
 }
 return { data: out, cil: cil };
}
function suplPoslednich(w, dnu){
 let n = 0;
 for (let i = 0; i < dnu; i++) if (state.checks[isoPlus(-i)+"|"+w+"|sup-cr"]) n++;
 return n;
}
function kdoVarilStat(){
 const c = { p:0, v:0, s:0, o:0 };
 for (let i = 0; i < 30; i++){
  const j = state.jidlo[isoPlus(-i)];
  if (j && j.k) c[j.k] = (c[j.k]||0) + 1;
 }
 return c;
}

/* ---- nedělní report ---- */
function report(w){
 const t = target(w);
 let dnu = 0, sumK = 0, sumP = 0;
 for (let i = 0; i <= 6; i++){
  const tot = dayTotals(w, isoDaysAgo(i));
  if (tot.k > 0){ dnu++; sumK += tot.k; sumP += tot.p; }
 }
 const prumK = dnu ? Math.round(sumK/dnu) : 0, prumP = dnu ? Math.round(sumP/dnu) : 0;
 const nad = (()=>{ let n = 0; for (let i = 0; i <= 6; i++) if (dayTotals(w, isoDaysAgo(i)).k >= MIN_KCAL[w]) n++; return n; })();
 const arr = wtArr(w).slice().sort((a,b)=>a.d.localeCompare(b.d));
 const posl = arr[arr.length-1];
 const tydenZpet = arr.filter(x => { const d = daysBetween(x.d, isoDnes()); return d >= 6 && d <= 16; }).pop();
 const zmena = posl && tydenZpet ? Math.round((posl.kg - tydenZpet.kg)*10)/10 : null;
 const all = logAll();
 let trenink = 0; const dny = {};
 Object.keys(all).filter(k => k.indexOf(w+"|") === 0).forEach(k => all[k].forEach(x => {
   if (daysBetween(x.d, new Date().toISOString().slice(0,10)) <= 7) dny[x.d] = 1; }));
 trenink = Object.keys(dny).length;

 let rada;
 if (nad <= 2) rada = "Příští týden jedna jediná věc: <b>ranní shake každý den</b>. Nic víc neřeš, ono se to srovná samo.";
 else if (prumP < t.prot*0.8) rada = "Kalorie držíš, ale <b>bílkoviny zaostávají</b>. Přidej si k obědu vejce nebo skyr — to je celý fix.";
 else if (trenink < 2) rada = "Jídlo sedí, <b>chybí tréninky</b>. Zkus v appce filtr na 30 minut — něco se vždycky vejde.";
 else if (nad >= 6 && trenink >= 3) rada = "<b>Tenhle týden byl bez chyby.</b> Nic neměň, jen to zopakuj.";
 else rada = "Slušný týden. Příště se soustřeď na ten <b>jeden slabý den</b> — obvykle je to ten, kdy se vyjíždí brzo.";

 return '<div class="card"><div class="rhead"><h3>📋 '+BASE_T[w].name+' — týden v kostce</h3>'
  +'<span class="rmeta">posledních 7 dní</span></div>'
  +'<div class="rep-grid">'
  +'<div><div class="k">Dní nad minimem</div><div class="v">'+nad+' / 7</div></div>'
  +'<div><div class="k">Tréninky</div><div class="v">'+trenink+'</div></div>'
  +'<div><div class="k">Průměr kalorií</div><div class="v">'+fmt(prumK)+'</div><div class="p">cíl '+fmt(t.kcal)+'</div></div>'
  +'<div><div class="k">Průměr bílkovin</div><div class="v">'+prumP+' g</div><div class="p">cíl '+t.prot+' g</div></div>'
  +'</div>'
  +(zmena !== null ? '<p class="who" style="margin:6px 0 0">Váha za týden: <b>'+(zmena>0?"+":"")
     +zmena.toLocaleString("cs-CZ")+' kg</b>'+(posl?' · teď '+posl.kg.toLocaleString("cs-CZ")+' kg':'')+'</p>' : '')
  +'<div class="note reco" style="margin-top:10px">'+rada+'</div>'

function weeklyRate(arr){
 const s = (arr||[]).slice().filter(x=>x && x.d && x.kg).sort((a,b)=>a.d.localeCompare(b.d));
 if (s.length < 2) return null;
 const last = s[s.length-1];
 // nejstarší vážení v okně 28 dní; když by z toho vyšlo míň než 10 dní, sáhneme
 // po ještě starším (kdo se váží jednou za měsíc, taky si zaslouží doporučení)
 let base = s.find(e => daysBetween(e.d, last.d) <= 28) || s[0];
 if (daysBetween(base.d, last.d) < 10){
  const starsi = s.filter(e => daysBetween(e.d, last.d) >= 10);
  base = starsi.length ? starsi[starsi.length-1] : base;
 }
 const span = daysBetween(base.d, last.d);
 if (span < 10 || span > 120) return null;
 return { rate: (last.kg - base.kg) / span * 7, span: span };
}
/* Doporučení se řídí cílem z profilu. Návrh se počítá z vypočítaného cíle,
   ne z toho už jednou upraveného — jinak by šla čísla donekonečna nahoru. */
function cilOsoby(who){ return (profil(who) || {}).cil || (who === "v" ? "drzet" : "nabrat"); }
function zakladKcal(who){
 try { return profilHotovy(who) ? vypocty(who).kcal : (PROFIL_DEF[who] ? PROFIL_DEF[who].rucne.kcal : target(who).kcal); }
 catch(e){ return target(who).kcal; }
}
function reco(who){
 const arr = who==="p" ? state.wtP : state.wtV;
 const r = weeklyRate(arr);
 if (!r) return { txt:"Zapisuj váhu každou neděli — doporučení se objeví, jakmile budou záznamy aspoň 10 dní od sebe.", act:null };
 const rt = Math.round(r.rate*100)/100;
 const zaklad = zakladKcal(who);
 const rtx = (rt>0?"+":"")+rt.toLocaleString("cs-CZ")+" kg/týden za posledních "+pocet(r.span,"den","dny","dní");
 const uprav = d => Math.max(1200, Math.round((zaklad + d)/50)*50);
 const cil = cilOsoby(who);

 if (cil === "nabrat"){
  if (rt < -0.1)  return { txt:"Tempo "+rtx+" — <b>ubývá to, i když chceš nabírat.</b> Doporučení: přidat 350 kcal denně.", act: uprav(350) };
  if (rt < 0.15)  return { txt:"Tempo "+rtx+" — pomalejší než cíl (+0,25 až 0,4). <b>Nejíš dost.</b> Doporučení: přidat 250 kcal denně (med do shaku + větší večeře).", act: uprav(250) };
  if (rt > 0.6)   return { txt:"Tempo "+rtx+" — rychlejší než cíl, přibývalo by zbytečně moc tuku. Doporučení: ubrat 200 kcal denně.", act: uprav(-200) };
  return { txt:"Tempo "+rtx+" — <b>přesně v cíli.</b> Nic neměň, jede to.", act:null };
 }
 if (cil === "zhubnout"){
  if (rt <= -1.0) return { txt:"Tempo "+rtx+" — <b>moc rychle.</b> Takhle jde dolů i sval. Doporučení: přidat 300 kcal denně.", act: uprav(300) };
  if (rt <= -0.3) return { txt:"Tempo "+rtx+" — <b>přesně tak to má vypadat.</b> Nic neměň.", act:null };
  if (rt < 0.15)  return { txt:"Tempo "+rtx+" — hubnutí stojí. Doporučení: ubrat 250 kcal denně, nebo přidat chůzi.", act: uprav(-250) };
  return { txt:"Tempo "+rtx+" — váha jde <b>nahoru</b>, i když má jít dolů. Doporučení: ubrat 350 kcal denně a poctivě odškrtávat.", act: uprav(-350) };
 }
 if (rt <= -0.45) return { txt:"Tempo "+rtx+" — váha padá moc rychle, brala by s sebou sval. Doporučení: přidat 200 kcal denně.", act: uprav(200) };
 if (rt >= 0.45)  return { txt:"Tempo "+rtx+" — váha roste rychleji, než by u rekompozice měla. Doporučení: ubrat 150 kcal denně"
   + (zena(who) ? " (nejdřív ale zkontroluj, jestli to není jen fáze cyklu)" : "") + ".", act: uprav(-150) };
 return { txt:"Tempo "+rtx+" — <b>váha drží, přesně tak to má být.</b> Postava se mění v posilovně, ne na váze.", act:null };
}

/* ================= SYNC (Firebase Realtime Database) ================= */
/* Sdílené: úplně všechno kromě fotek a nastavení telefonu —
   zprávy, oblíbené, týden, nákup, živý přehled druhého a od verze 33
   i deník cviků, historie tréninků, vážení, míry, voda a odškrtnutí. */

const FB = window.PEVE_FIREBASE || null;   // config se doplní v firebase-config.js

const sync = {
  on: false, db: null, uid: null, fam: null, me: null,
  peerW: null,            // živý balíček druhého (trénink, jídlo, voda)
  spolu: null,            // společný trénink v reálném čase
  status: "off",            // off | connecting | live | error
  peer: null,               // živý přehled druhého
  _mine: {},                // co jsem naposled odeslal (proti smyčkám)

  get famId(){ return store.get("famId", null); },
  get meId(){ return store.get("meId", null); },

  async start(){
    if (!FB || !this.famId || !this.meId) { this.status = "off"; return; }
    this.fam = this.famId; this.me = this.meId;
    this.status = "connecting"; renderNastaveni && renderNastaveni();
    try {
      const [{ initializeApp }, dbmod, authmod] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js")
      ]);
      const app = initializeApp(FB);
      const auth = authmod.getAuth(app);
      await authmod.signInAnonymously(auth);
      this.uid = auth.currentUser.uid;
      this.db = dbmod.getDatabase(app);
      this._m = dbmod;
      this.on = true; this.status = "live";
      this._listen();
      sdilPosliVse();
      this.pushStatus();
      this.pushWidget();
      syncDot();
    } catch(e){
      this.status = "error"; this.err = String(e && e.message || e);
    }
    renderNastaveni && renderNastaveni();
  },

  _sdilPos: {},
  _ref(path){ return this._m.ref(this.db, "rodiny/"+this.fam+"/"+path); },

  _listen(){
    const { onValue } = this._m;
    // zprávy
    onValue(this._ref("feed"), snap => {
      const remote = snap.val() || {};
      const local = store.get("msgs", []);
      const byId = {};
      local.forEach(m => byId[m.id] = m);
      Object.values(remote).forEach(m => {
        if (!byId[m.id]) byId[m.id] = Object.assign({}, m, { r:false });
        else byId[m.id] = Object.assign({}, m, { r: byId[m.id].r });
      });
      const merged = Object.values(byId).sort((a,b)=> String(b.t).localeCompare(String(a.t))).slice(0,60);
      store.set("msgs", merged);
      syncDot();
      if (state.notif) renderZpravy();
    });
    // oblíbené
    onValue(this._ref("spolu"), snap => {
      const pred = this.spolu;
      this.spolu = snap.val();
      spoluReakce(pred, this.spolu);
      if (state.sess) renderSession();
      if (state.tab === "trenink") renderTrenink();
      if (state.tab === "dnes") renderDnes();
      renderNext();
    });
    // společná data — deník, tréninky, vážení, míry, voda, odškrtnutí…
    onValue(this._ref("sdil"), snap => {
      const v = snap.val() || {};
      let zmena = false;
      Object.keys(SDIL).forEach(k => {
        const balik = v[SDIL[k].c] || {};
        this._sdilPos[k] = { v: balik.v || {}, t: balik.t || {} };   // co je teď na serveru
        if (sdilSluc(k, balik)) zmena = true;
      });
      if (zmena){ renderAll(); syncDot(); }
      Object.keys(SDIL).forEach(k => sdilPosli(k));
    });
    // lísteček z Apple Health (poslaný Zkratkou)
    onValue(this._ref("inbox"), snap => {
      const v = snap.val();
      if (!v || typeof v !== "object") return;
      let neco = null;
      Object.keys(v).forEach(k => {
        let popis = null;
        try { popis = inboxZpracuj(v[k]); } catch(e){}
        if (popis) neco = popis;
        this._set("inbox/" + k, null);      // lísteček je vyřízený
      });
      if (neco){
        store.set("hzLast", { kdy: new Date().toISOString(), co: neco });
        kontrolaOdznaku();
        renderAll(); syncDot();
      }
    });
    onValue(this._ref("sdil1"), snap => {
      const v = snap.val() || {};
      let zmena = false;
      SDIL1.forEach(k => { if (sdil1Sluc(k, v[k])) zmena = true; });
      if (zmena) renderAll();
      SDIL1.forEach(k => sdil1Posli(k));
    });
    onValue(this._ref("favr"), snap => {
      const v = snap.val();
      if (Array.isArray(v)){ store.set("favR", v); if (state.tab === "trenink") renderTrenink(); }
    });
    onValue(this._ref("favj"), snap => {
      const v = snap.val();
      if (Array.isArray(v)){ store.set("favJ", v); if (state.pick0) renderPick(); }
    });
    onValue(this._ref("favs"), snap => {
      const v = snap.val();
      if (Array.isArray(v)) { store.set("favs", v); if (state.tab === "recepty") renderRecepty(); }
    });
    // týden
    onValue(this._ref("week"), snap => {
      const v = snap.val();
      if (Array.isArray(v) && v.length === 7) {
        state.week = v; store.set("week", v);
        if (state.tab === "tyden") renderTyden();
        if (state.tab === "dnes") renderDnes();
        if (state.tab === "nakup") renderNakup();
      }
    });
    // návrhy ke schválení
    onValue(this._ref("navrhy"), snap => {
      const v = snap.val();
      state.navrhy = (v && typeof v === "object") ? v : {};
      store.set("navrhy", state.navrhy);
      if (state.tab === "dnes") renderDnes();
      if (state.tab === "tyden") renderTyden();
      if (state.notif) renderZpravy();

    // jídelníček podle dnů
    onValue(this._ref("jidlo"), snap => {
      const v = snap.val();
      if (v && typeof v === "object"){
        state.jidlo = v; store.set("jidlo", v);
        if (state.tab === "tyden") renderTyden();
        if (state.tab === "dnes") renderDnes();
        if (state.tab === "nakup") renderNakup();
      }
    });
    // plán tréninků
    onValue(this._ref("plan"), snap => {
      const v = snap.val();
      if (v && typeof v === "object"){
        state.plan = v; store.set("plan", v);

        if (state.tab === "dnes") renderDnes();

    });
    // vlastní recepty
    onValue(this._ref("recepty"), snap => {
      const v = snap.val();

        store.set("myRecipes", v); nactiMoje();
        if (state.tab === "recepty") renderRecepty();
        if (state.tab === "tyden") renderTyden();

    });
    // vlastní položky nákupu
    onValue(this._ref("shopx"), snap => {
      const v = snap.val();
      if (Array.isArray(v)) { state.shopX = v; store.set("shopX", v);
        if (state.tab === "nakup") renderNakup(); }
    });
    // nákup
    onValue(this._ref("shop"), snap => {
      const v = snap.val();
      if (v && typeof v === "object") { state.shop = v; store.set("shop", v);
        if (state.tab === "nakup") renderNakup(); }
    });
    // přehled druhého
    const other = this.me === "p" ? "v" : "p";
    onValue(this._ref("stav/"+other), snap => {
      this.peer = snap.val();
      if (state.tab === "dnes") renderDnes();
      if (GRP_OF[state.tab] === "progres") renderProgres();
    });
    // živý trénink druhého (stejný balíček, co čte widget)
    onValue(this._ref("widget/"+other), snap => {
      this.peerW = snap.val();
      renderNext();
      if (state.tab === "dnes") renderDnes();
      if (state.tab === "trenink") renderTrenink();
    });
  },

  _set(path, val){
    if (!this.on) return;
    try { this._m.set(this._ref(path), val); } catch(e){}
  },
  _upd(path, obj){
    if (!this.on) return;
    try { this._m.update(this._ref(path), obj); } catch(e){}
  },

  pushFeed(m){ if (this.on) this._set("feed/"+m.id.replace(/[.#$/\[\]]/g,"_"), m); },
  pushFavs(){ this._set("favs", store.get("favs", [])); },
  pushFavJ(){ this._set("favj", store.get("favJ", [])); },
  pushFavR(){ this._set("favr", store.get("favR", [])); },
  spoluSet(obj){ this._set("spolu", obj); },
  spoluSet2(klic, val){ this._set("spolu/" + klic, val); },
  pushWeek(){ this._set("week", state.week); },
  pushShop(){ this._set("shop", state.shop); },
  pushRec(){ this._set("recepty", store.get("myRecipes", [])); },
  pushPlan(){ this._set("plan", state.plan); },
  pushJidlo(){ this._set("jidlo", state.jidlo); },
  pushNavrhy(){ this._set("navrhy", state.navrhy); },
  pushShopX(){ this._set("shopx", state.shopX); },

  /* kompaktní balíček pro widget na iPhonu (čte ho Scriptable přes REST) */
  widgetData(){
    const who = (this.me === "p" || this.me === "v") ? this.me : store.get("meId", null);
    if (!who || !BASE_T[who]) return null;
    const t = target(who);
    const today = new Date().toISOString().slice(0,10);
    const tot = dayTotals(who, today);
    const ted = new Date(), nyni = ted.getHours()*60 + ted.getMinutes();

    let next = null;
    planFor(who, todayIdx).forEach(j => {
      if (next) return;
      if (state.checks[today+"|"+who+"|"+j.slot]) return;
      if (minutyZ(j.time) + 150 < nyni) return;
      next = { cas: j.time, n: String(j.name).slice(0, 46) };
    });

    const dnesPlan = planDne(today)[who] || null;
    const tr = dnesPlan ? { co: String(dnesPlan).slice(0,28), hot: !!odtrenovano(today, who) } : null;

    let se = null;
    if (state.sess){
      const a = sessSoucty("ty");
      se = { rid: String(state.sess.rid).slice(0,20), hot: a.hot, cel: a.cel, min: a.min,
             zb: zbyvaMin(a.hot, a.cel, a.min, planMinut(state.sess.who, state.sess.rid)),
             bud: state.sess.bud ? sKym(state.sess.bud) : null, kdo: state.sess.who,
             jm: (BASE_T[state.sess.who] || {}).name || "" };
    }
    return {
      jm: BASE_T[who].name,
      kcal: tot.k, cil: t.kcal, prot: tot.p, cilP: t.prot,
      next: next, tr: tr, sess: se,
      voda: waterGet(who, today), vodaCil: Math.round(waterCil(who)/GLASS),
      serie: streak(who),
      kdy: new Date().toISOString()
    };
  },
  _wq: false, _lastW: null,
  pushWidget(){
    if (!this.on){ this._wq = true; return false; }   // nemame spojeni -> posleme, jakmile bude
    const d = this.widgetData();
    if (!d) return false;
    this._wq = false;
    this._lastW = new Date();
    this._set("widget/"+this.me, d);
    return true;
  },
  /* tep — volá se každou minutu i při návratu do appky */
  tik(){
    if (!this.on) return;
    const bezi = !!state.sess;
    const stari = this._lastW ? (Date.now() - this._lastW.getTime()) : 1e9;
    if (this._wq || bezi || stari > 110000) this.pushWidget();
  },

  pushStatus(){
    if (!this.on) return;
    const who = this.me, t = target(who);
    const today = new Date().toISOString().slice(0,10);
    const tot = dayTotals(who, today);
    const arr = who === "p" ? state.wtP : state.wtV;
    const last = arr.slice().sort((a,b)=>a.d.localeCompare(b.d)).pop();
    this._set("stav/"+who, {
      jmeno: BASE_T[who].name,
      kcal: tot.k, cil: t.kcal, prot: tot.p, cilProt: t.prot,
      serie: streak(who),
      vaha: last ? last.kg : null,
      kdy: new Date().toISOString()
    });
    this.pushWidget();
  },

  reset(){
    store.set("famId", null); store.set("meId", null);
    location.reload();
  }
};

/* ================= SPOLEČNÁ DATA OBOU TELEFONŮ =================
   Dřív si každý telefon nechával deník cviků, historii tréninků,
   vážení, míry, vodu i odškrtnutá jídla jenom pro sebe — přes server
   chodil jen malinký souhrn do karty „živě". Proto se u druhého
   nikdy nic nerozepsalo dál do statistik, rekordů ani odznaků.

   Teď se sdílí všechno. Každá položka má razítko, kdy se naposled
   změnila; při slučování vyhrává novější. Smazání je taky změna,
   takže se propíše i to, co jeden telefon zahodil.                */

const SDIL = {
 hist:    { c:"hist",   t:"pole",  id:x=>x.d+"|"+x.who+"|"+x.rid,                st:"hist"   },
 tlog:    { c:"tlog",   t:"denik", dnu:600, dat:id=>id.slice(-10) },
 tlogB:   { c:"tlogb",  t:"denik", dnu:600, dat:id=>id.slice(-10) },
 wtP:     { c:"wtp",    t:"pole",  id:x=>x.d,                                    st:"wtP"    },
 wtV:     { c:"wtv",    t:"pole",  id:x=>x.d,                                    st:"wtV"    },
 mrP:     { c:"mrp",    t:"pole",  id:x=>x.d,                                    st:"mrP"    },
 mrV:     { c:"mrv",    t:"pole",  id:x=>x.d,                                    st:"mrV"    },
 spar:    { c:"spar",   t:"pole",  id:x=>x.d+"|"+(x.who||"")+"|"+(x.bud||"")+"|"+(x.rid||""), st:"spar" },
 checks:  { c:"checks", t:"mapa",  st:"checks", dnu:200, dat:id=>id.slice(0,10) },
 water:   { c:"water",  t:"mapa",  st:"water",   dnu:200, dat:id=>id.slice(0,10) },
 spanek:  { c:"spanek", t:"mapa",  dnu:200, dat:id=>id.slice(0,10) },
 parti:   { c:"parti",  t:"pole",  id:x=>String(x) },
 odznaky: { c:"odz",    t:"pole",  id:x=>String(x) },
 pantry:  { c:"spiz",   t:"pole",  id:x=>String(x),                              st:"pantry" }
};
/* jednoduché hodnoty — sdílí se celé, vyhrává novější zápis */
const SDIL1 = ["queue","fb","cooked","lastCheckin","cyklus","shopHist","shopCasto","nakupDni",
 /* profily a čísla patří k člověku, ne k telefonu */
 "profil_p","profil_v","kcal_p","kcal_v",
 "n_prot_p","n_prot_v","n_water_p","n_water_v","n_mintr_p","n_mintr_v",
 "n_rozvrh_p","n_rozvrh_v","n_tren_p","n_tren_v","n_zkus_p","n_zkus_v",
 "n_casy","schval","stouch_p","stouch_v","solo"];
const SDIL1_ST = { queue:"queue", fb:"fb", lastCheckin:"lastCheckin", cyklus:"cyklus", nakupDni:"nakupDni" };

let sdilTicho = false;          // při slučování se nerazítkuje
const sdilFronta = {};

function fbKlic(id){ return String(id).replace(/[.#$/\[\]]/g, "~"); }
function kopie(v){ try { return JSON.parse(JSON.stringify(v === undefined ? null : v)); } catch(e){ return null; } }

/* hodnota → plochá mapa id → položka */
function sdilNaMapu(k, v){
 const d = SDIL[k], out = {};
 if (!d) return out;
 if (d.t === "pole"){
  (Array.isArray(v) ? v : []).forEach(x => { const id = fbKlic(d.id(x)); if (id) out[id] = x; });
 } else if (d.t === "mapa"){
  Object.keys(v || {}).forEach(kk => { out[fbKlic(kk)] = { k: kk, v: (v||{})[kk] }; });
 } else if (d.t === "denik"){
  Object.keys(v || {}).forEach(kk => (v[kk] || []).forEach(z => {
   out[fbKlic(kk + "|" + z.d)] = { k: kk, z: z };
  }));
 }
 return out;
}
/* plochá mapa → původní tvar */
function sdilZMapy(k, m){
 const d = SDIL[k];
 if (d.t === "pole"){
  const a = Object.keys(m).map(id => m[id]);
  if (a.length && a[0] && a[0].d) a.sort((x,y)=> String(x.d).localeCompare(String(y.d)));
  return a;
 }
 if (d.t === "mapa"){
  const o = {};
  Object.keys(m).forEach(id => { const it = m[id]; if (it && it.k !== undefined) o[it.k] = it.v; });
  return o;
 }
 const o = {};
 Object.keys(m).forEach(id => {
  const it = m[id]; if (!it || it.k === undefined) return;
  (o[it.k] = o[it.k] || []).push(it.z);
 });
 Object.keys(o).forEach(kk => o[kk].sort((x,y)=> String(x.d).localeCompare(String(y.d))));
 return o;
}

/* razítka: co se od minule změnilo nebo zmizelo */
function sdilRazitka(k, novy){
 if (sdilTicho) return;
 const stary = sdilNaMapu(k, store.get(k, SDIL[k].t === "pole" ? [] : {}));
 const cerstvy = sdilNaMapu(k, novy);
 const ts = store.get("ts_" + k, {}) || {};
 const ted = Date.now();
 let zmena = false;
 Object.keys(cerstvy).forEach(id => {
  if (!(id in stary) || JSON.stringify(stary[id]) !== JSON.stringify(cerstvy[id])){ ts[id] = ted; zmena = true; }
 });
 Object.keys(stary).forEach(id => { if (!(id in cerstvy)){ ts[id] = ted; zmena = true; } });
 if (zmena) store.set("ts_" + k, ts);
}

/* co poslat na server */
function sdilBalik(k){
 const d = SDIL[k];
 const m = sdilNaMapu(k, store.get(k, d.t === "pole" ? [] : {}));
 const ts = store.get("ts_" + k, {}) || {};
 const mez = d.dnu ? new Date(Date.now() - d.dnu * 86400000).toISOString().slice(0,10) : null;
 const stary = id => { if (!mez || !d.dat) return false; const x = d.dat(id); return x && x < mez; };
 const v = {}, t = {};
 Object.keys(m).forEach(id => { if (!stary(id)) v[id] = { i: kopie(m[id]) }; });
 Object.keys(ts).forEach(id => { if (!stary(id)) t[id] = ts[id]; });
 return { v: v, t: t };
}

function sdilNaplanuj(k){
 if (!(window.sync && sync.on)) return;
 clearTimeout(sdilFronta[k]);
 sdilFronta[k] = setTimeout(()=>{ sdilPosli(k); }, 500);
 stavNaplanuj();
}
/* ať druhý telefon pozná, že jsme tu byli — a to po každé změně, ne jen po tréninku */
let stavTik = null;
function stavNaplanuj(){
 if (!(window.sync && sync.on)) return;
 clearTimeout(stavTik);
 stavTik = setTimeout(()=>{ try { sync.pushStatus(); } catch(e){} }, 1500);
}
function sdilPosli(k){
 if (!(window.sync && sync.on)) return;
 const b = sdilBalik(k);
 const bylo = sync._sdilPos[k] || { v:{}, t:{} };
 const zm = {};
 Object.keys(b.v).forEach(id => {
  if (JSON.stringify(bylo.v[id]) !== JSON.stringify(b.v[id])) zm["v/" + id] = b.v[id];
 });
 Object.keys(bylo.v).forEach(id => { if (!(id in b.v)) zm["v/" + id] = null; });
 Object.keys(b.t).forEach(id => { if (bylo.t[id] !== b.t[id]) zm["t/" + id] = b.t[id]; });
 Object.keys(bylo.t).forEach(id => { if (!(id in b.t)) zm["t/" + id] = null; });
 if (!Object.keys(zm).length) return;
 sync._sdilPos[k] = b;
 sync._upd("sdil/" + SDIL[k].c, zm);
}
function sdil1Posli(k){
 if (!(window.sync && sync.on)) return;
 const cas = (store.get("ts1", {}) || {})[k] || 0;
 if (!cas) return;      // tuhle hodnotu jsme nikdy neměnili — nepřepisuj ji druhému prázdnem
 const b = { v: kopie(store.get(k, null)), t: cas };
 const otisk = JSON.stringify(b);
 if (sync._sdilPos["1:" + k] === otisk) return;
 sync._sdilPos["1:" + k] = otisk;
 sync._set("sdil1/" + k, b);
}

/* sloučení jednoho balíku od druhého telefonu */
function sdilSluc(k, vzdal){
 const d = SDIL[k];
 const prazdno = d.t === "pole" ? [] : {};
 const lok = sdilNaMapu(k, store.get(k, prazdno));
 const tsL = store.get("ts_" + k, {}) || {};
 const rv = (vzdal && vzdal.v) || {}, rt = (vzdal && vzdal.t) || {};
 const ids = {};
 [lok, tsL, rv, rt].forEach(o => Object.keys(o).forEach(id => ids[id] = 1));
 const out = {}, tsN = {};
 const hranice = Date.now() - 120 * 86400000;        // staré náhrobky zahodíme
 Object.keys(ids).forEach(id => {
  const maL = id in lok, maR = id in rv;
  const tl = tsL[id] || (maL ? 1 : 0);
  const tr = rt[id]  || (maR ? 1 : 0);
  const vyhraL = tl >= tr;
  const ma = vyhraL ? maL : maR;
  const cas = Math.max(tl, tr);
  if (ma) { out[id] = vyhraL ? lok[id] : (rv[id] && rv[id].i); if (cas > 1) tsN[id] = cas; }
  else if (cas > 1 && cas > hranice) tsN[id] = cas;   // náhrobek — smazáno
 });
 Object.keys(out).forEach(id => { if (out[id] === undefined || out[id] === null) delete out[id]; });
 const nova = sdilZMapy(k, out);
 const zmena = JSON.stringify(nova) !== JSON.stringify(store.get(k, prazdno));
 sdilTicho = true;
 store.set(k, nova);
 store.set("ts_" + k, tsN);
 sdilTicho = false;
 if (d.st) state[d.st] = nova;
 return zmena;
}
function sdil1Sluc(k, vzdal){
 if (!vzdal) return false;
 const tsAll = store.get("ts1", {}) || {};
 const tl = tsAll[k] || 0, tr = vzdal.t || 0;
 if (tr <= tl) return false;
 const nova = vzdal.v === undefined ? null : vzdal.v;
 if (JSON.stringify(nova) === JSON.stringify(store.get(k, null))) { tsAll[k] = tr; store.set("ts1", tsAll); return false; }
 sdilTicho = true;
 store.set(k, nova);
 sdilTicho = false;
 tsAll[k] = tr; store.set("ts1", tsAll);
 if (SDIL1_ST[k]) state[SDIL1_ST[k]] = nova;
 return true;
}

/* první rozjezd po propojení — pošli všechno, co mám */
function sdilPosliVse(){
 Object.keys(SDIL).forEach(k => sdilPosli(k));
 SDIL1.forEach(k => {
  // co jsme nikdy nerazítkovali, orazítkujeme teď — jinak by to na server nedolétlo
  const ts = store.get("ts1", {}) || {};
  if (!ts[k] && store.get(k, null) !== null){ ts[k] = 1; store.set("ts1", ts); }
  sdil1Posli(k);
 });
}

/* store.set se stará o razítka i o odeslání — nemusí se to psát u každé změny */
(function(){
 const puvodni = store.set.bind(store);
 store.set = function(k, v){
  const sdilena = !!SDIL[k];
  if (sdilena && !sdilTicho) sdilRazitka(k, v);
  if (SDIL1.indexOf(k) >= 0 && !sdilTicho){
   const t = store.get("ts1", {}) || {};
   if (JSON.stringify(v) !== JSON.stringify(store.get(k, null))){ t[k] = Date.now(); puvodni("ts1", t); }
  }
  const r = puvodni(k, v);
  if (sdilena) sdilNaplanuj(k);
  else if (SDIL1.indexOf(k) >= 0) sdil1Posli(k);
  return r;
 };
})();

function pozdrav(){ const h = new Date().getHours(); return h < 10 ? "Dobré ráno" : (h < 18 ? "Ahoj" : "Dobrý večer"); }

function ringSvg(pk, pp){
  const R1 = 48, R2 = 36, C1 = 2*Math.PI*R1, C2 = 2*Math.PI*R2;
  const arc = (c, p) => (c*Math.min(100,p)/100).toFixed(1) + " " + c.toFixed(1);
  return '<svg class="ring" viewBox="0 0 112 112" aria-hidden="true">'
   +'<circle class="bg1" cx="56" cy="56" r="'+R1+'" stroke-width="8"></circle>'
   +'<circle class="fg1" cx="56" cy="56" r="'+R1+'" stroke-width="8" stroke-dasharray="'+arc(C1,pk)+'"></circle>'
   +'<circle class="bg3" cx="56" cy="56" r="'+R2+'" stroke-width="8"></circle>'
   +'<circle class="fg3" cx="56" cy="56" r="'+R2+'" stroke-width="8" stroke-dasharray="'+arc(C2,pp)+'"></circle>'
   +'<text x="56" y="54" text-anchor="middle">'+pk+'%</text>'
   +'<text class="sm" x="56" y="69" text-anchor="middle">z cíle</text></svg>';
}

function ringCard(iso){
  const who = store.get("meId", null);
  if (!who || !BASE_T[who]) return "";
  const tgt = target(who);
  let dk = 0, dp = 0;
  planForIso(who, iso).forEach(m => { if (state.checks[iso+"|"+who+"|"+m.slot]){ dk += m.kcal; dp += m.prot; } });
  const pk = Math.min(100, Math.round(dk/tgt.kcal*100));
  const pp = Math.min(100, Math.round(dp/tgt.prot*100));
  const st = streak(who);
  let vzkaz;
  if (pk >= 100 && pp >= 100) vzkaz = "Den splněný. Přesně tohle dělá tu změnu. 🎉";
  else if (pp >= 100)         vzkaz = "Bílkoviny máš celé — zbytek dojedeš levou zadní.";
  else if (pk >= 60)          vzkaz = "Půlka za tebou. Drž se plánu, jde ti to.";
  else if (dk === 0)          vzkaz = "Čistý den před tebou. Rozhoduje první jídlo.";
  else                        vzkaz = "Rozjeto! Hlavně nezapomeň na bílkoviny.";
  return '<div class="card ring-card">' + ringSvg(pk, pp)
   +'<div style="flex:1;min-width:168px">'
   +'<h3 style="margin-bottom:7px">'+(iso === isoDnes()
       ? pozdrav()+', '+esc(tgt.name)+' '+(who==="v"?"✨":"💪")
       : esc(popisDne(iso, 9))+' — plán')+'</h3>'
   +'<div class="rkey"><s style="background:var(--s1)"></s>Kalorie <b>'+fmt(dk)+' / '+fmt(tgt.kcal)+'</b></div>'
   +'<div class="rkey"><s style="background:var(--s3)"></s>Bílkoviny <b>'+dp+' / '+tgt.prot+' g</b></div>'
   +'<p class="who" style="margin:9px 0 0">'+vzkaz+(st > 1 ? ' · série <b>'+st+' dní</b> 🔥' : '')+'</p>'
   +'</div></div>';
}

   Web se do HealthKitu nedostane — to umí jen nativní appky. Zkratka
   na iPhonu ale umí obojí: přečíst Health a poslat požadavek na server.
   Nechává tedy v databázi lísteček a appka si ho přebere a zaúčtuje.  */

function inboxPopis(z){
 if (z.typ === "spanek")  return "spánek " + String(z.h).replace(".", ",") + " h";
 if (z.typ === "vaha")    return "váha " + String(z.kg).replace(".", ",") + " kg";
 if (z.typ === "trenink") return "trénink " + (z.nazev || "z hodinek") + " · " + (z.min || 0) + " min";
 return z.typ || "záznam";
}
function inboxZpracuj(z){
 if (!z || typeof z !== "object" || !z.typ) return null;
 const kdo = (z.kdo === "p" || z.kdo === "v") ? z.kdo : (store.get("meId", "p") || "p");
 const d = /^\d{4}-\d{2}-\d{2}$/.test(String(z.d || "")) ? z.d : isoDnes();

 if (z.typ === "spanek"){
  const h = parseFloat(z.h);
  if (!h || isNaN(h) || h <= 0 || h > 14) return null;
  spanekSet(kdo, d, h, z.q ? +z.q : undefined);
  return inboxPopis({ typ:"spanek", h: Math.round(h*2)/2 });
 }
 if (z.typ === "vaha"){
  const kg = Math.round(parseFloat(z.kg) * 10) / 10;
  if (!kg || isNaN(kg) || kg < 30 || kg > 250) return null;
  const arr = (wtArr(kdo) || []).filter(x => x.d !== d).concat([{ d: d, kg: kg }])
    .sort((a,b)=>a.d.localeCompare(b.d));
  if (kdo === "p"){ state.wtP = arr; store.set("wtP", arr); }
  else { state.wtV = arr; store.set("wtV", arr); }
  return inboxPopis({ typ:"vaha", kg: kg });
 }
 if (z.typ === "trenink"){
  const min0 = Math.round(+z.min);
  if (!min0 || isNaN(min0) || min0 < 1 || min0 > 600) return null;
  const min = Math.min(300, min0);
  const nazev = String(z.nazev || "Trénink z hodinek").slice(0, 20);
  const kcal = Math.max(0, Math.round(+z.kcal || 0));
  const uz = (state.hist || []).some(x => x.who === kdo && x.d === d && x.rid === nazev);
  if (uz) return null;
  state.hist = (state.hist || []).concat([{ d: d, who: kdo, rid: nazev, min: min,
    sets: 0, obj: 0, kcal: kcal, zdroj: "watch" }]);
  store.set("hist", state.hist);
  return inboxPopis({ typ:"trenink", nazev: nazev, min: min });
 }
 return null;
}

function newFamCode(){
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  const buf = new Uint8Array(20);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  for (let i=0;i<20;i++) s += a[buf[i] % a.length];
  return s.match(/.{1,5}/g).join("-");
}

function pushMsg(id, ic, ti, tx){
 const msgs = store.get("msgs", []);
 if (msgs.some(m => m.id === id)) return false;
 const m = { id, ic, ti, tx, t: new Date().toISOString(), r: false,
             od: (store.get("meId", null) && BASE_T[store.get("meId")] ? BASE_T[store.get("meId")].name : "") };
 msgs.unshift(m);
 store.set("msgs", msgs.slice(0, 60));
 if (window.sync && sync.on) sync.pushFeed(m);
 return true;
}

function buildMsgs(){
 if (!nast("zpravyAuto", true)) return;
 const today = new Date().toISOString().slice(0,10);
 const dow = new Date().getDay();

 // denní motivace
 const m = MOTIV[(todayIdx + new Date().getDate()) % MOTIV.length];
 pushMsg("mot-"+today, m[0], m[1], m[2]);

 ["p","v"].forEach(who => {
  const nm = BASE_T[who].name;
  const t = target(who);
  const tot = dayTotals(who, today);

  if (tot.k >= t.kcal)
   pushMsg("goal-"+who+"-"+today, "🎉", nm+" "+rod(who,"dojedl","dojedla")+" celý den!",
     fmt(tot.k)+" kcal a "+tot.p+" g bílkovin. Kdyby tohle byla olympiáda, stojíš na bedně. "
     +"Zatím je to jen lednice, ale ta si to pamatuje. 🥇");
  else if (tot.k >= MIN_KCAL[who])
   pushMsg("min-"+who+"-"+today, "✅", nm+" má splněné minimum",
     fmt(tot.k)+" kcal. Není to hvězdný den, ale je to den, co se počítá. "
     +"A těch je potřeba mnohem víc než těch hvězdných.");

  const st = streak(who);
  [3,5,7,14,21,30,60].forEach(n => {
   if (st === n) pushMsg("st-"+who+"-"+n, "🔥", nm+" má "+n+" dní v řadě!",
     n >= 30 ? "Třicet dní. V tuhle chvíli už to není projekt, ale povahová vlastnost. 🏛️"
     : n >= 14 ? "Dva týdny bez zaváhání. Tohle už není náhoda, tohle je návyk — a ten se hůř ruší než předplatné."
     : n >= 7 ? "Celý týden. Sedmička je magická, protože po ní se vždycky říká „to už bych byl blbec, kdybych to teď pustil\"."
     : "Nepřetrhni to. Řada je jediná motivace, co funguje i ve čtvrtek večer.");
  });

  const arr = who==="p" ? state.wtP : state.wtV;
  const r = weeklyRate(arr);
  if (r){
   const wk = "w"+Math.floor(daysBetween("2026-08-08", today)/7);
   const rt = Math.round(r.rate*100)/100;
   if (who==="p" && rt < 0.15)
    pushMsg("adj-p-"+wk, "⚠️", jmeno("p")+" roste pomaleji, než slibuje",
      "Tempo "+rt.toLocaleString("cs-CZ")+" kg/týden. Váha se nehádá, jenom počítá. "
      +"V Průběhu je tlačítko, co přidá 250 kcal — a ta se musí i sníst, ne jen nastavit. 😏");
   if (who==="p" && rt >= 0.15 && rt <= 0.6)
    pushMsg("ok-p-"+wk, "📈", jmeno("p")+" roste přesně podle plánu",
      "Tempo "+rt.toLocaleString("cs-CZ")+" kg/týden. Nic neměň, nic nevylepšuj, nic nečti na internetu. "
      +"Tohle je ta nudná fáze, kde se to celé odehrává.");
   if (who==="v" && Math.abs(rt) < 0.45)
    pushMsg("ok-v-"+wk, "💪", jmeno("v")+" drží váhu přesně tak, jak má",
      "U rekompozice je stojící váha vítězství, ne stagnace. Mění se složení, ne číslo — "
      +"a to poznají dřív kalhoty než osobní váha. ✨");
  }
 });

 if (dow === 0) pushMsg("ne-"+today, "🛒", "Neděle — den, kdy se rozhoduje o celém týdnu",
   "Ráno na váhu (nalačno, bez výmluv), odpoledne nákup, večer 10 balíčků a 10 vajec natvrdo. "
   +"Hodina a půl práce výměnou za sedm dní klidu. Nejlepší kurz, co kde seženeš.");

 if (dow === 1) pushMsg("po-"+today, "🌅", "Pondělí. Ten den, co se v něm vždycky začíná",
   "Jenže vy jste začali už dávno, takže je to jenom další pondělí. To je celý ten trik. 😎");

 if (dow === 5) pushMsg("pa-"+today, "🍺", "Pátek — malá poznámka od appky",
   "Plán počítá s tím, že jste lidi. Jedno jídlo venku je zaneseno v rozpočtu. "
   +"Tři jídla venku a dvě piva jsou už kreativní účetnictví. 🌯");

 const wkNo = Math.floor(daysBetween("2026-08-08", today)/7) + 1;
 if (wkNo % 7 === 0) pushMsg("dl-"+wkNo, "🔻", "Deload týden ("+wkNo+".) — oficiální povolení ubrat",
   "Stejné cviky, stejné váhy, poloviční počet sérií. Ano, fakt. Ne, není to lenost, "
   +"je to naplánovaná lenost a ta se jmenuje regenerace. Po ní čísla skočí nahoru.");
}

/* ---- týdenní vyhodnocení + série ---- */
const MIN_KCAL = new Proxy({}, { get: (t, w) => (w === "p" || w === "v")
  ? (profilHotovy(w) ? vypocty(w).minKcal : (w === "p" ? 2800 : 1600)) : undefined });
function isoDaysAgo(n){ return isoPlus(-n); }

function dayTotals(who, iso){
 // kolik bylo ten den odškrtáno (jen z uložených checků, plán se bere z aktuálního nastavení)
 let k=0, p=0;
 planForIso(who, iso).forEach(m=>{ if (state.checks[iso+"|"+who+"|"+m.slot]) { k+=m.kcal; p+=m.prot; } });
 return {k,p};
}
function streak(who){
 let n = 0;
 for (let i=0; i<120; i++){
  const iso = isoDaysAgo(i);
  const t = dayTotals(who, iso);
  if (t.k >= MIN_KCAL[who]) n++;
  else if (i === 0) continue;   // dnešek se ještě počítá, nepřerušuje řadu
  else break;
 }
 return n;
}
function weekCard(who){
 const t = target(who);
 const days = [];
 for (let i=6;i>=0;i--){
  const iso = isoDaysAgo(i);
  const tot = dayTotals(who, iso);
  const wd = (wdOf(iso)+1) % 7;
  days.push({ lab: DAYS[(wd+6)%7], k: tot.k, ok: tot.k >= MIN_KCAL[who], part: tot.k > 0 && tot.k < MIN_KCAL[who] });
 }
 const okDays = days.filter(d=>d.ok).length;
 const st = streak(who);
 const arr = who==="p" ? state.wtP : state.wtV;
 const r = weeklyRate(arr);
 let verdict;
 if (okDays >= 6) verdict = "Týden sedí. <b>Přesně takhle to má vypadat</b> — nic neměň.";
 else if (okDays >= 4) verdict = "Slušný týden. Dva slabší dny nic nezkazí — zkus příště hlídat hlavně ten ranní start.";
 else if (okDays >= 1) verdict = "<b>Tady to drhne.</b> Nejrychlejší náprava je ranní shake a dva balíčky v tašce — to samo dá většinu denního minima.";
 else verdict = "Zatím bez odškrtnutých dnů. <b>Appka počítá jen to, co odklikneš</b> — jinak neví, jak na tom jste.";
 return '<div class="card"><div class="rhead"><h3>'+t.name+' — tento týden</h3>'
  +'<span class="rmeta">'+okDays+'/7 dní nad '+fmt(MIN_KCAL[who])+' kcal</span></div>'
  +'<div class="streak"><div class="big">'+st+'</div><div style="flex:1;min-width:140px">'
  +'<div style="font-size:14px;font-weight:600">'+(st===0?"Žádná série":(st===1?"den v řadě":(st<5?"dny v řadě":"dní v řadě")))+'</div>'
  +'<div class="dim" style="font-size:12.5px">Nad denním minimem '+fmt(MIN_KCAL[who])+' kcal</div></div></div>'
  +'<div class="wk">'+days.map(d=>'<div><i class="'+(d.ok?"ok":(d.part?"part":""))+'"></i>'+d.lab+'</div>').join("")+'</div>'
  +'<div class="note reco">'+verdict
  +(r ? '<div style="margin-top:6px">Váha: '+((Math.round(r.rate*100)/100)>0?"+":"")+(Math.round(r.rate*100)/100).toLocaleString("cs-CZ")+' kg/týden za '+r.span+' dní.</div>' : '')
  +'</div></div>';
}

const DNY_KR = ["","Po","Út","St","Čt","Pá","So","Ne"];

function nTgl(k, def, zap, vyp){
 const v = nast(k, def);
 return '<button class="'+(v?"act":"ghost")+' small" data-ntgl="'+k+'|'+(def?1:0)+'" type="button">'
  + (v ? (zap||"Zapnuto") : (vyp||"Vypnuto")) + '</button>';
}
function nSel(k, def, opts){
 const akt = String(nast(k, def));
 const list = opts.slice();
 // když spočítaná hodnota není v nabídce, doplníme ji — jinak by select
 // ukazoval první položku a lhal o tom, co je nastavené
 if (!list.some(o => String(o[0]) === akt)){
  const cislo = parseFloat(akt);
  list.push([akt, isNaN(cislo) ? akt : (cislo >= 1000 ? (cislo/1000).toLocaleString("cs-CZ")+" l (spočítané)" : akt)]);
  list.sort((a,b)=>(parseFloat(a[0])||0)-(parseFloat(b[0])||0));
 }
 return '<select data-nsel="'+k+'">'
  + list.map(o=>'<option value="'+o[0]+'"'+(String(o[0])===akt?" selected":"")+'>'+esc(o[1])+'</option>').join("")
  + '</select>';
}
function nRow(lab, ctrl, pop){
 return '<div class="nrow"><div class="nlab"><b>'+lab+'</b>'
  + (pop ? '<span class="dim">'+pop+'</span>' : '') + '</div><div class="nctl">'+ctrl+'</div></div>';

/* po překreslení vrátit kurzor tam, kde byl */
function keepFocus2(el){
 if (!el || !el.dataset || el.dataset.pr === undefined) return;
 const n = document.querySelector('[data-pr="'+el.dataset.pr+'"]');
 if (!n) return;
 const v = n.value;
 n.focus();
 try { n.setSelectionRange(v.length, v.length); } catch(e){}
}
function keepFocus(id){
 const el = document.getElementById(id);
 if (!el) return;
 const v = el.value;
 el.focus();
 try { el.setSelectionRange(v.length, v.length); } catch(err){}
}
document.addEventListener("input", e=>{
 if (state.sess && e.target.dataset && (e.target.dataset.sk !== undefined || e.target.dataset.sr !== undefined)){
  // hodnota jde do aktivni osoby
  const key = e.target.dataset.sk !== undefined ? e.target.dataset.sk : e.target.dataset.sr;
  const p = key.split("|"), set = sessSets(+p[0])[+p[1]];
  if (e.target.dataset.sk !== undefined) set.kg = e.target.value; else set.reps = e.target.value;
  saveSess();
  return;
 }
 if (e.target.dataset && e.target.dataset.pr !== undefined){
  const q = e.target.dataset.pr.split("|");
  const MEZE = { vek:[14,90], vyska:[130,220], vaha:[35,250] };
  const m = MEZE[q[1]];
  let v;
  if (m){
   v = parseFloat(String(e.target.value).replace(",", "."));
   if (!v || isNaN(v) || v < m[0] || v > m[1]) return;   // rozepsané číslo ignorujeme
  } else {
   v = String(e.target.value).slice(0,16);
  }
  profilSet(q[0], { [q[1]]: v });
  // překreslujeme jen to, co nekrade kurzor — celý Nastavení až na blur
  clearTimeout(state.prTik);
  state.prTik = setTimeout(()=>{
   if (state.onb !== null && state.onb !== undefined){ renderOnb(); keepFocus2(e.target); return; }
   renderDnes(); renderNext(); renderProgres();
  }, 700);
  return;
 }
 if (e.target.id === "pickQ" && state.pick0){
  state.pick0.q = e.target.value; state.pick0.qFocus = true; renderPick(); return;
 }
 if (e.target.id === "budName"){ state.budName = e.target.value; return; }
 if (e.target.id === "recQ"){ state.recQ = e.target.value; renderRecepty(); keepFocus("recQ"); }

document.addEventListener("keydown", e=>{
 if (e.key !== "Escape") return;
 if (state.pick0) zavriPick();

 else if (state.cook) closeCook();

});

(function theme(){
 const root = document.documentElement, btn = document.getElementById("themeBtn");
 const saved = store.get("theme", null);
 if (saved) root.setAttribute("data-theme", saved);
 const isDark = ()=>{
  const t = root.getAttribute("data-theme");
  if (t==="dark") return true;
  if (t==="light") return false;
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
 };
 const sync = ()=> btn.textContent = isDark() ? "Světlý" : "Tmavý";
 btn.addEventListener("click", ()=>{
  const next = isDark() ? "light" : "dark";
  root.setAttribute("data-theme", next); store.set("theme", next); sync();
 });
 sync();
})();

setInterval(()=>{ renderNext(); if (window.sync) sync.tik(); }, 60000);
document.addEventListener("visibilitychange", ()=>{
 if (!document.hidden && window.sync) sync.tik();
});
window.addEventListener("focus", ()=>{ if (window.sync) sync.tik(); });
document.getElementById("todayLine").textContent = "Dnes je "+DAYFULL[todayIdx]+" · "+DAYNOTE[todayIdx].replace(/^[^\s]+\s/,"");

  if ((kod || q.get("nova")) && jeNainstalovana()) history.replaceState(null, "", location.pathname);
 } catch(e){}
})();
(function deepLink(){
 try {
  const q = new URLSearchParams(location.search);
  const t = q.get("tab");
  if (t && TABS.indexOf(t) >= 0) showTab(t); else showTab("dnes");
  if (q.get("akce") === "sess" && state.sess) renderSession();
  if (q.get("akce") === "zpravy") otevriNotif();

})();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
 window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
