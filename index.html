<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<script src="firebase-config.js"></script>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="PEVE FIT">
<title>PEVE FIT — Pepulus &amp; Verune</title>
<style>
  :root{
    color-scheme:light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --s1:#2a78d6; --s1-track:#cde2fb;
    --s3:#1baf7a; --s3-track:#c7ede0;
    --s2:#eb6834;
    --good:#006300; --accent-soft:rgba(42,120,214,.08);
  }
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])){
      color-scheme:dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --s1:#3987e5; --s1-track:#184f95;
      --s3:#199e70; --s3-track:#0d4f38;
      --s2:#d95926;
      --good:#0ca30c; --accent-soft:rgba(57,135,229,.12);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s1-track:#184f95;
    --s3:#199e70; --s3-track:#0d4f38;
    --s2:#d95926;
    --good:#0ca30c; --accent-soft:rgba(57,135,229,.12);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--page);color:var(--text-primary);
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 14px 40px}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  h1{font-size:22px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--text-secondary);font-size:12.5px;margin:1px 0 0}
  .ghost{background:var(--surface-1);color:var(--text-secondary);border:1px solid var(--border);
         border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .ghost:hover{color:var(--text-primary)}

  nav.tabs{display:flex;gap:2px;background:var(--surface-1);border:1px solid var(--border);
           border-radius:12px;padding:4px;margin-bottom:18px}
  nav.tabs button{flex:1;background:none;border:0;border-radius:9px;padding:8px 2px;
                  font:inherit;font-size:13px;color:var(--text-secondary);cursor:pointer;line-height:1.25;
                  transition:background .14s ease,color .14s ease}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--text-primary);font-weight:600}
  .ticon{display:block;font-size:17px;line-height:1.15}
  @media(max-width:740px){
    nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0;border-radius:0;
             border-left:0;border-right:0;border-bottom:0;
             padding:6px 3px calc(6px + env(safe-area-inset-bottom))}
    nav.tabs button{font-size:11px;min-width:0;padding:6px 0}
    nav.tabs .ticon{font-size:21px;line-height:1.1}
    body{padding-bottom:88px}
  }
  @media(min-width:741px){ .ticon{display:inline;margin-right:6px;font-size:15px} }

  .subnav[hidden]{display:none}
  .subnav{display:flex;gap:3px;background:var(--surface-1);border:1px solid var(--border);
          border-radius:12px;padding:4px;margin:0 0 16px}
  .subnav button{flex:1;background:none;border:0;border-radius:9px;padding:8px 4px;font:inherit;
          font-size:13.5px;color:var(--text-secondary);cursor:pointer;line-height:1.2;
          transition:background .14s ease,color .14s ease}
  .subnav button[aria-selected="true"]{background:var(--accent-soft);color:var(--text-primary);font-weight:600}
  @media(max-width:740px){ .subnav{margin-top:-4px} }

  .ring-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ring{width:112px;height:112px;flex:none}
  .ring circle{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
  .ring .bg1{stroke:var(--s1-track)} .ring .fg1{stroke:var(--s1);transition:stroke-dasharray .5s ease}
  .ring .bg3{stroke:var(--s3-track)} .ring .fg3{stroke:var(--s3);transition:stroke-dasharray .5s ease}
  .ring text{font:600 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text-primary)}
  .ring text.sm{font-size:9.5px;font-weight:500;fill:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .rkey{font-size:12.5px;color:var(--text-secondary);display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .rkey b{color:var(--text-primary);font-variant-numeric:tabular-nums}
  .rkey s{width:9px;height:9px;border-radius:50%;display:block;flex:none}

  .sess{position:fixed;inset:0;z-index:110;background:var(--page);overflow-y:auto;
        padding:0 12px calc(112px + env(safe-area-inset-bottom))}
  .sess[hidden]{display:none}
  .sess-head{position:sticky;top:0;z-index:3;margin:0 -12px 12px;padding:12px 14px;
             background:color-mix(in srgb, var(--surface-1) 92%, transparent);
             backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
             border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .sess-head .t{flex:1;min-width:130px}
  .sess-head .nm{font-size:15.5px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
  .sess-head .mt{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums;margin-top:2px}
  .sess-head .clock{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .sess-bar{height:4px;border-radius:3px;background:var(--grid);margin:-6px -12px 12px;overflow:hidden}
  .sess-bar i{display:block;height:100%;background:var(--s3);transition:width .25s ease}

  .setrow{display:grid;grid-template-columns:24px 1fr 66px 58px 40px;gap:7px;align-items:center;padding:4px 0}
  .setrow .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
  .setrow .prev{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .setrow input{width:100%;text-align:center;padding:9px 2px;margin:0;font-size:14.5px}
  .setrow .okbtn{width:100%;height:38px;border-radius:9px;border:1px solid var(--border);
                 background:var(--surface-1);color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0}
  .setrow.done .okbtn{background:var(--s3);border-color:var(--s3);color:#fff}
  .setrow.done input{opacity:.55}
  .sethead{display:grid;grid-template-columns:24px 1fr 66px 58px 40px;gap:7px;
           font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
           padding-bottom:4px;border-bottom:1px solid var(--grid);margin-bottom:4px}
  .sethead span:nth-child(3),.sethead span:nth-child(4){text-align:center}
  .exhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .exhead .n{font-size:15px;font-weight:600;flex:1;min-width:0;line-height:1.25}
  .exhead .tgt{font-size:12px;color:var(--text-secondary);white-space:nowrap}
  .addset{background:none;border:1px dashed var(--border);border-radius:9px;color:var(--text-secondary);
          font:inherit;font-size:12.5px;padding:7px;width:100%;cursor:pointer;margin-top:7px}
  .sess-foot{position:fixed;left:0;right:0;bottom:0;z-index:115;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
             background:color-mix(in srgb, var(--surface-1) 94%, transparent);
             backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
             border-top:1px solid var(--border);display:flex;gap:9px}
  .sess-foot button{flex:1;padding:14px 8px;font-size:15px;border-radius:12px}
  .prbadge{background:var(--s2);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}

  .cook{position:fixed;inset:0;z-index:100;background:var(--surface-1);overflow-y:auto;
        padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .cook[hidden]{display:none}
  .cook .chead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
  .cook h2{margin:0;font-size:19px;text-transform:none;letter-spacing:0;color:var(--text-primary);flex:1}
  .cook .xbtn{background:none;border:1px solid var(--border);border-radius:10px;color:var(--text-secondary);
              font:inherit;font-size:14px;padding:6px 11px;cursor:pointer;flex:none}
  .cook .cstep{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin-bottom:8px}
  .cook .ctext{font-size:23px;line-height:1.42;font-weight:500;margin:0 0 20px}
  .cook .cnav{display:flex;gap:9px;margin:22px 0 16px;position:sticky;bottom:0;background:var(--surface-1);padding:10px 0}
  .cook .cnav button{flex:1;padding:15px 8px;font-size:15.5px;border-radius:12px}
  .cook .dots{display:flex;gap:5px;margin-bottom:16px}
  .cook .dots i{flex:1;height:4px;border-radius:3px;background:var(--grid);display:block}
  .cook .dots i.on{background:var(--s1)}
  .cook .cing{font-size:14px;line-height:1.85}
  .cook .tset{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}

  .chart{width:100%;height:150px;display:block;margin:6px 0 4px}
  .chart .ax{stroke:var(--baseline);stroke-width:1}
  .chart .gl{stroke:var(--grid);stroke-width:1}
  .chart text{font:500 10px system-ui,-apple-system,sans-serif;fill:var(--muted)}
  .chart .avg{stroke-dasharray:none}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:2px 0 8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:3px;border-radius:2px;display:block}
  .legend i.dot{width:9px;height:9px;border-radius:50%}

  .fotky{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:8px 0}
  .fotky figure{margin:0;flex:none;width:104px}
  .fotky img{width:104px;height:139px;object-fit:cover;border-radius:10px;border:1px solid var(--border);display:block}
  .fotky figcaption{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
  .fotky figcaption button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:0 3px}
  .cmp{display:flex;gap:10px;align-items:flex-start}
  .cmp figure{flex:1;margin:0;min-width:0}
  .cmp img{width:100%;border-radius:11px;border:1px solid var(--border);display:block}
  .cmp figcaption{font-size:11.5px;color:var(--muted);text-align:center;margin-top:4px}
  .cyk{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .cyk .den{font-size:27px;font-weight:700;line-height:1;min-width:46px}

  .odz{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px;margin-top:10px}
  .odz .o{text-align:center;padding:11px 6px;border:1px solid var(--border);border-radius:12px}
  .odz .o.on{background:var(--accent-soft);border-color:var(--s1)}
  .odz .e{font-size:25px;line-height:1.15;filter:grayscale(1);opacity:.35}
  .odz .o.on .e{filter:none;opacity:1}
  .odz .t{font-size:11.5px;font-weight:600;margin-top:4px;line-height:1.25}
  .odz .s{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3}
  .hbar{display:grid;grid-template-columns:1fr;gap:7px;margin-top:10px}
  .hbar .row{display:grid;grid-template-columns:1fr 58px;gap:9px;align-items:center}
  .hbar .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbar .tr{height:9px;border-radius:5px;background:var(--grid);overflow:hidden;margin-top:3px}
  .hbar .tr i{display:block;height:100%;border-radius:5px;background:var(--s1)}
  .hbar .vl{font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;color:var(--text-secondary)}
  .stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:10px 0 8px;gap:2px;background:var(--grid)}
  .stack i{display:block;height:100%}
  .stack-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary)}
  .stack-leg s{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;text-decoration:none}
  .kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 2px}
  @media(min-width:741px){ .kpi{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .kpi div{background:var(--accent-soft);border-radius:11px;padding:9px 10px}
  .kpi .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;line-height:1.3}
  .kpi .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}

  .odz-next{display:flex;align-items:center;gap:11px;margin-top:10px;background:var(--accent-soft);
            border:1px solid var(--border);border-radius:12px;padding:9px 12px}
  .odz-next .e{font-size:24px;flex:none;line-height:1;filter:grayscale(.55);opacity:.75}
  .odz-next .b{flex:1;min-width:0;font-size:13px;line-height:1.35}
  .odz-next .kdy{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
                 background:var(--surface-1);border:1px solid var(--border);border-radius:999px;padding:4px 10px}
  .rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 4px}
  .rep-grid div{background:var(--accent-soft);border-radius:11px;padding:10px}
  .rep-grid .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .rep-grid .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
  .rep-grid .p{font-size:11.5px;color:var(--text-secondary)}

  .form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:9px}
  .form-row label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;
                  display:block;margin-bottom:3px}
  .form-row .f{flex:1;min-width:120px}
  .form-row input, .form-row select{width:100%;margin-top:0}
  textarea.f2{width:100%;background:var(--surface-1);color:var(--text-primary);border:1px solid var(--border);
              border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;min-height:78px;line-height:1.5}
  .mine{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
  .mine:last-child{border-bottom:none}
  .mine .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:17px;padding:0 4px;line-height:1}

  .bell{position:relative;background:var(--surface-1);border:1px solid var(--border);border-radius:11px;
        width:38px;height:34px;display:grid;place-items:center;font-size:17px;cursor:pointer;flex:none;
        transition:background .15s ease,border-color .15s ease}
  .bell:hover{border-color:var(--s1)}
  .bell .dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;
             background:var(--s2);border:2px solid var(--surface-1)}
  .bell .dot[hidden]{display:none}

  .sheet{position:fixed;inset:0;z-index:130;background:var(--page);overflow-y:auto;
         padding:0 12px calc(28px + env(safe-area-inset-bottom))}
  .sheet[hidden]{display:none}
  .duoswitch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
 .duoswitch button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 11px;
   border-radius:12px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);
   font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:left;min-width:0}
 .duoswitch button i{font-style:normal;font-size:11.5px;font-weight:600;opacity:.8;
   font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
 .duoswitch button.on{background:var(--s1);border-color:var(--s1);color:#fff}
 .duoscore{font-size:13px;padding:9px 12px;border-radius:11px;margin:0 0 12px;line-height:1.4;
   border:1px solid var(--border);background:var(--surface-1)}
 .duoscore.vedes{border-color:var(--s3)}
 .duoscore.prohravas{border-color:var(--s2)}
 .duotag{font-size:11.5px;color:var(--text-secondary);margin:-2px 0 6px}
 .duotag b{color:var(--text-primary)}
 .duobadge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;
   background:var(--s1-track);color:var(--text-primary);vertical-align:middle;margin-left:4px}
 .duomini{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;
   border-top:1px solid var(--grid);font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
 .duomini b{color:var(--text-primary)}
 .duomini em{font-style:normal;margin-left:auto;font-weight:700;color:var(--s1)}
 .sparcard{border-color:var(--s1-track)}
 .sparbil{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12.5px;
   color:var(--text-secondary);font-variant-numeric:tabular-nums}
 .sparbil span{background:var(--surface-1);border:1px solid var(--border);border-radius:99px;padding:4px 10px}
 .sparrow{padding:11px 0;border-bottom:1px solid var(--grid)}
 .sparrow:last-of-type{border-bottom:0}
 .sparrow .sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
 .sbar{position:relative;height:20px;border-radius:7px;background:var(--grid);overflow:hidden;margin:7px 0}
 .sbar i{display:block;height:100%;background:var(--s3)}
 .sbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
   font-size:11.5px;font-weight:700;color:var(--text-primary)}
 td.num.win{color:var(--s3);font-weight:700}
 .nrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
   padding:11px 0;border-bottom:1px solid var(--grid)}
 .nrow:last-child{border-bottom:0}
 .nlab{min-width:0;flex:1 1 150px;display:flex;flex-direction:column;gap:2px;font-size:14px}
 .nlab .dim{font-size:12px;line-height:1.35}
 .nctl{flex:0 0 auto;display:flex;align-items:center;gap:8px}
 .nctl select{width:auto;min-width:132px;padding:7px 9px;font-size:13.5px}
 .nnum{display:inline-flex;align-items:center;gap:6px;background:var(--surface-1);border:1px solid var(--border);
   border-radius:9px;padding:2px 9px 2px 4px}
 .nnum input{width:78px;border:0;background:transparent;color:var(--text-primary);font:inherit;
   font-weight:700;font-size:14.5px;text-align:right;padding:6px 2px}
 .nnum input::-webkit-outer-spin-button,.nnum input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
 .nnum i{font-style:normal;font-size:12px;color:var(--text-secondary)}
 .dnyp{display:flex;flex-wrap:wrap;gap:6px}
 .dnyp button{padding:7px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface-1);
   color:var(--text-secondary);font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-width:40px}
 .dnyp button.on{background:var(--s1);border-color:var(--s1);color:#fff}
 .caslist{margin-top:8px;gap:8px}
 .caslist span{display:inline-flex;align-items:center;gap:6px;background:var(--surface-1);
   border:1px solid var(--border);border-radius:9px;padding:4px 8px;font-size:13px}
 .caslist input{border:0;background:transparent;color:var(--text-primary);font:inherit;font-size:13px;padding:2px}
 .nblok{margin-top:12px;padding:11px 12px;background:var(--surface-1);border:1px solid var(--border);border-radius:12px}
 .nblok .nh{font-weight:700;font-size:14px;margin-bottom:8px}
 .nintro h3{margin-bottom:2px}
 .sheet-head{position:sticky;top:0;z-index:3;margin:0 -12px 12px;padding:13px 14px;
              background:color-mix(in srgb, var(--surface-1) 93%, transparent);
              backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);

<script type="text/plain" id="widgetSrc">
// PEVE FIT — widget na plochu a zamčenou obrazovku
// Scriptable · vygenerováno appkou. Nic tu nemusíš měnit.
// Varianty: kolecko / obdelnik / radek (zamčená obrazovka), malý / střední (plocha)

const FAM = "__FAM__";
const ME  = "__ME__";
const KEY = "__KEY__";
const DB  = "__DB__";
const WEB = "__WEB__";

const BARVA = { p: new Color("#2a78d6"), v: new Color("#eb6834"),
                ok: new Color("#1baf7a"), dim: new Color("#8b8f98") };

// ---------- přihlášení (anonymní, token se schová do cache) ----------
async function token(){
  const fm = FileManager.local();
  const cesta = fm.joinPath(fm.cacheDirectory(), "pevefit-token.json");
  let d = null;
  if (fm.fileExists(cesta)){ try { d = JSON.parse(fm.readString(cesta)); } catch(e){} }
  if (d && d.id && d.exp > Date.now() + 60000) return d.id;

  let id = null, ref = null, exp = 0;
  if (d && d.ref){
    try {
      const r = new Request("https://securetoken.googleapis.com/v1/token?key=" + KEY);
      r.method = "POST";
      r.headers = { "Content-Type": "application/x-www-form-urlencoded" };
      r.body = "grant_type=refresh_token&refresh_token=" + encodeURIComponent(d.ref);
      const j = await r.loadJSON();
      if (j.id_token){ id = j.id_token; ref = j.refresh_token; exp = Date.now() + (+j.expires_in - 120) * 1000; }
    } catch(e){}
  }
  if (!id){
    const r = new Request("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + KEY);
    r.method = "POST";
    r.headers = { "Content-Type": "application/json" };
    r.body = JSON.stringify({ returnSecureToken: true });
    const j = await r.loadJSON();
    if (!j.idToken) throw new Error("Přihlášení selhalo");
    id = j.idToken; ref = j.refreshToken; exp = Date.now() + (+j.expiresIn - 120) * 1000;
  }
  fm.writeString(cesta, JSON.stringify({ id: id, ref: ref, exp: exp }));
  return id;
}

async function nacti(){
  const t = await token();
  const r = new Request(DB + "/rodiny/" + FAM + "/widget.json?auth=" + t);
  r.timeoutInterval = 12;
  const j = await r.loadJSON();
  return j || {};
}

// ---------- pomocníci ----------
const cislo = n => Math.round(n || 0).toLocaleString("cs-CZ").replace(/ /g, " ");
const pct = (a, b) => Math.max(0, Math.min(100, Math.round((a || 0) * 100 / (b || 1))));

// jak stará jsou data — ať poznáš rozdíl mezi "nefunguje" a "iOS to ještě neobnovil"
function stari(d){
  if (!d || !d.kdy) return "";
  const m = Math.round((Date.now() - new Date(d.kdy).getTime()) / 60000);
  if (m < 2) return "teď";
  if (m < 60) return "před " + m + " min";
  const h = Math.round(m / 60);
  return "před " + h + " h";
}

function coTed(d){
  if (!d) return { ic: "🍽️", t: "Otevři appku", p: "žádná data", url: WEB };
  if (d.sess) return { ic: "🏋️",
    t: "Trénink " + d.sess.rid + " běží" + (d.sess.kdo && d.sess.kdo !== ME && d.sess.jm ? " (" + d.sess.jm + ")" : ""),
    p: d.sess.hot + "/" + d.sess.cel + " sérií · " + d.sess.min + " min" + (d.sess.bud ? " · s " + d.sess.bud : ""),
    url: WEB + "?tab=trenink&akce=sess" };
  if (d.tr && !d.tr.hot) return { ic: "🏋️", t: "Dneska " + d.tr.co, p: "zatím nezapsáno", url: WEB + "?tab=trenink" };
  if (d.next) return { ic: "🍽️", t: d.next.cas + " · " + d.next.n, p: "další na řadě", url: WEB + "?tab=dnes" };
  const zbyva = (d.cil || 0) - (d.kcal || 0);
  if (zbyva > 0) return { ic: "🌙", t: cislo(zbyva) + " kcal do cíle", p: "dojeď to", url: WEB + "?tab=dnes" };
  return { ic: "✅", t: "Dnešek splněný", p: cislo(d.kcal) + " kcal", url: WEB + "?tab=progres" };
}

function pruh(st, hod, max, barva, sirka){
  const c = st.addStack();
  c.size = new Size(sirka, 5);
  c.cornerRadius = 2.5;
  c.backgroundColor = new Color("#8b8f98", 0.28);
  const i = c.addStack();
  i.size = new Size(Math.max(3, sirka * pct(hod, max) / 100), 5);
  i.cornerRadius = 2.5;
  i.backgroundColor = barva;
  c.addSpacer();            // ať pruh roste zleva, ne od středu
  return c;
}

function radek(st, popis, hod, max, jednotka, barva, sirka){
  const r = st.addStack();
  r.layoutHorizontally();
  r.size = new Size(sirka, 0);
  const a = r.addText(popis);
  a.font = Font.systemFont(10);
  a.textColor = BARVA.dim;
  r.addSpacer();
  const b = r.addText(cislo(hod) + " / " + cislo(max) + (jednotka || ""));
  b.font = Font.mediumSystemFont(10);
  b.textColor = pct(hod, max) >= 100 ? BARVA.ok : Color.dynamic(Color.black(), Color.white());
  st.addSpacer(3);
  pruh(st, hod, max, barva, sirka);
  st.addSpacer(7);
}

function pozadi(w){
  const g = new LinearGradient();
  g.colors = [
    Color.dynamic(new Color("#ffffff"), new Color("#1b1d22")),
    Color.dynamic(new Color("#eef3fa"), new Color("#14161a"))
  ];
  g.locations = [0, 1];
  w.backgroundGradient = g;
}

function nadpis(w, c, vpravo){
  const hl = w.addStack();
  hl.layoutHorizontally();
  hl.centerAlignContent();
  const nm = hl.addText("PEVE FIT");
  nm.font = Font.boldSystemFont(9.5);
  nm.textColor = BARVA[ME] || BARVA.p;
  hl.addSpacer();
  if (vpravo){
    const v = hl.addText(vpravo);
    v.font = Font.systemFont(9.5);
    v.textColor = BARVA.dim;
  }
  w.addSpacer(6);
  const t = w.addText(c.ic + " " + c.t);
  t.font = Font.boldSystemFont(14.5);
  t.lineLimit = 2;
  t.minimumScaleFactor = 0.85;
  const p = w.addText(c.p);
  p.font = Font.systemFont(10.5);
  p.textColor = BARVA.dim;
  p.lineLimit = 1;
}

function odstavec(st, ic, text, barva){
  const r = st.addStack();
  r.layoutHorizontally();
  const a = r.addText(ic + " " + text);
  a.font = Font.systemFont(10.5);
  a.textColor = barva || BARVA.dim;
  a.lineLimit = 1;
  st.addSpacer(4);
}

// ---------- zamčená obrazovka ----------
function kolecko(d){
  const w = new ListWidget();
  const c = coTed(d);
  w.url = c.url;
  if (d && d.sess){
    const e = w.addText("🏋️"); e.centerAlignText(); e.font = Font.systemFont(11);
    const t = w.addText(d.sess.hot + "/" + d.sess.cel);
    t.font = Font.boldSystemFont(15); t.centerAlignText();
  } else {
    const z = Math.max(0, ((d && d.cil) || 0) - ((d && d.kcal) || 0));
    const t = w.addText(pct(d && d.kcal, d && d.cil) + "%");
    t.font = Font.boldSystemFont(17); t.centerAlignText();
    const u = w.addText(z > 999 ? Math.round(z / 100) / 10 + "k" : cislo(z));
    u.font = Font.systemFont(9); u.centerAlignText(); u.textColor = BARVA.dim;
  }
  return w;
}

function obdelnik(d){
  const w = new ListWidget();
  const c = coTed(d);
  w.url = c.url;
  const h = w.addText(c.ic + " " + c.t);
  h.font = Font.boldSystemFont(13);
  h.lineLimit = 1;
  h.minimumScaleFactor = 0.8;
  const p = w.addText(c.p);
  p.font = Font.systemFont(11);
  p.textColor = BARVA.dim;
  p.lineLimit = 1;
  w.addSpacer(3);
  const s = w.addText("🔥 " + ((d && d.serie) || 0) + "   💧 " + ((d && d.voda) || 0) + "/" + ((d && d.vodaCil) || 0)
    + "   🍽 " + pct(d && d.kcal, d && d.cil) + "%");
  s.font = Font.systemFont(10);
  s.textColor = BARVA.dim;
  s.lineLimit = 1;
  return w;
}

function radekWidget(d){
  const w = new ListWidget();
  const c = coTed(d);
  w.url = c.url;
  w.addText(c.ic + " " + c.t);
  return w;
}

// ---------- plocha ----------
function maly(d){
  const w = new ListWidget();
  const c = coTed(d);
  w.url = c.url;
  pozadi(w);
  w.setPadding(12, 13, 11, 13);
  nadpis(w, c, stari(d));
  w.addSpacer();
  radek(w, "kalorie", d && d.kcal, d && d.cil, "", BARVA[ME] || BARVA.p, 132);
  radek(w, "bílkoviny", d && d.prot, d && d.cilP, " g", BARVA.ok, 132);

 { id:"sekana", tag:"trouba", name:"Sekaná s bramborovou kaší",

 { id:"plnenepapriky", tag:"trouba", name:"Plněné papriky v rajské omáčce",

 { id:"zebirka", tag:"trouba", name:"Vepřová žebírka s pečenými bramborami",

function suggest(needK, needP){
 // greedy: dokud chybí bílkoviny, ber nejlepší poměr B/kcal; pak dopl kalorie
 const pool = FILLERS.slice();
 const out = [];
 let k = needK, p = needP, guard = 0;
 while ((p > 8 || k > 180) && out.length < 4 && guard++ < 40){
  let best = null, bestScore = -1;
  pool.forEach((f, idx) => {
   if (f.k > k + 200) return;                       // nepřestřelit moc
   const score = p > 8 ? (f.p * 10 - Math.abs(f.k - k) * 0.02)
                       : (f.k <= k + 120 ? f.k : -1);
   if (score > bestScore){ bestScore = score; best = idx; }
  });
  if (best === null) break;
  const f = pool.splice(best, 1)[0];
  out.push(f); k -= f.k; p -= f.p;
 }
 return out;
}

function sugHtml(needK, needP){
 const s = suggest(needK, needP);
 if (!s.length) return '<div class="sugres dim">Na tohle už stačí jedna lžíce oleje navíc do jídla.</div>';
 const sk = s.reduce((a,x)=>a+x.k,0), sp = s.reduce((a,x)=>a+x.p,0);
 return '<div class="sugres"><b>Dej si:</b><ul>'
  + s.map(x=>'<li>'+esc(x.n)+' <span class="dim">'+x.k+' kcal · '+x.p+' g</span></li>').join("")
  + '</ul><div class="dim">Dohromady '+fmt(sk)+' kcal a '+sp+' g bílkovin — chybělo '+fmt(needK)+' kcal a '+needP+' g.</div></div>';
}

function parseIng(radek){
 const t = String(radek).trim().replace(/\s+/g," ");
 if (!t) return null;
 const m = t.match(/^(.+?)[\s—–-]+(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|ks|bal|balení|lžíce|hrst|plátky|stroužky)?\.?$/i);
 if (m) return [m[1].replace(/[\s—–-]+$/,"").trim(), parseFloat(m[2].replace(",",".")), (m[3]||"ks")];
 return [t, 0, ""];
}

function oddeleniPro(nazev){
 const t = String(nazev).toLowerCase();
 for (const o of ODDELENI) if (o[2].some(k => t.indexOf(k) >= 0)) return o[0];
 return "ostatni";
}
/* ---- normalizace jednotek a zaokrouhlení na balení ---- */
function normUnit(q, u){
 if (u === "kg") return [q*1000, "g"];
 if (u === "l")  return [q*1000, "ml"];
 return [q, u];
}
function baleni(q, u){
 if (u === "g"){  return q >= 1000 ? [Math.ceil(q/100)/10, "kg"] : [Math.ceil(q/50)*50, "g"]; }
 if (u === "ml"){ return q >= 1000 ? [Math.ceil(q/100)/10, "l"]  : [Math.ceil(q/100)*100, "ml"]; }
 if (u === "ks" || u === "bal") return [Math.ceil(q), u];
 return [Math.round(q*100)/100, u];
}
function mamDoma(nazev){
 return state.spizOdecist && (state.pantry || []).some(p => p.toLowerCase() === String(nazev).toLowerCase());
}

function dvoj(n){ return String(n).padStart(2,"0"); }
function icsStamp(d, hhmm){
 const p = hhmm.split(":");
 return d.getFullYear()+dvoj(d.getMonth()+1)+dvoj(d.getDate())+"T"+dvoj(+p[0])+dvoj(+p[1])+"00";
}
function plusMin(hhmm, min){
 const p = hhmm.split(":");
 const t = (+p[0])*60 + (+p[1]) + min;
 return dvoj(Math.floor(t/60) % 24)+":"+dvoj(t % 60);
}
function nextDow(dow){            // 1 = pondělí … 7 = neděle
 const d = new Date();
 const cur = d.getDay() === 0 ? 7 : d.getDay();
 d.setDate(d.getDate() + ((dow - cur + 7) % 7));
 return d;
}
function prvniPristiho(){
 const d = new Date();
 return new Date(d.getFullYear(), d.getMonth() + (d.getDate() > 1 ? 1 : 0), 1);
}
const DOW_ICS = ["","MO","TU","WE","TH","FR","SA","SU"];

            "METHOD:PUBLISH","X-WR-CALNAME:PEVE FIT — připomínky"];
 let n = 0;
 PRIPOMINKY.filter(p => sel[p.id]).forEach(p => {
  p.ev(who).forEach(e => {
   const zac = e.freq === "WEEKLY" ? nextDow(e.dow) : (e.freq === "MONTHLY" ? prvniPristiho() : new Date());
   const rrule = e.freq === "WEEKLY" ? "FREQ=WEEKLY;BYDAY="+DOW_ICS[e.dow]
               : (e.freq === "MONTHLY" ? "FREQ=MONTHLY;BYMONTHDAY="+e.den : "FREQ=DAILY");
   const alarm = e.alarm || 0;
   L.push("BEGIN:VEVENT",
     "UID:pf"+(n++)+"-"+p.id+"@pevefit",
     "DTSTART:"+icsStamp(zac, e.cas),
     "DTEND:"+icsStamp(zac, plusMin(e.cas, e.min || 10)),

 L.push("END:VCALENDAR");

/* ============ Trénink — deník ============ */
const INC_5KG = ["squat","deadlift","legpress","hacksquat","rdl","hipthrust"];
const incFor = id => INC_5KG.includes(id) ? 5 : 2.5;

function logAll(){ return store.get("tlog", {}); }
function logGet(who, ex){ return logAll()[who+"|"+ex] || []; }
function logSave(who, ex, arr){
  const all = logAll();
  if (arr.length) all[who+"|"+ex] = arr.slice(-40); else delete all[who+"|"+ex];
  store.set("tlog", all);
}
function logAdd(who, ex, kg, reps){
  const arr = logGet(who, ex).slice();
  const iso = new Date().toISOString().slice(0,10);
  let sess = arr.find(x => x.d === iso);
  if (!sess){ sess = { d: iso, s: [] }; arr.push(sess); }
  sess.s.push([kg, reps]);
  arr.sort((a,b)=>a.d.localeCompare(b.d));
  logSave(who, ex, arr);
}
function logDelSet(who, ex, i){
  const arr = logGet(who, ex).slice();
  const iso = new Date().toISOString().slice(0,10);
  const sess = arr.find(x => x.d === iso);
  if (!sess) return;
  sess.s.splice(i, 1);
  logSave(who, ex, sess.s.length ? arr : arr.filter(x => x.d !== iso));
}
function topSet(sets){
  return sets.reduce((a,b)=> (b[0] > a[0] || (b[0] === a[0] && b[1] > a[1])) ? b : a, sets[0]);
}
function repTarget(str){
  const t = String(str);
  if (/co dáš/i.test(t) || /\d\s*s\b/.test(t)) return null;
  const m = t.match(/(\d+)\s*×\s*(\d+)(?:\s*[–-]\s*(\d+))?/);
  if (!m) return null;
  return { sets:+m[1], lo:+m[2], hi:+(m[3] || m[2]) };
}
function czDate(iso){ const p = iso.split("-"); return (+p[2])+". "+(+p[1])+"."; }

function kgSpark(sessions){
  const pts = sessions.slice(-10).map(x => topSet(x.s)[0]).filter(v => v > 0);
  if (pts.length < 3) return "";
  const w = 300, h = 38, pad = 4;
  const mn = Math.min(...pts), mx = Math.max(...pts), sp = (mx - mn) || 1;
  const xy = pts.map((v,i)=>[ pad + i*(w-2*pad)/(pts.length-1), h-pad - (v-mn)/sp*(h-2*pad) ]);
  return '<svg class="kspark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Vývoj váhy u cviku">'
   +'<polyline points="'+xy.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" fill="none" '
   +'stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
   +'<circle cx="'+xy[xy.length-1][0].toFixed(1)+'" cy="'+xy[xy.length-1][1].toFixed(1)+'" r="4" '
   +'fill="var(--s1)" stroke="var(--surface-1)" stroke-width="2"/></svg>';
}

function logBox(who, exId, presc, pauza){
  const sessions = logGet(who, exId);
  const iso = new Date().toISOString().slice(0,10);
  const dnes = sessions.find(x => x.d === iso);
  const minule = sessions.filter(x => x.d !== iso).slice(-1)[0];
  const tg = repTarget(presc);

  let hist = '<div class="logline">Zatím sem nic nezapsáno — první série se stane měřítkem.</div>';
  if (minule){
    hist = '<div class="logline">Minule <b>'+czDate(minule.d)+'</b>: '
      + minule.s.map(x => (x[0] ? fmt(x[0])+' kg × ' : '') + x[1]).join(' · ') + '</div>';
  }
  let rada = "";
  if (tg && minule){
    const ok = minule.s.length >= tg.sets && minule.s.every(x => x[1] >= tg.hi);
    const kg = topSet(minule.s)[0];
    if (ok && kg) rada = '<div class="logline tip-up">✓ Minule jsi dal(a) všechny série na horní hranici — '
      +'dneska jdi na <b>'+fmt(Math.round((kg + incFor(exId))*10)/10)+' kg</b>.</div>';
    else if (kg) rada = '<div class="logline">Cíl: <b>'+tg.sets+' série po '+tg.hi+' opakováních</b> s '+fmt(kg)+' kg. '
      +'Až to dáš všude, přidáš '+fmt(incFor(exId))+' kg.</div>';
  }
  const chips = dnes && dnes.s.length
    ? '<div class="setchips">'+dnes.s.map((x,i)=>'<span class="setchip">'+(x[0]?fmt(x[0])+' kg × ':'')+x[1]
        +'<button data-delset="'+who+'|'+exId+'|'+i+'" title="Smazat">×</button></span>').join("")+'</div>'
    : "";
  const posl = minule ? topSet(minule.s) : null;
  return '<div class="logbox">' + hist + rada + kgSpark(sessions) + chips
   +'<div class="logrow">'
   +'<input type="number" step="0.5" min="0" max="500" inputmode="decimal" id="lg-'+who+'-'+exId+'-kg" '
   +'placeholder="kg"'+(posl && posl[0] ? ' value="'+posl[0]+'"' : '')+'>'
   +'<input type="number" step="1" min="1" max="100" inputmode="numeric" id="lg-'+who+'-'+exId+'-r" placeholder="opak.">'
   +'<button class="act small" data-addset="'+who+'|'+exId+'" type="button">Zapsat sérii</button>'
   +'<button class="ghost" data-timer="'+esc(pauza)+'" type="button">⏱ '+esc(pauza)+'</button>'
   +'</div></div>';
}

function rekordy(who){
  const all = logAll();
  const rows = Object.keys(all).filter(k => k.indexOf(who+"|") === 0).map(k => {
    const ex = k.split("|")[1];
    const sess = all[k];
    let best = null, bestD = null;
    sess.forEach(x => { const t = topSet(x.s); if (!best || t[0] > best[0]) { best = t; bestD = x.d; } });
    return { ex, best, d: bestD, n: sess.length };
  }).filter(r => r.best && r.best[0] > 0).sort((a,b)=>b.best[0]-a.best[0]);
  if (!rows.length) return "";
  return '<div class="card"><h3>🏆 Osobní rekordy</h3>'
   +'<p class="who">Nejtěžší série, kterou máš u cviku zapsanou. Tohle je ten opravdový důkaz, že to funguje.</p>'
   +'<table><thead><tr><th>Cvik</th><th class="num">Rekord</th><th class="num">Kdy</th></tr></thead><tbody>'
   + rows.slice(0,12).map(r=>'<tr><td>'+esc((EX[r.ex]||{n:r.ex}).n)+'</td>'
     +'<td class="num">'+fmt(r.best[0])+' kg × '+r.best[1]+'</td>'
     +'<td class="num dim">'+czDate(r.d)+'</td></tr>').join("")
   +'</tbody></table></div>';
}

const MIN_TR = { p: 4, v: 3 };
const ROZVRH = { p: [[1,"A"],[2,"N"],[4,"C"],[6,"G"]], v: [[1,"FB1"],[2,"FB2"],[4,"FB4"]] };
function minTr(who){ return nast("mintr_"+who, MIN_TR[who]); }
function rozvrh(who){ return nast("rozvrh_"+who, ROZVRH[who]) || []; }

function pondeli(posun){
 const d = new Date();
 const cur = d.getDay() === 0 ? 7 : d.getDay();
 d.setDate(d.getDate() - (cur - 1) + (posun||0)*7);
 d.setHours(12,0,0,0);
 return d;
}
function isoZ(d){ return d.getFullYear()+"-"+dvoj(d.getMonth()+1)+"-"+dvoj(d.getDate()); }
function planDne(iso){ return state.plan[iso] || {}; }
function planSet(iso, who, rid){
 const d = Object.assign({}, state.plan[iso] || {});
 if (rid) d[who] = rid; else delete d[who];
 if (Object.keys(d).length) state.plan[iso] = d; else delete state.plan[iso];
 store.set("plan", state.plan);
 if (window.sync && sync.on) sync.pushPlan();
}
function odtrenovano(iso, who){
 return (state.hist || []).some(h => h.d === iso && h.who === who);
}
function tydenPocty(posun){
 const zac = pondeli(posun), dnes = isoZ(new Date());
 let p = 0, v = 0;
 for (let i = 0; i < 7; i++){
  const d = new Date(zac); d.setDate(zac.getDate()+i);
  const x = planDne(isoZ(d));
  if (x.p) p++;
  if (x.v) v++;
 }
 // u probíhajícího týdne se cíl krátí podle toho, kolik tréninkových dnů ještě zbývá
 const cil = {};
 ["p","v"].forEach(who=>{
  if (posun > 0){ cil[who] = minTr(who); return; }
  let zbyva = 0;
  rozvrh(who).forEach(r=>{
   const d = new Date(zac); d.setDate(zac.getDate() + (r[0]-1));
   if (isoZ(d) >= dnes) zbyva++;
  });
  cil[who] = Math.min(minTr(who), Math.max(zbyva, (who==="p"?p:v)));
 });
 return { p:p, v:v, cp:cil.p, cv:cil.v };
}
/* okno se posouvá samo: každý týden odpadne ten starý a přibude nový prázdný */
function uklidPlan(){
 const hranice = new Date(); hranice.setDate(hranice.getDate() - 70);
 const h = isoZ(hranice);
 let smazano = 0;
 Object.keys(state.plan).forEach(k => { if (k < h){ delete state.plan[k]; smazano++; } });
 if (smazano) store.set("plan", state.plan);
}
function planChybi(){
 let celkem = 0, potreba = 0;
 for (let w = 0; w < 4; w++){ const t = tydenPocty(w); celkem += t.p + t.v; potreba += t.cp + t.cv; }
 return Math.max(0, potreba - celkem);
}
function planPripominka(){
 const chybi = planChybi();
 if (!chybi) return;
 // jednou týdně, klíč je pondělí aktuálního týdne
 pushMsg("plan-"+isoZ(pondeli(0)), "📅", "Plán tréninků dojíždí",
   "Ve čtyřtýdenním okně chybí "+chybi+" "+(chybi===1?"trénink":(chybi<5?"tréninky":"tréninků"))
   +". Otevři Trénink → Plán a dej „Doplnit podle rozvrhu\" — je to na jedno kliknutí.");
}

function doplnPlan(){
 for (let w = 0; w < 4; w++){
  const zac = pondeli(w);
  ["p","v"].forEach(who => {
   rozvrh(who).forEach(r => {
    const d = new Date(zac); d.setDate(zac.getDate() + (r[0]-1));
    const iso = isoZ(d);
    if (isoZ(d) < isoZ(new Date())) return;            // minulost neplánujeme
    const dnes = planDne(iso);
    if (dnes[who]) return;                              // co je zadané, neměníme
    planSet(iso, who, r[1]);
   });
  });
 }
}
function vycistitPlan(){
 const dnes = isoZ(new Date());
 Object.keys(state.plan).forEach(k => { if (k >= dnes) delete state.plan[k]; });
 store.set("plan", state.plan);
 if (window.sync && sync.on) sync.pushPlan();
}

 return false;
}

/* ============ Co je na řadě (hlavička) ============ */
function minutyZ(hhmm){ const p = String(hhmm).split(":"); return (+p[0])*60 + (+p[1]); }
function zaText(m){
 if (m <= 0) return "teď";
 if (m < 60) return "za "+m+" min";
 const h = Math.floor(m/60), z = m%60;
 return "za "+h+" h"+(z ? " "+z+"′" : "");
}
function nextUpList(){
 const me = store.get("meId", null);
 if (!me || !BASE_T[me])
  return [{ ic:"🔗", tx:"Řekni appce, kdo jsi, a propoj telefony", kdy:"nastavit", tab:"zpravy" }];

 const out = [];
 if (state.sess && state.sess.who === me){
  const t = sessSoucty();
  out.push({ ic:"▶︎", tx:"<b>Trénink běží</b> — "+t.hot+"/"+t.cel+" sérií", kdy:t.min+" min", tab:"trenink", cls:"bezi" });
 }

 const ted = new Date(), nyni = ted.getHours()*60 + ted.getMinutes();
 const dow = todayIdx + 1, iso = dateOfWeekday(todayIdx);
 const fronta = [];

 const dnesPlan = planDne(iso)[me];
 if (!out.length) (treninky(me) || []).forEach(t => {
  if (t[0] !== dow) return;
  if (dnesPlan && odtrenovano(iso, me)) return;
  const m = minutyZ(t[1]);
  if (m + 120 < nyni) return;
  const co = dnesPlan || (me === "p" ? QUEUE[state.queue] : V_QUEUE[state.fb % V_QUEUE.length]);
  fronta.push({ m:m, ic:"🏋️", tx:"<b>Trénink "+t[1]+"</b> — "+co, tab:"trenink" });
 });

 planFor(me, todayIdx).forEach(j => {
  if (state.checks[iso+"|"+me+"|"+j.slot]) return;
  const m = minutyZ(j.time);
  if (m + 150 < nyni) return;
  fronta.push({ m:m, ic:"🍽️", tx:"<b>"+j.time+"</b> · "+esc(j.name), tab:"dnes" });
 });

 fronta.sort((a,b)=>a.m-b.m).forEach(x=>{
  if (out.length < 3) out.push({ ic:x.ic, tx:x.tx, kdy:zaText(x.m - nyni), tab:x.tab });
 });

 // doplňky, když už toho dneska moc nezbývá
 const t = target(me), tot = dayTotals(me, iso);
 const zaloha = [];
 if (tot.k < t.kcal) zaloha.push({ ic:"🌙", tx:"Do cíle zbývá <b>"+fmt(t.kcal-tot.k)+" kcal</b>", kdy:fmt(tot.k)+" snědeno", tab:"dnes", cls:"male" });
 else if (tot.p < t.prot) zaloha.push({ ic:"🥚", tx:"Chybí <b>"+(t.prot-tot.p)+" g bílkovin</b>", kdy:"dojeď to", tab:"dnes", cls:"male" });
 else zaloha.push({ ic:"✅", tx:"<b>Dnešek splněný</b> — "+fmt(tot.k)+" kcal", kdy:"paráda", tab:"progres", cls:"hotovo male" });

 const sk = waterGet(me, iso), cilSk = Math.round(waterCil(me)/GLASS);
 zaloha.push(sk >= cilSk
  ? { ic:"💧", tx:"<b>Voda splněná</b> — "+(waterCil(me)/1000).toLocaleString("cs-CZ")+" l", kdy:"✓", tab:"dnes", cls:"male" }
  : { ic:"💧", tx:"Voda <b>"+(sk*GLASS/1000).toLocaleString("cs-CZ")+" / "+(waterCil(me)/1000).toLocaleString("cs-CZ")+" l</b>", kdy:"ještě "+(cilSk-sk)+"×", tab:"dnes", cls:"male" });

 const st = streak(me);
 if (st > 0) zaloha.push({ ic:"🔥", tx:"Série <b>"+st+" "+(st===1?"den":(st<5?"dny":"dní"))+" v řadě</b>", kdy:"neztrať ji", tab:"progres", cls:"male" });

 // příští trénink, když dnes žádný není
 if (!fronta.some(x=>x.ic==="🏋️") && !state.sess){
  const dnyCZ = ["","Po","Út","St","Čt","Pá","So","Ne"];
  let nej = null;
  (treninky(me) || []).forEach(x=>{
   const posun = ((x[0] - dow) + 7) % 7;
   const klic = posun === 0 ? 7 : posun;
   if (!nej || klic < nej.k) nej = { k:klic, d:x[0], cas:x[1] };
  });
  if (nej) zaloha.push({ ic:"🏋️", tx:"Další trénink <b>"+dnyCZ[nej.d]+" "+nej.cas+"</b>",
    kdy: nej.k === 1 ? "zítra" : "za "+nej.k+" dny", tab:"trenink", cls:"male" });
 }

 zaloha.forEach(z => { if (out.length < 3) out.push(z); });
 return out.slice(0,3);
}

function minulaLekce(who, exId){
 const iso = new Date().toISOString().slice(0,10);
 const ses = logGet(who, exId).filter(x => x.d !== iso);

}
function nejlepsiPred(who, exId){

 ses.forEach(x => x.s.forEach(p => { if (p[0] > best) best = p[0]; }));
 return best;
}

/* ---- sparing: trénink s parťákem ---- */
/* 7. pád (s kým) — Radek → s Radkem, Jana → s Janou. Není to dokonalá čeština,
   ale je to nekonečně lepší než „s Radek".                                    */
function sKym(n){
 const x = String(n || "").trim();
 if (!x) return x;
 const l = x.toLowerCase();
 if (/[aá]$/.test(l)) return x.slice(0,-1) + "ou";
 if (/[eě]$/.test(l)) return x;
 if (/[íyý]$/.test(l)) return x.slice(0,-1) + "ím";
 if (/o$/.test(l)) return x.slice(0,-1) + "em";
 if (/ěk$/.test(l)) return x.slice(0,-2).replace(/n$/i, m=>m==="N"?"Ň":"ň") + "kem";
 if (/ek$/.test(l)) return x.slice(0,-2) + "kem";
 if (/[eě]l$/.test(l)) return x.slice(0,-2) + "lem";
 if (/[eě]r$/.test(l) && x.length > 4) return x.slice(0,-2) + "rem";
 return x + "em";
}

function partiSeznam(){ return store.get("parti", []); }
function partiPridej(n){
 n = String(n || "").trim().replace(/\s+/g," ").slice(0,18);
 if (!n) return "";
 const a = partiSeznam().filter(x => x.toLowerCase() !== n.toLowerCase());
 a.unshift(n); store.set("parti", a.slice(0,10));
 return n;
}
function partiSmaz(n){
 store.set("parti", partiSeznam().filter(x => x !== n));
}
function budLogAll(){ return store.get("tlogB", {}); }
function budLog(bud, ex){ return budLogAll()[bud+"|"+ex] || []; }
function budLogAdd(bud, ex, kg, reps){
 const all = budLogAll(), k = bud+"|"+ex;
 const arr = (all[k] || []).slice();
 const iso = new Date().toISOString().slice(0,10);
 let ses = arr.find(x => x.d === iso);
 if (!ses){ ses = { d: iso, s: [] }; arr.push(ses); }
 ses.s.push([kg, reps]);
 arr.sort((a,b)=>a.d.localeCompare(b.d));
 all[k] = arr.slice(-30); store.set("tlogB", all);
}
function budMinula(bud, exId){
 const iso = new Date().toISOString().slice(0,10);
 const ses = budLog(bud, exId).filter(x => x.d !== iso);
 return ses.length ? ses[ses.length-1] : null;
}
function budNejlepsi(bud, exId){
 let best = 0;
 budLog(bud, exId).forEach(x => x.s.forEach(pp => { if (pp[0] > best) best = pp[0]; }));
 return best;
}
function sparHist(){ return store.get("spar", []); }
function sparUloz(z){
 const a = sparHist().concat([z]).slice(-60);
 store.set("spar", a); state.spar = a;
}

function startSession(who, rid, bud){

  who: who, rid: rid, start: new Date().toISOString(),
  bud: bud || null, akt: "ty",
  ex: r.ex.map((e,i) => {
   const exId = state.exsel[rid+"|"+i] || e[0];
   const min = minulaLekce(who, exId);
   const bmin = bud ? budMinula(bud, exId) : null;
   const n = plannedSets(e[1]);
   const mk = (m) => Array.from({length:n}, (_,j) => ({
     kg: m && m.s[j] ? m.s[j][0] : (m && m.s.length ? m.s[m.s.length-1][0] : ""),
     reps: "", done: false
   }));
   return {
    id: exId, popis: e[1], pauza: e[3], klic: rid+"|"+i,
    sets: mk(min), bsets: bud ? mk(bmin) : []
   };
  })
 };

}

function sessPauza(){
 const s0 = state.sess;
 if (!s0) return "2:00";
 for (let i = s0.ex.length-1; i >= 0; i--)
   if (s0.ex[i].sets.some(p=>p.done) || (s0.ex[i].bsets||[]).some(p=>p.done)) return s0.ex[i].pauza;
 return s0.ex[0].pauza;
}
function sessSoucty(kdo){
 const s0 = state.sess;
 let hot = 0, cel = 0, obj = 0, rep = 0;
 s0.ex.forEach(x => ((kdo === "bud") ? (x.bsets||[]) : x.sets).forEach(p => {
   cel++; if (p.done){ hot++; rep += (+p.reps || 0); obj += (+p.kg || 0) * (+p.reps || 0); } }));
 const min = Math.max(1, Math.round((Date.now() - new Date(s0.start).getTime())/60000));
 return { hot, cel, obj: Math.round(obj), rep, min };
}

function finishSession(){

 let osobaky = [];
 s0.ex.forEach(x => {
  const pred = nejlepsiPred(who, x.id);
  let nej = 0;
  x.sets.filter(p => p.done).forEach(p => {
   logAdd(who, x.id, (+p.kg || 0), (+p.reps || 0));
   if ((+p.kg || 0) > nej) nej = (+p.kg || 0);
  });
  if (nej > 0 && nej > pred && pred > 0) osobaky.push((EX[x.id]||{n:x.id}).n+" "+fmt(nej)+" kg");
  if (duo) (x.bsets||[]).filter(p => p.done).forEach(p =>
    budLogAdd(s0.bud, x.id, (+p.kg || 0), (+p.reps || 0)));
 });
 // fronta
 let hotovo = s0.rid;
 if (who === "p" && QUEUE.indexOf(s0.rid) >= 0){
  state.queue = (QUEUE.indexOf(s0.rid) + 1) % QUEUE.length; store.set("queue", state.queue);
 } else if (who === "v" && V_QUEUE.indexOf(s0.rid) >= 0){

 }
 // historie
 state.hist = (state.hist || []).concat([{ d: new Date().toISOString().slice(0,10), who: who,
   rid: hotovo, min: t.min, sets: t.hot, obj: t.obj, bud: duo ? s0.bud : null }]).slice(-40);
 store.set("hist", state.hist);

 if (duo){
  const iso = new Date().toISOString().slice(0,10);

  const hlas = vysl === "V"

    : vysl === "P"
    ? [s0.bud+" tě přejel o "+fmt(tBud.obj - t.obj)+" kg objemu. Appka to zaznamenala. Appka nezapomíná. 📓",
       "Objem "+fmt(t.obj)+" : "+fmt(tBud.obj)+" kg. Prohra s parťákem je jenom pozvánka na odvetu — a ta je hned příště."]
    : ["Přesná remíza, "+fmt(t.obj)+" kg oba. Buď jste sehraní, nebo jste se navzájem šetřili. 🤝"];
  pushMsg("spar-"+iso+"-"+s0.bud+"-"+hotovo,
    vysl === "V" ? "🏆" : (vysl === "P" ? "😤" : "🤝"),
    "Sparing s "+sKym(s0.bud)+" — "+(vysl==="V"?"vyhráls":(vysl==="P"?"prohráls":"remíza")),
    hlas[(t.hot + tBud.hot) % hlas.length]);
 }

 pushMsg("tr-"+who+"-"+new Date().toISOString().slice(0,10)+"-"+hotovo, "🏋️",
   BASE_T[who].name+" "+rod(who,"odtrénoval","odtrénovala")+" "+hotovo,
   t.hot+" sérií za "+t.min+" minut"+(t.obj?", objem "+fmt(t.obj)+" kg":"")
   +(osobaky.length ? ". 🏆 Nový osobák: "+osobaky.join(", ")+"!" : "."));
 osobaky.forEach((o,i)=> pushMsg("pr-"+who+"-"+new Date().toISOString().slice(0,10)+"-"+i, "🏆",
   "Osobní rekord — "+BASE_T[who].name, o+". Tohle je ten důkaz, že to funguje."));

 state.sess = null; store.set("session", null);
 const el = document.getElementById("sessOverlay");
 el.hidden = true; el.innerHTML = "";
 document.body.style.overflow = "";
 if (sessTick){ clearInterval(sessTick); sessTick = null; }
 if (state.timer){ state.timer = null; if (timerId){ clearInterval(timerId); timerId = null; }
   const b = document.getElementById("timerBar"); if (b) b.hidden = true; }
 kontrolaOdznaku(); celebrate(osobaky.length ? "🏆" : (duo ? "🤜" : "💪"));

 if (window.sync && sync.on) sync.pushStatus();

function startTimer(sec, label){

function tickTimer(){
  const bar = document.getElementById("timerBar");
  if (!bar) return;
  if (!state.timer){ bar.hidden = true; return; }
  const left = Math.max(0, Math.round((state.timer.end - Date.now())/1000));
  bar.hidden = false;
  bar.innerHTML = '<span class="tlab">'+(left ? "Pauza" : "Jdeme!")+'</span>'
   +(left ? '<button class="adj" data-tadj="-15" type="button">−15</button>' : '')
   +'<span class="tnum">'+Math.floor(left/60)+":"+String(left%60).padStart(2,"0")+'</span>'
   +(left ? '<button class="adj" data-tadj="15" type="button">+15</button>' : '')
   +'<button class="ghost" id="timerStop" type="button">'+(left ? "Přeskočit" : "OK")+'</button>';
  if (left <= 0){
    if (timerId){ clearInterval(timerId); timerId = null;
      if (navigator.vibrate) { try { navigator.vibrate([200,120,200]); } catch(e){} } }
    bar.classList.add("done");

}

/* ---- bilance sparingu ---- */
function sparBilance(){
 const m = {};
 sparHist().forEach(x=>{
  const k = x.bud;
  if (!m[k]) m[k] = { bud:k, v:0, p:0, r:0, oTy:0, oBud:0, min:0, posl:x.d };
  if (x.v === "V") m[k].v++; else if (x.v === "P") m[k].p++; else m[k].r++;
  m[k].oTy += x.oTy || 0; m[k].oBud += x.oBud || 0; m[k].min += x.min || 0;
  if (x.d > m[k].posl) m[k].posl = x.d;
 });
 return Object.keys(m).map(k=>m[k]).sort((a,b)=>(b.v+b.p+b.r)-(a.v+a.p+a.r));
}
function sparHlaskaBilance(b){
 const c = b.v + b.p + b.r;
 if (c < 3) return "Zatím málo dat. Tři tréninky a začne to bolet toho horšího.";
 if (b.v > b.p * 2) return "Tohle už není rivalita, tohle je doučování. 😎";
 if (b.v > b.p) return "Vedeš. Drž si to, protože statistika je veřejná.";
 if (b.p > b.v * 2) return "Tady se něco pokazilo. Konkrétně ty. 🫣";
 if (b.p > b.v) return "Prohráváš. Zatím. Odveta je vždycky o jeden trénink dál.";
 return "Naprosto vyrovnané. Tohle je ta nejlepší možná varianta — nikdo nemůže přestat.";
}

/* ============ Progres ============ */
function spark(entries, color){
 if (entries.length < 2) return '<div class="dim" style="font-size:12.5px;margin:6px 0">Zapiš aspoň dvě hodnoty a ukáže se graf.</div>';
 const w=560,h=100,pad=8;
 const kgs = entries.map(e=>e.kg);
 const mn = Math.min(...kgs), mx = Math.max(...kgs);
 const span = (mx-mn)||1;
 const pts = entries.map((e,i)=>{
  const x = pad + i*(w-2*pad)/(entries.length-1);
  const y = h-pad - (e.kg-mn)/span*(h-2*pad);
  return [x,y];
 });
 const line = pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Vývoj váhy">'
  +'<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
  +pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+color+'" stroke="var(--surface-1)" stroke-width="2"/>').join("")
  +'</svg>';
}
function movAvg(sorted, dny){
 return sorted.map((e,i)=>{
  const od = new Date(e.d).getTime() - dny*86400000;
  const okno = sorted.filter((x,j)=> j <= i && new Date(x.d).getTime() >= od);
  return { d: e.d, kg: okno.reduce((a,x)=>a+x.kg,0)/okno.length };
 });
}
function wtChart(sorted, color){
 if (sorted.length < 2) return '<div class="dim" style="font-size:12.5px;margin:6px 0">'
   +'Zapiš aspoň dvě vážení a objeví se graf s trendem.</div>';
 const w = 560, h = 150, l = 40, r = 10, tp = 12, bt = 22;
 const kgs = sorted.map(e=>e.kg);
 let mn = Math.min(...kgs), mx = Math.max(...kgs);
 const pad = Math.max(0.5, (mx-mn)*0.18); mn -= pad; mx += pad;
 const t0 = new Date(sorted[0].d).getTime(), t1 = new Date(sorted[sorted.length-1].d).getTime();
 const span = (t1-t0) || 1;
 const X = d => l + (new Date(d).getTime()-t0)/span*(w-l-r);
 const Y = v => tp + (mx-v)/(mx-mn)*(h-tp-bt);
 const avg = movAvg(sorted, 14);
 const ticks = [mx, (mx+mn)/2, mn].map(v=>
   '<line class="gl" x1="'+l+'" y1="'+Y(v).toFixed(1)+'" x2="'+(w-r)+'" y2="'+Y(v).toFixed(1)+'"/>'
   +'<text x="'+(l-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end">'+(Math.round(v*10)/10).toLocaleString("cs-CZ")+'</text>').join("");
 const body = sorted.map(e=>'<circle cx="'+X(e.d).toFixed(1)+'" cy="'+Y(e.kg).toFixed(1)+'" r="3.5" fill="'+color
   +'" stroke="var(--surface-1)" stroke-width="2"/>').join("");
 const line = '<polyline points="'+avg.map(e=>X(e.d).toFixed(1)+","+Y(e.kg).toFixed(1)).join(" ")+'" fill="none" stroke="'
   +color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
 const dt = iso => { const p = iso.split("-"); return (+p[2])+". "+(+p[1])+"."; };
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Vývoj váhy">'
  + ticks + line + body
  +'<line class="ax" x1="'+l+'" y1="'+(h-bt)+'" x2="'+(w-r)+'" y2="'+(h-bt)+'"/>'
  +'<text x="'+l+'" y="'+(h-6)+'">'+dt(sorted[0].d)+'</text>'
  +'<text x="'+(w-r)+'" y="'+(h-6)+'" text-anchor="end">'+dt(sorted[sorted.length-1].d)+'</text>'
  +'</svg>'
  +'<div class="legend"><span><i class="dot" style="background:'+color+'"></i>jednotlivá vážení</span>'
  +'<span><i style="background:'+color+'"></i>trend (klouzavý průměr 14 dní)</span></div>';
}

/* ---- plnění cílů po týdnech ---- */
function tydnyChart(who){
 const t = target(who);
 const tydny = [];
 for (let w0 = 7; w0 >= 0; w0--){
  let sum = 0, dnu = 0;
  for (let i = 0; i < 7; i++){
   const iso = isoDaysAgo(w0*7 + i);
   const tot = dayTotals(who, iso);
   if (tot.k > 0){ sum += tot.k; dnu++; }
  }
  tydny.push({ lab: w0 === 0 ? "teď" : "-"+w0+"t", prum: dnu ? Math.round(sum/7) : 0, dnu: dnu });
 }
 if (!tydny.some(x=>x.prum > 0)) return "";
 const w = 560, h = 150, l = 44, r = 10, tp = 14, bt = 24;
 const mx = Math.max(t.kcal, ...tydny.map(x=>x.prum)) * 1.1;
 const bw = Math.min(24, (w-l-r)/tydny.length - 6);
 const Y = v => tp + (1 - v/mx)*(h-tp-bt);
 const bars = tydny.map((x,i)=>{
  const cx = l + (i+0.5)*(w-l-r)/tydny.length;
  const y = Y(x.prum), hh = Math.max(0, (h-bt) - y);
  const barva = x.prum >= t.kcal*0.95 ? "var(--s3)" : (x.prum >= t.kcal*0.75 ? "var(--s1)" : "var(--s2)");
  return (hh > 0 ? '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)
    +'" rx="4" fill="'+barva+'"/>' : '')
   +'<text x="'+cx.toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+x.lab+'</text>'
   +(i === tydny.length-1 && x.prum ? '<text x="'+cx.toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" '
     +'style="font-weight:700;fill:var(--text-primary)">'+fmt(x.prum)+'</text>' : '');
 }).join("");
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Průměrné kalorie po týdnech">'
  +'<line class="gl" x1="'+l+'" y1="'+Y(t.kcal).toFixed(1)+'" x2="'+(w-r)+'" y2="'+Y(t.kcal).toFixed(1)+'" stroke-dasharray="0"/>'
  +'<text x="'+(l-6)+'" y="'+(Y(t.kcal)+3.5).toFixed(1)+'" text-anchor="end">cíl</text>'
  + bars
  +'<line class="ax" x1="'+l+'" y1="'+(h-bt)+'" x2="'+(w-r)+'" y2="'+(h-bt)+'"/></svg>'
  +'<div class="hint" style="margin-top:2px">Průměr <b>odškrtnutých</b> kalorií na den. Šedá čára je cíl.</div>';
}

/* ---- odznaky ---- */
function wtArr(w){ return w === "p" ? state.wtP : state.wtV; }
function mrArr(w){ return w === "p" ? state.mrP : state.mrV; }
function trDny(w){
 const all = logAll(), dny = {};
 Object.keys(all).filter(k => k.indexOf(w+"|") === 0).forEach(k => all[k].forEach(x => dny[x.d] = 1));
 return Object.keys(dny).length;
}
function trCviku(w){ return Object.keys(logAll()).filter(k => k.indexOf(w+"|") === 0).length; }
function pokroky(w){
 const all = logAll();
 return Object.keys(all).filter(k => k.indexOf(w+"|") === 0).filter(k => {
  const x = all[k]; if (x.length < 2) return false;
  return topSet(x[x.length-1].s)[0] > topSet(x[0].s)[0];
 }).length;
}
function maPokrok(w){ return pokroky(w) > 0; }
function vodaDny(w){
 const cil = Math.round(waterCil(w)/GLASS);
 return Object.keys(state.water).filter(k => k.slice(-2) === "|"+w && state.water[k] >= cil).length;
}
function suplDny(w){
 return Object.keys(state.checks).filter(k => state.checks[k] && k.indexOf("|"+w+"|sup-cr") > 0).length;
}
function histW(w){ return (state.hist || []).filter(x => x.who === w); }
function objemCelkem(w){ return histW(w).reduce((a,x)=>a+(x.obj||0), 0); }
function nejdelsi(w){ return histW(w).reduce((a,x)=>Math.max(a, x.min||0), 0); }
function dnyVenku(){
 return Object.keys(state.jidlo).filter(k => { const d = state.jidlo[k].d; const r = d && dinnerById(d); return r && r.out; }).length;
}
function pocetVeceri(id){
 return Object.keys(state.jidlo).filter(k => state.jidlo[k].d === id).length;
}
function topVeceri(n){
 const c = {};
 Object.keys(state.jidlo).forEach(k => { const d = state.jidlo[k].d; if (d) c[d] = (c[d]||0)+1; });
 return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,n).map(id=>({ id:id, n:c[id], name:dinnerById(id).name }));
}
function nohyDni(w){
 const NOHOU = w === "p" ? ["N","B","D"] : ["GL","FB1","FB2","FB4"];
 return histW(w).filter(x => NOHOU.indexOf(x.rid) >= 0).length;
}
function nedelniVazeni(w){
 return wtArr(w).filter(x => new Date(x.d+"T12:00:00").getDay() === 0).length;
}
function vejcoRecepty(){
 return store.get("favs", []).filter(id => {
  const r = dinnerById(id);
  return r && (/vejc|omelet|frittat|šakšuk|menemen/i.test(r.name) || r.ing.some(i=>/vejce/i.test(i[0])));
 }).length;
}

function odzStav(o, w){
 try { const r = o.p(w); return [r[0]||0, r[1]||1]; } catch(e){ return [0,1]; }
}
function ziskane(w){ return ODZNAKY.filter(o => { const r = odzStav(o,w); return r[0] >= r[1]; }).map(o => o.id); }
function nejblizsi(w){
 let best = null;
 ODZNAKY.forEach(o => {
  const r = odzStav(o,w);
  if (r[0] >= r[1]) return;
  const pom = r[0] / r[1];
  if (!best || pom > best.pom) best = { o:o, cur:r[0], cil:r[1], pom:pom };
 });
 return best;
}

function kontrolaOdznaku(){
 const drive = store.get("odznaky", []);
 const ted = [];
 ["p","v"].forEach(w => ziskane(w).forEach(id => ted.push(w+"|"+id)));
 ted.filter(k => drive.indexOf(k) < 0).forEach(k => {
  const p = k.split("|"), o = ODZNAKY.find(x => x.id === p[1]);
  if (o) pushMsg("odz-"+k, o.ic, "Nový odznak: "+o.n,
    BASE_T[p[0]].name+" si právě "+rod(p[0],"odemkl","odemkla")+" odznak „"+o.n+"\". "
    + (ziskane(p[0]).length >= ODZNAKY.length ? "A to byl poslední — všechny!" : "Zbývá jich ještě "+(ODZNAKY.length - ziskane(p[0]).length)+"."));
 });
 store.set("odznaky", ted);
}

/* ---- grafy a statistiky ---- */
function sloupceSvg(data, o){
 o = o || {};
 if (!data.length || !data.some(d=>d.v > 0))
  return '<div class="dim" style="font-size:12.5px;margin:8px 0">'+(o.prazdno || "Zatím není z čeho kreslit.")+'</div>';
 const w = 560, h = o.h || 132, l = o.l || 42, r = 8, tp = 16, bt = 22;
 const mx = Math.max(o.cil || 0, ...data.map(d=>d.v)) * 1.15 || 1;
 const bw = Math.min(24, (w-l-r)/data.length - 7);
 const Y = v => tp + (1 - v/mx)*(h-tp-bt);
 const cil = o.cil ? '<line class="gl" x1="'+l+'" y1="'+Y(o.cil).toFixed(1)+'" x2="'+(w-r)+'" y2="'+Y(o.cil).toFixed(1)+'"/>'
   +'<text x="'+(l-6)+'" y="'+(Y(o.cil)+3.5).toFixed(1)+'" text-anchor="end">'+esc(o.cilLab || "cíl")+'</text>' : '';
 const bars = data.map((d,i)=>{
  const cx = l + (i+0.5)*(w-l-r)/data.length;
  const y = Y(d.v), hh = Math.max(0, (h-bt)-y);
  const col = d.c || o.c || "var(--s1)";
  return (d.v > 0 ? '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)
      +'" height="'+hh.toFixed(1)+'" rx="4" fill="'+col+'"/>' : '')
   +'<text x="'+cx.toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(d.lab)+'</text>'
   +(i === data.length-1 && d.v ? '<text x="'+cx.toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" '
     +'style="font-weight:700;fill:var(--text-primary)">'+esc(d.top || fmt(d.v))+'</text>' : '');
 }).join("");
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.alt||"graf")+'">'
  + cil + bars + '<line class="ax" x1="'+l+'" y1="'+(h-bt)+'" x2="'+(w-r)+'" y2="'+(h-bt)+'"/></svg>';
}

function dvojSloupceSvg(data, o){
 o = o || {};
 if (!data.length || !data.some(d=>d.a > 0 || d.b > 0))
  return '<div class="dim" style="font-size:12.5px;margin:8px 0">'+(o.prazdno || "Zatím není z čeho kreslit.")+'</div>';
 const w = 560, h = 132, l = 42, r = 8, tp = 16, bt = 22;
 const mx = Math.max(o.cil || 0, ...data.map(d=>Math.max(d.a,d.b))) * 1.2 || 1;
 const slot = (w-l-r)/data.length;
 const bw = Math.min(18, slot/2 - 6);
 const Y = v => tp + (1 - v/mx)*(h-tp-bt);
 const cil = o.cil ? '<line class="gl" x1="'+l+'" y1="'+Y(o.cil).toFixed(1)+'" x2="'+(w-r)+'" y2="'+Y(o.cil).toFixed(1)+'"/>'
   +'<text x="'+(l-6)+'" y="'+(Y(o.cil)+3.5).toFixed(1)+'" text-anchor="end">min</text>' : '';
 const bars = data.map((d,i)=>{
  const cx = l + (i+0.5)*slot;
  const xa = cx - bw - 1, xb = cx + 1;
  const ya = Y(d.a), yb = Y(d.b);
  return (d.a ? '<rect x="'+xa.toFixed(1)+'" y="'+ya.toFixed(1)+'" width="'+bw.toFixed(1)
      +'" height="'+Math.max(0,(h-bt)-ya).toFixed(1)+'" rx="4" fill="var(--s1-track)"/>' : '')
   + (d.b ? '<rect x="'+xb.toFixed(1)+'" y="'+yb.toFixed(1)+'" width="'+bw.toFixed(1)
      +'" height="'+Math.max(0,(h-bt)-yb).toFixed(1)+'" rx="4" fill="var(--s3)"/>' : '')
   +'<text x="'+cx.toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(d.lab)+'</text>'
   +(i === data.length-1 ? '<text x="'+xb.toFixed(1)+'" y="'+(Math.min(ya,yb)-5).toFixed(1)+'" text-anchor="middle" '
      +'style="font-weight:700;fill:var(--text-primary)">'+d.a+'/'+d.b+'</text>' : '');
 }).join("");
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Plán a skutečnost">'
  + cil + bars + '<line class="ax" x1="'+l+'" y1="'+(h-bt)+'" x2="'+(w-r)+'" y2="'+(h-bt)+'"/></svg>'
  +'<div class="stack-leg" style="margin-top:-6px"><span><s style="background:var(--s1-track)"></s>naplánováno</span>'
  +'<span><s style="background:var(--s3)"></s>odtrénováno</span></div>';
}

function tydenIndex(iso){                    // 0 = tenhle týden, 1 = minulý …
 return Math.floor(daysBetween(iso, isoZ(pondeli(0))) / 7) + (iso < isoZ(pondeli(0)) ? 0 : 0);
}
function objemPoTydnech(w){
 const out = [];
 for (let k = 7; k >= 0; k--){
  const zac = isoZ(pondeli(-k)), kon = isoZ(new Date(new Date(pondeli(-k)).setDate(pondeli(-k).getDate()+6)));
  const v = histW(w).filter(x => x.d >= zac && x.d <= kon).reduce((a,x)=>a+(x.obj||0),0);
  out.push({ lab: k === 0 ? "teď" : "-"+k, v: Math.round(v/1000), top: Math.round(v/1000)+" t" });
 }
 return out;
}
function planVsRealita(w){
 const out = [];
 for (let k = 3; k >= 0; k--){
  const zacD = pondeli(-k), zac = isoZ(zacD);
  const konD = new Date(zacD); konD.setDate(zacD.getDate()+6);
  const kon = isoZ(konD);
  let nap = 0;
  for (let i = 0; i < 7; i++){ const d = new Date(zacD); d.setDate(zacD.getDate()+i);
   if (planDne(isoZ(d))[w]) nap++; }
  const hot = histW(w).filter(x => x.d >= zac && x.d <= kon).length;
  out.push({ lab: k === 0 ? "teď" : "-"+k+"t", nap: nap, hot: hot });
 }
 return out;
}
function vodaPoDnech(w){
 const cil = Math.round(waterCil(w)/GLASS);
 const out = [];
 for (let i = 13; i >= 0; i--){
  const iso = isoPlus(-i);
  const n = state.water[iso+"|"+w] || 0;
  out.push({ lab: i % 2 === 0 ? DAYS[wdOf(iso)] : "", v: n, c: n >= cil ? "var(--s3)" : "var(--s1)" });
 }
 return { data: out, cil: cil };
}
function suplPoslednich(w, dnu){
 let n = 0;
 for (let i = 0; i < dnu; i++) if (state.checks[isoPlus(-i)+"|"+w+"|sup-cr"]) n++;
 return n;
}
function kdoVarilStat(){
 const c = { p:0, v:0, s:0, o:0 };
 for (let i = 0; i < 30; i++){
  const j = state.jidlo[isoPlus(-i)];
  if (j && j.k) c[j.k] = (c[j.k]||0) + 1;
 }
 return c;
}

function report(w){
 const t = target(w);
 let dnu = 0, sumK = 0, sumP = 0;
 for (let i = 1; i <= 7; i++){
  const tot = dayTotals(w, isoDaysAgo(i));
  if (tot.k > 0){ dnu++; sumK += tot.k; sumP += tot.p; }
 }
 const prumK = dnu ? Math.round(sumK/dnu) : 0, prumP = dnu ? Math.round(sumP/dnu) : 0;
 const nad = (()=>{ let n = 0; for (let i = 1; i <= 7; i++) if (dayTotals(w, isoDaysAgo(i)).k >= MIN_KCAL[w]) n++; return n; })();
 const arr = wtArr(w).slice().sort((a,b)=>a.d.localeCompare(b.d));
 const posl = arr[arr.length-1];
 const tydenZpet = arr.filter(x => daysBetween(x.d, new Date().toISOString().slice(0,10)) >= 7).pop();
 const zmena = posl && tydenZpet ? Math.round((posl.kg - tydenZpet.kg)*10)/10 : null;
 const all = logAll();
 let trenink = 0; const dny = {};
 Object.keys(all).filter(k => k.indexOf(w+"|") === 0).forEach(k => all[k].forEach(x => {
   if (daysBetween(x.d, new Date().toISOString().slice(0,10)) <= 7) dny[x.d] = 1; }));
 trenink = Object.keys(dny).length;

 let rada;

 else if (prumP < t.prot*0.8) rada = "Kalorie držíš, ale <b>bílkoviny zaostávají</b>. Přidej si k obědu vejce nebo skyr — to je celý fix.";
 else if (trenink < 2) rada = "Jídlo sedí, <b>chybí tréninky</b>. Zkus v appce filtr na 30 minut — něco se vždycky vejde.";
 else if (nad >= 6 && trenink >= 3) rada = "<b>Tenhle týden byl bez chyby.</b> Nic neměň, jen to zopakuj.";
 else rada = "Slušný týden. Příště se soustřeď na ten <b>jeden slabý den</b> — obvykle je to ten, kdy se vyjíždí brzo.";

 return '<div class="card"><div class="rhead"><h3>📋 '+BASE_T[w].name+' — týden v kostce</h3>'

function weeklyRate(arr){
 const s = arr.slice().sort((a,b)=>a.d.localeCompare(b.d));
 if (s.length < 2) return null;
 const last = s[s.length-1];
 // nejstarší záznam v okně posledních 28 dní; potřebujeme rozestup aspoň 10 dní
 let base = null;
 for (const e of s){ if (daysBetween(e.d, last.d) <= 28) { base = base || e; } }
 base = base || s[0];
 const span = daysBetween(base.d, last.d);
 if (span < 10) return null;
 return { rate: (last.kg - base.kg) / span * 7, span: span };
}
function reco(who){
 const arr = who==="p" ? state.wtP : state.wtV;
 const t = target(who);
 const r = weeklyRate(arr);
 if (!r) return { txt:"Zapisuj váhu každou neděli — doporučení se objeví, jakmile budou záznamy aspoň 10 dní od sebe.", act:null };
 const rt = Math.round(r.rate*100)/100;
 const rtx = (rt>0?"+":"")+rt.toLocaleString("cs-CZ")+" kg/týden za posledních "+r.span+" dní";
 if (who==="p"){
  if (rt < 0.15) return { txt:"Tempo "+rtx+" — pomalejší než cíl (+0,25 až 0,4). <b>Nejíš dost.</b> Doporučení: přidat 250 kcal denně (med do shaku + větší večeře).", act: Math.round((t.kcal+250)/50)*50 };
  if (rt > 0.6) return { txt:"Tempo "+rtx+" — rychlejší než cíl, přibývalo by zbytečně moc tuku. Doporučení: ubrat 200 kcal denně.", act: Math.round((t.kcal-200)/50)*50 };
  return { txt:"Tempo "+rtx+" — <b>přesně v cíli.</b> Nic neměň, jede to.", act:null };
 }
 if (rt <= -0.45) return { txt:"Tempo "+rtx+" — váha padá moc rychle, brala by s sebou sval. Doporučení: přidat 200 kcal denně.", act: Math.round((t.kcal+200)/50)*50 };
 if (rt >= 0.45) return { txt:"Tempo "+rtx+" — váha roste rychleji, než by u rekompozice měla. Doporučení: ubrat 150 kcal denně (nejdřív ale zkontroluj, jestli to není jen fáze cyklu).", act: Math.round((t.kcal-150)/50)*50 };
 return { txt:"Tempo "+rtx+" — <b>váha drží, přesně tak to má být.</b> Postava se mění v posilovně, ne na váze.", act:null };
}

/* ================= SYNC (Firebase Realtime Database) ================= */
/* Sdílené: zprávy, oblíbené, týden, nákup, živý přehled druhého.
   Soukromé (zůstává v telefonu): denní odškrtávání, váhy, míry.       */

const FB = window.PEVE_FIREBASE || null;   // config se doplní v firebase-config.js

const sync = {
  on: false, db: null, uid: null, fam: null, me: null,
  status: "off",            // off | connecting | live | error
  peer: null,               // živý přehled druhého
  _mine: {},                // co jsem naposled odeslal (proti smyčkám)

  get famId(){ return store.get("famId", null); },
  get meId(){ return store.get("meId", null); },

  async start(){
    if (!FB || !this.famId || !this.meId) { this.status = "off"; return; }
    this.fam = this.famId; this.me = this.meId;
    this.status = "connecting"; renderNastaveni && renderNastaveni();
    try {
      const [{ initializeApp }, dbmod, authmod] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js")
      ]);
      const app = initializeApp(FB);
      const auth = authmod.getAuth(app);
      await authmod.signInAnonymously(auth);
      this.uid = auth.currentUser.uid;
      this.db = dbmod.getDatabase(app);
      this._m = dbmod;
      this.on = true; this.status = "live";
      this._listen();
      this.pushStatus();
      this.pushWidget();
      syncDot();
    } catch(e){
      this.status = "error"; this.err = String(e && e.message || e);
    }
    renderNastaveni && renderNastaveni();
  },

  _ref(path){ return this._m.ref(this.db, "rodiny/"+this.fam+"/"+path); },

  _listen(){
    const { onValue } = this._m;
    // zprávy
    onValue(this._ref("feed"), snap => {
      const remote = snap.val() || {};
      const local = store.get("msgs", []);
      const byId = {};
      local.forEach(m => byId[m.id] = m);
      Object.values(remote).forEach(m => {
        if (!byId[m.id]) byId[m.id] = Object.assign({}, m, { r:false });
        else byId[m.id] = Object.assign({}, m, { r: byId[m.id].r });
      });
      const merged = Object.values(byId).sort((a,b)=> String(b.t).localeCompare(String(a.t))).slice(0,60);
      store.set("msgs", merged);
      syncDot();
      if (state.notif) renderZpravy();
    });
    // oblíbené
    onValue(this._ref("favs"), snap => {
      const v = snap.val();
      if (Array.isArray(v)) { store.set("favs", v); if (state.tab === "recepty") renderRecepty(); }
    });
    // týden
    onValue(this._ref("week"), snap => {
      const v = snap.val();
      if (Array.isArray(v) && v.length === 7) {
        state.week = v; store.set("week", v);
        if (state.tab === "tyden") renderTyden();
        if (state.tab === "dnes") renderDnes();
        if (state.tab === "nakup") renderNakup();
      }
    });
    // návrhy ke schválení
    onValue(this._ref("navrhy"), snap => {
      const v = snap.val();
      state.navrhy = (v && typeof v === "object") ? v : {};
      store.set("navrhy", state.navrhy);
      if (state.tab === "dnes") renderDnes();
      if (state.tab === "tyden") renderTyden();
      if (state.notif) renderZpravy();
      syncDot();
    });
    // jídelníček podle dnů
    onValue(this._ref("jidlo"), snap => {
      const v = snap.val();
      if (v && typeof v === "object"){
        state.jidlo = v; store.set("jidlo", v);
        if (state.tab === "tyden") renderTyden();
        if (state.tab === "dnes") renderDnes();
        if (state.tab === "nakup") renderNakup();
      }
    });
    // plán tréninků
    onValue(this._ref("plan"), snap => {
      const v = snap.val();
      if (v && typeof v === "object"){
        state.plan = v; store.set("plan", v);
        if (state.tab === "plan") renderPlan();
        if (state.tab === "dnes") renderDnes();
      }
    });
    // vlastní recepty
    onValue(this._ref("recepty"), snap => {
      const v = snap.val();
      if (Array.isArray(v)) {
        store.set("myRecipes", v); nactiMoje();
        if (state.tab === "recepty") renderRecepty();
        if (state.tab === "tyden") renderTyden();
      }
    });
    // vlastní položky nákupu
    onValue(this._ref("shopx"), snap => {
      const v = snap.val();
      if (Array.isArray(v)) { state.shopX = v; store.set("shopX", v);
        if (state.tab === "nakup") renderNakup(); }
    });
    // nákup
    onValue(this._ref("shop"), snap => {
      const v = snap.val();
      if (v && typeof v === "object") { state.shop = v; store.set("shop", v);
        if (state.tab === "nakup") renderNakup(); }
    });
    // přehled druhého
    const other = this.me === "p" ? "v" : "p";
    onValue(this._ref("stav/"+other), snap => {
      this.peer = snap.val();
      if (state.tab === "dnes") renderDnes();
      if (state.tab === "progres") renderProgres();
    });
  },

  _set(path, val){
    if (!this.on) return;
    try { this._m.set(this._ref(path), val); } catch(e){}
  },

  pushFeed(m){ if (this.on) this._set("feed/"+m.id.replace(/[.#$/\[\]]/g,"_"), m); },
  pushFavs(){ this._set("favs", store.get("favs", [])); },
  pushWeek(){ this._set("week", state.week); },
  pushShop(){ this._set("shop", state.shop); },
  pushRec(){ this._set("recepty", store.get("myRecipes", [])); },
  pushPlan(){ this._set("plan", state.plan); },
  pushJidlo(){ this._set("jidlo", state.jidlo); },
  pushNavrhy(){ this._set("navrhy", state.navrhy); },
  pushShopX(){ this._set("shopx", state.shopX); },

  /* kompaktní balíček pro widget na iPhonu (čte ho Scriptable přes REST) */
  widgetData(){
    const who = (this.me === "p" || this.me === "v") ? this.me : store.get("meId", null);
    if (!who || !BASE_T[who]) return null;
    const t = target(who);
    const today = new Date().toISOString().slice(0,10);
    const tot = dayTotals(who, today);
    const ted = new Date(), nyni = ted.getHours()*60 + ted.getMinutes();

    let next = null;
    planFor(who, todayIdx).forEach(j => {
      if (next) return;
      if (state.checks[today+"|"+who+"|"+j.slot]) return;
      if (minutyZ(j.time) + 150 < nyni) return;
      next = { cas: j.time, n: String(j.name).slice(0, 46) };
    });

    const dnesPlan = planDne(today)[who] || null;
    const tr = dnesPlan ? { co: String(dnesPlan).slice(0,28), hot: !!odtrenovano(today, who) } : null;

    let se = null;
    if (state.sess){
      const a = sessSoucty("ty");
      se = { rid: String(state.sess.rid).slice(0,20), hot: a.hot, cel: a.cel, min: a.min,
             bud: state.sess.bud ? sKym(state.sess.bud) : null, kdo: state.sess.who,
             jm: (BASE_T[state.sess.who] || {}).name || "" };
    }
    return {
      jm: BASE_T[who].name,
      kcal: tot.k, cil: t.kcal, prot: tot.p, cilP: t.prot,
      next: next, tr: tr, sess: se,
      voda: waterGet(who, today), vodaCil: Math.round(waterCil(who)/GLASS),
      serie: streak(who),
      kdy: new Date().toISOString()
    };
  },
  _wq: false, _lastW: null,
  pushWidget(){
    if (!this.on){ this._wq = true; return false; }   // nemame spojeni -> posleme, jakmile bude
    const d = this.widgetData();
    if (!d) return false;
    this._wq = false;
    this._lastW = new Date();
    this._set("widget/"+this.me, d);
    return true;
  },
  /* tep — volá se každou minutu i při návratu do appky */
  tik(){
    if (!this.on) return;
    const bezi = !!state.sess;
    const stari = this._lastW ? (Date.now() - this._lastW.getTime()) : 1e9;
    if (this._wq || bezi || stari > 110000) this.pushWidget();
  },

  pushStatus(){
    if (!this.on) return;
    const who = this.me, t = target(who);
    const today = new Date().toISOString().slice(0,10);
    const tot = dayTotals(who, today);
    const arr = who === "p" ? state.wtP : state.wtV;
    const last = arr.slice().sort((a,b)=>a.d.localeCompare(b.d)).pop();
    this._set("stav/"+who, {
      jmeno: BASE_T[who].name,
      kcal: tot.k, cil: t.kcal, prot: tot.p, cilProt: t.prot,
      serie: streak(who),
      vaha: last ? last.kg : null,
      kdy: new Date().toISOString()
    });
    this.pushWidget();
  },

  reset(){
    store.set("famId", null); store.set("meId", null);
    location.reload();
  }
};

function ringSvg(pk, pp){
  const R1 = 48, R2 = 36, C1 = 2*Math.PI*R1, C2 = 2*Math.PI*R2;
  const arc = (c, p) => (c*Math.min(100,p)/100).toFixed(1) + " " + c.toFixed(1);
  return '<svg class="ring" viewBox="0 0 112 112" aria-hidden="true">'
   +'<circle class="bg1" cx="56" cy="56" r="'+R1+'" stroke-width="8"></circle>'
   +'<circle class="fg1" cx="56" cy="56" r="'+R1+'" stroke-width="8" stroke-dasharray="'+arc(C1,pk)+'"></circle>'
   +'<circle class="bg3" cx="56" cy="56" r="'+R2+'" stroke-width="8"></circle>'
   +'<circle class="fg3" cx="56" cy="56" r="'+R2+'" stroke-width="8" stroke-dasharray="'+arc(C2,pp)+'"></circle>'
   +'<text x="56" y="54" text-anchor="middle">'+pk+'%</text>'
   +'<text class="sm" x="56" y="69" text-anchor="middle">z cíle</text></svg>';
}

function ringCard(iso){
  const who = store.get("meId", null);
  if (!who || !BASE_T[who]) return "";
  const tgt = target(who);
  let dk = 0, dp = 0;
  planForIso(who, iso).forEach(m => { if (state.checks[iso+"|"+who+"|"+m.slot]){ dk += m.kcal; dp += m.prot; } });
  const pk = Math.min(100, Math.round(dk/tgt.kcal*100));
  const pp = Math.min(100, Math.round(dp/tgt.prot*100));
  const st = streak(who);
  let vzkaz;
  if (pk >= 100 && pp >= 100) vzkaz = "Den splněný. Přesně tohle dělá tu změnu. 🎉";
  else if (pp >= 100)         vzkaz = "Bílkoviny máš celé — zbytek dojedeš levou zadní.";
  else if (pk >= 60)          vzkaz = "Půlka za tebou. Drž se plánu, jde ti to.";
  else if (dk === 0)          vzkaz = "Čistý den před tebou. Rozhoduje první jídlo.";
  else                        vzkaz = "Rozjeto! Hlavně nezapomeň na bílkoviny.";
  return '<div class="card ring-card">' + ringSvg(pk, pp)
   +'<div style="flex:1;min-width:168px">'
   +'<h3 style="margin-bottom:7px">'+(iso === isoDnes()
       ? pozdrav()+', '+esc(tgt.name)+' '+(who==="v"?"✨":"💪")

   +'<div class="rkey"><s style="background:var(--s1)"></s>Kalorie <b>'+fmt(dk)+' / '+fmt(tgt.kcal)+'</b></div>'
   +'<div class="rkey"><s style="background:var(--s3)"></s>Bílkoviny <b>'+dp+' / '+tgt.prot+' g</b></div>'
   +'<p class="who" style="margin:9px 0 0">'+vzkaz+(st > 1 ? ' · série <b>'+st+' dní</b> 🔥' : '')+'</p>'
   +'</div></div>';
}

function newFamCode(){
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  const buf = new Uint8Array(20);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  for (let i=0;i<20;i++) s += a[buf[i] % a.length];
  return s.match(/.{1,5}/g).join("-");
}
