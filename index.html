function pushMsg(id, ic, ti, tx){
 const msgs = store.get("msgs", []);
 if (msgs.some(m => m.id === id)) return false;
 const m = { id, ic, ti, tx, t: new Date().toISOString(), r: false,
             od: (store.get("meId", null) && BASE_T[store.get("meId")] ? BASE_T[store.get("meId")].name : "") };
 msgs.unshift(m);
 store.set("msgs", msgs.slice(0, 60));
 if (window.sync && sync.on) sync.pushFeed(m);
 return true;
}

function buildMsgs(){
 if (!nast("zpravyAuto", true)) return;
 const today = new Date().toISOString().slice(0,10);
 const dow = new Date().getDay();

 // denní motivace
 const m = MOTIV[(todayIdx + new Date().getDate()) % MOTIV.length];
 pushMsg("mot-"+today, m[0], m[1], m[2]);

 ["p","v"].forEach(who => {
  const nm = BASE_T[who].name;
  const t = target(who);
  const tot = dayTotals(who, today);

  if (tot.k >= t.kcal)
   pushMsg("goal-"+who+"-"+today, "🎉", nm+" "+rod(who,"dojedl","dojedla")+" celý den!",
     fmt(tot.k)+" kcal a "+tot.p+" g bílkovin. Kdyby tohle byla olympiáda, stojíš na bedně. "
     +"Zatím je to jen lednice, ale ta si to pamatuje. 🥇");
  else if (tot.k >= MIN_KCAL[who])
   pushMsg("min-"+who+"-"+today, "✅", nm+" má splněné minimum",
     fmt(tot.k)+" kcal. Není to hvězdný den, ale je to den, co se počítá. "
     +"A těch je potřeba mnohem víc než těch hvězdných.");

  const st = streak(who);
  [3,5,7,14,21,30,60].forEach(n => {
   if (st === n) pushMsg("st-"+who+"-"+n, "🔥", nm+" má "+n+" dní v řadě!",
     n >= 30 ? "Třicet dní. V tuhle chvíli už to není projekt, ale povahová vlastnost. 🏛️"

/* ---- týdenní vyhodnocení + série ---- */
const MIN_KCAL = { p:2800, v:1600 };
function isoDaysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

function dayTotals(who, iso){
 // kolik bylo ten den odškrtáno (jen z uložených checků, plán se bere z aktuálního nastavení)
 let k=0, p=0;
 planForIso(who, iso).forEach(m=>{ if (state.checks[iso+"|"+who+"|"+m.slot]) { k+=m.kcal; p+=m.prot; } });
 return {k,p};
}
function streak(who){
 let n = 0;
 for (let i=0; i<120; i++){
  const iso = isoDaysAgo(i);
  const t = dayTotals(who, iso);
  if (t.k >= MIN_KCAL[who]) n++;
  else if (i === 0) continue;   // dnešek se ještě počítá, nepřerušuje řadu
  else break;
 }
 return n;
}
function weekCard(who){
 const t = target(who);
 const days = [];
 for (let i=6;i>=0;i--){
  const iso = isoDaysAgo(i);
  const tot = dayTotals(who, iso);
  const wd = new Date(iso).getDay();
  days.push({ lab: DAYS[(wd+6)%7], k: tot.k, ok: tot.k >= MIN_KCAL[who], part: tot.k > 0 && tot.k < MIN_KCAL[who] });
 }
 const okDays = days.filter(d=>d.ok).length;
 const st = streak(who);
 const arr = who==="p" ? state.wtP : state.wtV;
 const r = weeklyRate(arr);
 let verdict;
 if (okDays >= 6) verdict = "Týden sedí. <b>Přesně takhle to má vypadat</b> — nic neměň.";
 else if (okDays >= 4) verdict = "Slušný týden. Dva slabší dny nic nezkazí — zkus příště hlídat hlavně ten ranní start.";
 else if (okDays >= 1) verdict = "<b>Tady to drhne.</b> Nejrychlejší náprava je ranní shake a dva balíčky v tašce — to samo dá většinu denního minima.";
 else verdict = "Zatím bez odškrtnutých dnů. <b>Appka počítá jen to, co odklikneš</b> — jinak neví, jak na tom jste.";
 return '<div class="card"><div class="rhead"><h3>'+t.name+' — tento týden</h3>'
  +'<span class="rmeta">'+okDays+'/7 dní nad '+fmt(MIN_KCAL[who])+' kcal</span></div>'
  +'<div class="streak"><div class="big">'+st+'</div><div style="flex:1;min-width:140px">'
  +'<div style="font-size:14px;font-weight:600">'+(st===0?"Žádná série":(st===1?"den v řadě":(st<5?"dny v řadě":"dní v řadě")))+'</div>'
  +'<div class="dim" style="font-size:12.5px">Nad denním minimem '+fmt(MIN_KCAL[who])+' kcal</div></div></div>'
  +'<div class="wk">'+days.map(d=>'<div><i class="'+(d.ok?"ok":(d.part?"part":""))+'"></i>'+d.lab+'</div>').join("")+'</div>'
  +'<div class="note reco">'+verdict
  +(r ? '<div style="margin-top:6px">Váha: '+((Math.round(r.rate*100)/100)>0?"+":"")+(Math.round(r.rate*100)/100).toLocaleString("cs-CZ")+' kg/týden za '+r.span+' dní.</div>' : '')
  +'</div></div>';
}

function renderAll(){ uklidPlan(); uklidJidlo(); planPripominka(); kontrolaOdznaku(); renderNext(); buildMsgs(); renderDnes(); renderTyden(); renderRecepty(); renderNakup(); renderTrenink(); renderPlan(); renderProgres(); renderCile(); renderNastaveniTab();
 if (state.notif) renderZpravy();
 syncDot(); }
const TABS = ["dnes","tyden","recepty","nakup","trenink","plan","progres","cile","nastaveni"];
const GROUPS = {
 dnes:    { tabs:[["dnes","Dnes"]] },
 jidlo:   { tabs:[["tyden","Týden"],["recepty","Recepty"],["nakup","Nákup"]] },
 trenink: { tabs:[["trenink","Tréninky"],["plan","Plán"]] },
 progres: { tabs:[["progres","Průběh"]] },
 nastaveni: { tabs:[["nastaveni","Nastavení"],["cile","Cíle"]] }
};
GROUPS.progres.tabs = [["progres","Průběh"]];
const GRP_OF = {};
Object.keys(GROUPS).forEach(g => GROUPS[g].tabs.forEach(t => GRP_OF[t[0]] = g));
const lastSub = { jidlo:"tyden", progres:"progres", trenink:"trenink", nastaveni:"nastaveni" };
const RENDER = { dnes:renderDnes, tyden:renderTyden, recepty:renderRecepty, nakup:renderNakup,
                 trenink:renderTrenink, plan:renderPlan, progres:renderProgres, cile:renderCile,
                 nastaveni:renderNastaveniTab };
function showTab(t){
 state.tab = t;
 state.pairConfirm = false;
 if (RENDER[t]) RENDER[t]();          // vždy čerstvá data
 renderNext();
 const g = GRP_OF[t] || "dnes";
 lastSub[g] = t;
 document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.grp===g)));
 const sub = document.getElementById("subnav");
 const items = GROUPS[g].tabs;
 if (items.length > 1){
  sub.hidden = false;
  sub.innerHTML = items.map(x=>'<button role="tab" data-tab="'+x[0]+'" aria-selected="'
   +String(x[0]===t)+'" type="button">'+x[1]+'</button>').join("");
 } else { sub.hidden = true; sub.innerHTML = ""; }
 TABS.forEach(n => document.getElementById("tab-"+n).hidden = (n!==t));
 syncDot();
 window.scrollTo(0,0);
}

function keepFocus(id){
 const el = document.getElementById(id);
 if (!el) return;
 const v = el.value;
 el.focus();
 try { el.setSelectionRange(v.length, v.length); } catch(err){}
}
document.addEventListener("input", e=>{
 if (state.sess && e.target.dataset && (e.target.dataset.sk !== undefined || e.target.dataset.sr !== undefined)){
  // hodnota jde do aktivni osoby
  const key = e.target.dataset.sk !== undefined ? e.target.dataset.sk : e.target.dataset.sr;
  const p = key.split("|"), set = sessSets(+p[0])[+p[1]];
  if (e.target.dataset.sk !== undefined) set.kg = e.target.value; else set.reps = e.target.value;
  saveSess();
  return;
 }
 if (e.target.id === "budName"){ state.budName = e.target.value; return; }
 if (e.target.id === "recQ"){ state.recQ = e.target.value; renderRecepty(); keepFocus("recQ"); }
 else if (e.target.id === "exQ"){ state.exQ = e.target.value; renderTrenink(); keepFocus("exQ"); }
});

document.addEventListener("toggle", e=>{
 const d = e.target;
 if (d.id === "recForm") state.recOpen = d.open;
 if (d.tagName === "DETAILS" && d.dataset && d.dataset.exkey) state.exOpen[d.dataset.exkey] = d.open;
}, true);

document.addEventListener("change", e=>{
 const t = e.target;
 if (t.dataset.check !== undefined){
   const part = t.dataset.check.split("|");
   const jeOsoba = part[1] === "p" || part[1] === "v";
   const pred = jeOsoba ? dayTotals(part[1], part[0]) : null;
   state.checks[t.dataset.check] = t.checked; store.set("checks", state.checks);
   if (jeOsoba){
     const po = dayTotals(part[1], part[0]), cil = target(part[1]);
     if (t.checked && pred.p < cil.prot && po.p >= cil.prot) celebrate("🥳");
   }
   buildMsgs(); kontrolaOdznaku(); syncDot();
   if (window.sync && sync.on) sync.pushStatus();
   if (t.dataset.check.indexOf("|prep|") >= 0) renderNakup(); else renderDnes(); }
 else if (t.dataset.shop !== undefined){ state.shop[t.dataset.shop] = t.checked; store.set("shop", state.shop);
   if (window.sync && sync.on) sync.pushShop();
   renderNakup(); }
 else if (t.dataset.pick !== undefined){ pickSet(t.dataset.day, t.dataset.pick, +t.value); renderDnes(); renderNext(); }
 else if (t.dataset.din !== undefined){ jidloZmena(t.dataset.din, "d", t.value);
   renderDnes(); renderTyden(); renderNakup(); renderNext(); }
 else if (t.dataset.kdo !== undefined){ jidloZmena(t.dataset.kdo, "k", t.value);
   renderDnes(); renderTyden(); }
 else if (t.dataset.exsel !== undefined){ state.exsel[t.dataset.exsel] = t.value; store.set("exsel", state.exsel); renderTrenink(); }
 else if (t.dataset.planset !== undefined){
   const p = t.dataset.planset.split("|");
   planSet(p[1], p[0], t.value || null);
   renderPlan(); renderDnes(); renderNext();
 }
 else if (t.dataset.rem !== undefined){
   const sel = remSel(); sel[t.dataset.rem] = t.checked;
   state.rem = sel; store.set("rem", sel); renderNastaveniTab();
 }
 else if (t.dataset.nsel !== undefined){
   const v = t.value;
   nastSet(t.dataset.nsel, isNaN(+v) ? v : +v);
   renderAll();
 }
 else if (t.dataset.nnum !== undefined){
   const q = t.dataset.nnum.split("|");
   let v = Math.round(parseFloat(String(t.value).replace(",", ".")));
   if (!v || isNaN(v)) v = +q[3];
   v = Math.max(+q[1], Math.min(+q[2], v));
   t.value = v; nastSet(q[0], v); renderAll();
 }
 else if (t.dataset.nkcal !== undefined){
   const who = t.dataset.nkcal;
   let v = Math.round(parseFloat(String(t.value).replace(",", ".")));
   const lo = who === "p" ? 1200 : 1000, hi = who === "p" ? 6000 : 4000;
   if (!v || isNaN(v)) v = BASE_T[who].kcal;
   v = Math.max(lo, Math.min(hi, v));
   t.value = v; store.set("kcal_"+who, v); renderAll();
 }
 else if (t.dataset.ncas !== undefined){
   const q = t.dataset.ncas.split("|"), who = q[0], i = +q[1];
   const arr = treninky(who).slice();
   if (arr[i] && t.value){ arr[i] = [arr[i][0], t.value, arr[i][2], arr[i][3]]; nastSet("tren_"+who, arr); renderAll(); }
 }
 else if (t.id === "daySel"){ state.dayIso = t.value; renderDnes(); }
 else if (t.dataset.foto !== undefined && t.files && t.files[0]){
   const who = t.dataset.foto, f = t.files[0];
   const rd = new FileReader();
   rd.onload = ev => {
     const img = new Image();
     img.onload = () => {
       const max = 420, sc = Math.min(1, max/Math.max(img.width, img.height));
       const cv = document.createElement("canvas");
       cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
       cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
       const src = cv.toDataURL("image/jpeg", 0.62);
       const iso = new Date().toISOString().slice(0,10);
       const key = who === "p" ? "fotoP" : "fotoV";
       const arr = fotoArr(who).filter(x => x.d !== iso).concat([{ d: iso, src: src }]).slice(-12);
       if (who === "p") state.fotoP = arr; else state.fotoV = arr;
       try { store.set(key, arr); } catch(err){}
       state.lastCheckin = iso; store.set("lastCheckin", iso);
       pushMsg("foto-"+who+"-"+iso, "📸", BASE_T[who].name+" "+rod(who,"přidal","přidala")+" novou fotku",
         "Měsíční kontrola je zapsaná. Za pár měsíců bude ta srovnávací dvojice pořádná odměna.");
       renderProgres(); syncDot();
     };
     img.src = ev.target.result;
   };
   rd.readAsDataURL(f);
 }
});

 if (e.target.id === "nrSave"){

 const dr = e.target.closest("[data-delrec]");

 const co = e.target.closest("[data-cookopen]");

 if (am){
  const who = am.dataset.addmr;
  const fields = who==="p" ? ["pas","hrud","paze"] : ["pas","boky","stehno"];
  const entry = { d: new Date().toISOString().slice(0,10) };
  let any = false;
  fields.forEach(f=>{
   const el = document.getElementById("mr-"+who+"-"+f);
   const v = parseFloat(String(el.value).replace(",", "."));
   if (v && v>20 && v<250){ entry[f] = v; any = true; }
  });
  if (!any) return;
  const arr = who==="p" ? state.mrP : state.mrV;
  const i = arr.findIndex(x=>x.d===entry.d);
  if (i>=0) arr[i] = Object.assign(arr[i], entry); else arr.push(entry);
  store.set(who==="p"?"mrP":"mrV", arr);
  renderProgres(); return;
 }
 const dm = e.target.closest("[data-delmr]");
 if (dm){
  const p = dm.dataset.delmr.split("|");
  const arr = p[0]==="p" ? state.mrP : state.mrV;
  const i = arr.findIndex(x=>x.d===p[1]);
  if (i>=0){ arr.splice(i,1); store.set(p[0]==="p"?"mrP":"mrV", arr); renderProgres(); }
  return;
 }
});

document.addEventListener("keydown", e=>{
 if (e.key !== "Escape") return;
 if (state.notif) zavriNotif();
 else if (state.cook) closeCook();
 else if (state.sess){ const o = document.getElementById("sessOverlay"); o.hidden = true; document.body.style.overflow=""; renderTrenink(); }
 else if (state.onb !== null) closeOnb();
});

(function theme(){
 const root = document.documentElement, btn = document.getElementById("themeBtn");
 const saved = store.get("theme", null);
 if (saved) root.setAttribute("data-theme", saved);
 const isDark = ()=>{
  const t = root.getAttribute("data-theme");
  if (t==="dark") return true;
  if (t==="light") return false;
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
 };
 const sync = ()=> btn.textContent = isDark() ? "Světlý" : "Tmavý";
 btn.addEventListener("click", ()=>{
  const next = isDark() ? "light" : "dark";
  root.setAttribute("data-theme", next); store.set("theme", next); sync();
 });
 sync();
})();

setInterval(()=>{ renderNext(); if (window.sync) sync.tik(); }, 60000);
document.addEventListener("visibilitychange", ()=>{
 if (!document.hidden && window.sync) sync.tik();
});
window.addEventListener("focus", ()=>{ if (window.sync) sync.tik(); });
document.getElementById("todayLine").textContent = "Dnes je "+DAYFULL[todayIdx]+" · "+DAYNOTE[todayIdx].replace(/^[^\s]+\s/,"");
nactiMoje();
renderAll();
if (state.sess) renderSession();
(function deepLink(){
 try {
  const q = new URLSearchParams(location.search);
  const t = q.get("tab");
  if (t && TABS.indexOf(t) >= 0) showTab(t); else showTab("dnes");
  if (q.get("akce") === "sess" && state.sess) renderSession();
  if (q.get("akce") === "zpravy") otevriNotif();
 } catch(e){ showTab("dnes"); }
})();
renderNastaveni();
if (!store.get("onb", false)) openOnb();
if (store.get("famId", null) && store.get("meId", null)) sync.start();

/* offline režim */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
 window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
