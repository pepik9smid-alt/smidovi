<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Šmídovi — Pepule &amp; Verune</title>
<style>
  :root{
    color-scheme:light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --s1:#2a78d6; --s1-track:#cde2fb;
    --s3:#1baf7a; --s3-track:#c7ede0;
    --s2:#eb6834;
    --good:#006300; --accent-soft:rgba(42,120,214,.08);
  }
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])){
      color-scheme:dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --s1:#3987e5; --s1-track:#184f95;
      --s3:#199e70; --s3-track:#0d4f38;
      --s2:#d95926;
      --good:#0ca30c; --accent-soft:rgba(57,135,229,.12);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s1-track:#184f95;
    --s3:#199e70; --s3-track:#0d4f38;
    --s2:#d95926;
    --good:#0ca30c; --accent-soft:rgba(57,135,229,.12);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--page);color:var(--text-primary);
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 14px 40px}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  h1{font-size:22px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--text-secondary);font-size:12.5px;margin:1px 0 0}
  .ghost{background:var(--surface-1);color:var(--text-secondary);border:1px solid var(--border);
         border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .ghost:hover{color:var(--text-primary)}

  nav.tabs{display:flex;gap:2px;background:var(--surface-1);border:1px solid var(--border);
           border-radius:12px;padding:4px;margin-bottom:18px}
  nav.tabs button{flex:1;background:none;border:0;border-radius:9px;padding:7px 2px;
                  font:inherit;font-size:13px;color:var(--text-secondary);cursor:pointer;line-height:1.25}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--text-primary);font-weight:600}
  .ticon{display:block;font-size:17px;line-height:1.15}
  @media(max-width:740px){
    nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0;border-radius:0;
             border-left:0;border-right:0;border-bottom:0;
             padding:6px 3px calc(6px + env(safe-area-inset-bottom))}
    nav.tabs button{font-size:10px;min-width:0;padding:4px 0}
    body{padding-bottom:84px}
  }
  @media(min-width:741px){ .ticon{display:inline;margin-right:6px;font-size:15px} }

  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid2>*{min-width:0}
  @media(max-width:740px){.grid2{grid-template-columns:1fr}}
  .card{min-width:0}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:600;margin:22px 0 10px}
  h3{font-size:16.5px;margin:0 0 2px}
  .who{color:var(--text-secondary);font-size:12.5px;margin:0 0 12px}

  .meter-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:3px}
  .meter-row .lab{color:var(--text-secondary)}
  .meter-row .val{font-variant-numeric:tabular-nums;font-weight:600}
  .meter{height:9px;border-radius:5px;overflow:hidden;margin-bottom:10px}
  .meter i{display:block;height:100%;border-radius:5px;transition:width .18s ease}
  .m-kcal{background:var(--s1-track)} .m-kcal i{background:var(--s1)}
  .m-prot{background:var(--s3-track)} .m-prot i{background:var(--s3)}
  .rest{font-size:12.5px;color:var(--text-secondary);margin:-4px 0 12px}
  .rest b{color:var(--text-primary)} .done{color:var(--good);font-weight:600}

  .meal{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid)}
  .meal:last-child{border-bottom:none}
  .meal input[type=checkbox]{width:21px;height:21px;margin:2px 0 0;accent-color:var(--s1);flex:none;cursor:pointer}
  .meal .body{flex:1;min-width:0}
  .meal .time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .meal .name{font-size:14px}
  .meal.checked .name{color:var(--text-secondary);text-decoration:line-through}
  .meal .nums{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:12px}
  select,input[type=number]{background:var(--surface-1);color:var(--text-primary);border:1px solid var(--border);
         border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;max-width:100%;margin-top:3px}
  select{width:100%}
  #daySel{width:auto;min-width:104px}
  .extip select{width:auto;max-width:100%}
  html,body{overflow-x:hidden}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
     font-weight:600;padding:0 8px 7px 0;border-bottom:1px solid var(--baseline)}
  td{padding:8px 8px 8px 0;border-bottom:1px solid var(--grid);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:0}
  .day{font-weight:600;width:30px;white-space:nowrap}
  .dim{color:var(--text-secondary)}
  .today-row td{background:var(--accent-soft)}

  ul.shop{list-style:none;margin:0;padding:0;columns:2;column-gap:26px}
  @media(max-width:600px){ul.shop{columns:1}}
  ul.shop li{break-inside:avoid;padding:5px 0;font-size:14px;display:flex;gap:9px;align-items:flex-start}
  ul.shop input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--s1);flex:none;cursor:pointer}
  ul.shop li.on span{color:var(--text-secondary);text-decoration:line-through}
  .shop-head{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
             font-weight:600;margin:14px 0 4px;column-span:all}

  .note{font-size:13px;color:var(--text-secondary);border-left:3px solid var(--s2);
        padding:2px 0 2px 13px;margin-top:12px}
  .note b{color:var(--text-primary)}
  .reco{border-left-color:var(--s3)}

  .qbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .qletter{font-size:30px;font-weight:700;color:var(--s2);line-height:1}
  button.act{background:var(--s1);color:#fff;border:0;border-radius:9px;padding:9px 15px;
             font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  button.act:hover{filter:brightness(.94)}
  button.act.small{padding:6px 12px;font-size:13px}
  .seg-toggle{display:inline-flex;background:var(--page);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
  .seg-toggle button{background:none;border:0;border-radius:999px;padding:6px 16px;font:inherit;font-size:13.5px;
                     color:var(--text-secondary);cursor:pointer}
  .seg-toggle button.on{background:var(--surface-1);color:var(--text-primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

  details.ex{border-bottom:1px solid var(--grid)}
  details.ex:last-child{border-bottom:none}
  details.ex summary{display:flex;align-items:center;gap:11px;padding:9px 0;cursor:pointer;list-style:none}
  details.ex summary::-webkit-details-marker{display:none}
  .exic{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent-soft);
        display:flex;align-items:center;justify-content:center;color:var(--s1)}
  .exic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .exname{flex:1;min-width:0}
  .exname .n{font-size:14px;font-weight:600}
  .exname .m{font-size:11.5px;color:var(--muted)}
  .exsets{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .exsets .s{font-size:13.5px;font-weight:600}
  .exsets .r{font-size:11.5px;color:var(--muted)}
  .extip{margin:0 0 10px 45px;font-size:12.5px;color:var(--text-secondary)}
  .extip b{color:var(--text-primary)}
  .extip select{margin-top:5px}

  .rhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  .rmeta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .rec .ing{columns:2;column-gap:22px;font-size:13.5px;margin:8px 0;padding-left:18px}
  @media(max-width:600px){.rec .ing{columns:1}}
  .rec ol{margin:8px 0 0;padding-left:20px;font-size:13.5px}
  .rec ol li{margin-bottom:4px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
  .badge{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text-secondary)}
  .badge.b1{color:var(--s1);border-color:var(--s1)}
  .badge.b3{color:var(--s3);border-color:var(--s3)}
  details.rec{border:1px solid var(--border);border-radius:12px;padding:0 14px;margin-bottom:10px;background:var(--surface-1)}
  details.rec summary{padding:12px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
  details.rec summary::-webkit-details-marker{display:none}
  details.rec summary .t{font-size:14.5px;font-weight:600}
  details.rec summary .k{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  details.rec .inner{padding:0 0 13px}

  .wrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .wrow input{width:92px}
  .spark{width:100%;height:110px;margin:4px 0 6px}
  .wlist{font-size:13px}
  .wlist button,.mlist button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--grid);font-size:12px;color:var(--muted)}
</style>
</head>

  get(k, d){ try{ const v = localStorage.getItem("pv_"+k); return v!==null ? JSON.parse(v) : (k in mem ? mem[k] : d); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k]=v; try{ localStorage.setItem("pv_"+k, JSON.stringify(v)); }catch(e){} }
};

/* ============ Progres ============ */
function spark(entries, color){
 if (entries.length < 2) return '<div class="dim" style="font-size:12.5px;margin:6px 0">Zapiš aspoň dvě hodnoty a ukáže se graf.</div>';
 const w=560,h=100,pad=8;
 const kgs = entries.map(e=>e.kg);
 const mn = Math.min(...kgs), mx = Math.max(...kgs);
 const span = (mx-mn)||1;
 const pts = entries.map((e,i)=>{
  const x = pad + i*(w-2*pad)/(entries.length-1);
  const y = h-pad - (e.kg-mn)/span*(h-2*pad);
  return [x,y];
 });
 const line = pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Vývoj váhy">'
  +'<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
  +pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+color+'" stroke="var(--surface-1)" stroke-width="2"/>').join("")
  +'</svg>';
}
function weeklyRate(arr){
 const s = arr.slice().sort((a,b)=>a.d.localeCompare(b.d));
 if (s.length < 2) return null;
 const last = s[s.length-1];
 // nejstarší záznam v okně posledních 28 dní; potřebujeme rozestup aspoň 10 dní
 let base = null;
 for (const e of s){ if (daysBetween(e.d, last.d) <= 28) { base = base || e; } }
 base = base || s[0];
 const span = daysBetween(base.d, last.d);
 if (span < 10) return null;
 return { rate: (last.kg - base.kg) / span * 7, span: span };
}
function reco(who){
 const arr = who==="p" ? state.wtP : state.wtV;
 const t = target(who);
 const r = weeklyRate(arr);
 if (!r) return { txt:"Zapisuj váhu každou neděli — doporučení se objeví, jakmile budou záznamy aspoň 10 dní od sebe.", act:null };
 const rt = Math.round(r.rate*100)/100;
 const rtx = (rt>0?"+":"")+rt.toLocaleString("cs-CZ")+" kg/týden za posledních "+r.span+" dní";
 if (who==="p"){
  if (rt < 0.15) return { txt:"Tempo "+rtx+" — pomalejší než cíl (+0,25 až 0,4). <b>Nejíš dost.</b> Doporučení: přidat 250 kcal denně (med do shaku + větší večeře).", act: Math.round((t.kcal+250)/50)*50 };
  if (rt > 0.6) return { txt:"Tempo "+rtx+" — rychlejší než cíl, přibývalo by zbytečně moc tuku. Doporučení: ubrat 200 kcal denně.", act: Math.round((t.kcal-200)/50)*50 };
  return { txt:"Tempo "+rtx+" — <b>přesně v cíli.</b> Nic neměň, jede to.", act:null };
 }
 if (rt <= -0.45) return { txt:"Tempo "+rtx+" — váha padá moc rychle, brala by s sebou sval. Doporučení: přidat 200 kcal denně.", act: Math.round((t.kcal+200)/50)*50 };
 if (rt >= 0.45) return { txt:"Tempo "+rtx+" — váha roste rychleji, než by u rekompozice měla. Doporučení: ubrat 150 kcal denně (nejdřív ale zkontroluj, jestli to není jen fáze cyklu).", act: Math.round((t.kcal-150)/50)*50 };
 return { txt:"Tempo "+rtx+" — <b>váha drží, přesně tak to má být.</b> Postava se mění v posilovně, ne na váze.", act:null };
}
function wtCard(who){
 const arr = who==="p" ? state.wtP : state.wtV;
 const t = target(who);
 const sorted = arr.slice().sort((a,b)=>a.d.localeCompare(b.d));
 const first = sorted[0], last = sorted[sorted.length-1];
 const delta = first && last ? Math.round((last.kg-first.kg)*10)/10 : 0;
 const goalTxt = who==="p" ? "cíl +0,25–0,4 kg/týden → 105 kg" : "cíl: váha drží, mění se postava";
 const rec = reco(who);
 const adj = t.kcal !== BASE_T[who].kcal;
 const list = sorted.slice(-8).reverse().map(e=>
  '<tr><td>'+e.d.split("-").reverse().join(". ")+'</td><td class="num">'+e.kg.toLocaleString("cs-CZ")+' kg</td>'
  +'<td class="num"><button data-delwt="'+who+'|'+e.d+'" title="Smazat">×</button></td></tr>').join("");
 return '<div class="card"><h3>'+t.name+'</h3>'
  +'<p class="who">'+(last ? "Aktuálně <b>"+last.kg.toLocaleString("cs-CZ")+" kg</b>"+(sorted.length>1?" · od startu "+(delta>0?"+":"")+delta.toLocaleString("cs-CZ")+" kg":"") : "Zatím bez záznamu")+' · '+goalTxt+'</p>'
  +'<div class="wrow"><input type="number" step="0.1" min="30" max="250" id="wt-'+who+'" placeholder="kg" inputmode="decimal">'
  +'<button class="act small" data-addwt="'+who+'" type="button">Uložit dnešní váhu</button></div>'
  + spark(sorted, who==="p" ? "var(--s1)" : "var(--s3)")
  +'<div class="note reco">'+rec.txt
  +(rec.act ? ' <div style="margin-top:8px"><button class="act small" data-applyk="'+who+'|'+rec.act+'" type="button">Nastavit '+fmt(rec.act)+' kcal</button></div>' : '')
  +(adj ? '<div style="margin-top:8px" class="dim">Aktuální cíl '+fmt(t.kcal)+' kcal (výchozí '+fmt(BASE_T[who].kcal)+') · <button class="ghost" data-applyk="'+who+'|'+BASE_T[who].kcal+'" type="button">vrátit výchozí</button></div>' : '')
  +'</div>'
  +'<table class="wlist"><tbody>'+list+'</tbody></table></div>';
}
function mrCard(who){
 const arr = who==="p" ? state.mrP : state.mrV;
 const fields = who==="p" ? [["pas","Pas"],["hrud","Hrudník"],["paze","Paže"]] : [["pas","Pas"],["boky","Boky"],["stehno","Stehno"]];
 const sorted = arr.slice().sort((a,b)=>a.d.localeCompare(b.d));
 const first = sorted[0], last = sorted[sorted.length-1];
 const inputs = fields.map(f=>'<input type="number" step="0.5" min="20" max="200" id="mr-'+who+'-'+f[0]+'" placeholder="'+f[1]+' cm" inputmode="decimal">').join("");
 let cmp = "";
 if (first && last && first !== last){
  cmp = '<p class="who" style="margin-top:8px">Od první kontroly: '+fields.map(f=>{
   const d = Math.round((last[f[0]]-first[f[0]])*10)/10;
   return f[1]+" "+(d>0?"+":"")+d.toLocaleString("cs-CZ")+" cm";
  }).join(" · ")+'</p>';
 }
 const list = sorted.slice(-5).reverse().map(e=>
  '<tr><td>'+e.d.split("-").reverse().join(". ")+'</td>'
  +fields.map(f=>'<td class="num">'+(e[f[0]]||"—")+'</td>').join("")
  +'<td class="num"><button data-delmr="'+who+'|'+e.d+'">×</button></td></tr>').join("");
 return '<div class="card"><h3>'+BASE_T[who].name+' — míry</h3>'
  +'<div class="wrow">'+inputs+'<button class="act small" data-addmr="'+who+'" type="button">Uložit</button></div>'
  + cmp
  +'<table class="mlist wlist"><thead><tr><th>Datum</th>'+fields.map(f=>'<th class="num">'+f[1]+'</th>').join("")+'<th></th></tr></thead><tbody>'+list+'</tbody></table></div>';
}
function renderProgres(){
 const lc = state.lastCheckin;
 let due = "";
 if (lc){
  const d = daysBetween(lc, new Date().toISOString().slice(0,10));
  due = d >= 28 ? ' <b style="color:var(--s2)">Už je to '+d+' dní — je čas na další.</b>' : ' Další zhruba za '+(28-d)+' dní.';
 }
 document.getElementById("tab-progres").innerHTML =
  '<div class="grid2">'+wtCard("p")+wtCard("v")+'</div>'
  +'<div class="card"><h3>Měsíční vizuální kontrola</h3>'
  +'<p class="who">Jednou za ~4 týdny: fotky (zepředu, z boku, zezadu — stejné světlo a místo), míry níže a pohled zpět: sedí oblečení jinak? Rostou váhy v Hevy?'
  +(lc ? ' Naposledy: <b>'+lc.split("-").reverse().join(". ")+'</b>.'+due : ' Zatím neproběhla — udělejte první hned na startu, budete si děkovat.')+'</p>'
  +'<button class="act small" id="checkinBtn" type="button">Označit dnešní kontrolu ✓</button></div>'
  +'<div class="grid2">'+mrCard("p")+mrCard("v")+'</div>'
  +'<div class="note"><b>Váží se v neděli ráno</b> — nalačno, po WC. Denní výkyvy jsou voda. '
  +'Verune: cyklus hýbe váhou o 1–2 kg, proto u ní rozhodují fotky, míry a síla — ne váha. '
  +'<b>Doporučení výše samo přepočítá kalorie</b>, když se váha 2+ týdny nehýbe správným směrem — stačí kliknout.</div>';
}

/* ============ Cíle ============ */
function renderCile(){
 const tp = target("p"), tv = target("v");
 document.getElementById("tab-cile").innerHTML =
  '<div class="grid2">'
  +'<div class="card"><h3>Pepule</h3><p class="who">190 cm · start 94,5 kg · 34 let — nabrat zpět svaly</p>'
  +'<table><tbody><tr><td>Kalorie</td><td class="num">'+fmt(tp.kcal)+' kcal'+(tp.kcal!==3150?' (upraveno)':'')+'</td></tr><tr><td>Bílkoviny</td><td class="num">200 g</td></tr>'
  +'<tr><td>Tuky</td><td class="num">90 g</td></tr><tr><td>Sacharidy</td><td class="num">~385 g</td></tr>'
  +'<tr><td>Minimum v nejhorším dni</td><td class="num">2 800 kcal</td></tr><tr><td>Cíl</td><td class="num">105 kg</td></tr></tbody></table>'
  +'<div class="note">Milníky: 96 kg za měsíc · 99 kg za 3 měsíce · 102 kg za půl roku. Nesmlouvavé: ranní shake každý den, jídlo v tašce než vyjede.</div></div>'
  +'<div class="card"><h3>Verune</h3><p class="who">165 cm · 64 kg · 28 let — zpevnit, ne zhubnout</p>'
  +'<table><tbody><tr><td>Kalorie</td><td class="num">'+fmt(tv.kcal)+' kcal'+(tv.kcal!==1900?' (upraveno)':'')+'</td></tr><tr><td>Bílkoviny</td><td class="num">125 g</td></tr>'
  +'<tr><td>Tuky</td><td class="num">60 g</td></tr><tr><td>Sacharidy</td><td class="num">~215 g</td></tr>'
  +'<tr><td>Nikdy pod</td><td class="num">1 600 kcal</td></tr><tr><td>Váha</td><td class="num">63–65 kg beze změny</td></tr></tbody></table>'
  +'<div class="note">Rekompozice: sval nahoru, tuk dolů, váha stojí. Milníky: 12 tréninků za měsíc · viditelná změna na fotkách za 3 měsíce · pas −2 až −4 cm.</div></div>'
  +'</div>'
  +'<div class="card"><h3>Nastavení v Kalorických tabulkách</h3>'
  +'<p class="who">Appka si u obou spočítá čísla špatně — přepište je ručně. Zapisujte jen první 2–3 týdny, pak stačí odhad a tahle appka.</p>'
  +'<table><thead><tr><th>Cíl</th><th class="num">Pepule</th><th class="num">Verune</th></tr></thead><tbody>'
  +'<tr><td>Kalorie</td><td class="num">'+fmt(tp.kcal)+'</td><td class="num">'+fmt(tv.kcal)+'</td></tr>'
  +'<tr><td>Bílkoviny</td><td class="num">200 g</td><td class="num">125 g</td></tr>'
  +'<tr><td>Tuky</td><td class="num">90 g</td><td class="num">60 g</td></tr>'
  +'<tr><td>Sacharidy</td><td class="num">~385 g</td><td class="num">~215 g</td></tr></tbody></table></div>'
  +'<div class="card"><h3>Společná pravidla Šmídových</h3><table><tbody>'
  +'<tr><td>1</td><td>Nečekat na hlad — jí se podle hodin. Chuť se vrátí za 2–3 týdny.</td></tr>'
  +'<tr><td>2</td><td>Neděle rozhoduje: nákup + 10 autobagů + 10 vajec + vážení.</td></tr>'
  +'<tr><td>3</td><td>Bílkoviny před vším ostatním, u obou.</td></tr>'
  +'<tr><td>4</td><td>Trénink se neruší, zkracuje (30′ Krize / FB3 doma se počítají).</td></tr>'
  +'<tr><td>5</td><td>Špatný den = jeden řádek, ne konec projektu.</td></tr>'
  +'<tr><td>6</td><td>Kalorie se mění jen podle Progresu — ne podle pocitu.</td></tr>'
  +'<tr><td>7</td><td>Doplňky pro oba: kreatin 5 g + vitamin D3 denně. Nic dalšího.</td></tr>'
  +'</tbody></table></div>';
}

/* ============ wiring ============ */
function renderAll(){ renderDnes(); renderTyden(); renderRecepty(); renderNakup(); renderTrenink(); renderProgres(); renderCile(); }
function showTab(t){
 state.tab = t;
 document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===t)));
 ["dnes","tyden","recepty","nakup","trenink","progres","cile"].forEach(n=>document.getElementById("tab-"+n).hidden = (n!==t));
 window.scrollTo(0,0);
}

document.addEventListener("change", e=>{
 const t = e.target;
 if (t.dataset.check !== undefined){ state.checks[t.dataset.check] = t.checked; store.set("checks", state.checks); renderDnes(); }
 else if (t.dataset.shop !== undefined){ state.shop[t.dataset.shop] = t.checked; store.set("shop", state.shop); renderNakup(); }
 else if (t.dataset.pick !== undefined){ state.pick[+t.dataset.day][t.dataset.pick] = +t.value; store.set("pick", state.pick); renderDnes(); }
 else if (t.dataset.week !== undefined){ state.week[+t.dataset.week] = t.value; store.set("week", state.week); renderDnes(); renderTyden(); renderNakup(); }
 else if (t.dataset.exsel !== undefined){ state.exsel[t.dataset.exsel] = t.value; store.set("exsel", state.exsel); renderTrenink(); }
 else if (t.id === "daySel"){ state.day = +t.value; renderDnes(); }
});

document.addEventListener("click", e=>{
 const tab = e.target.closest("nav.tabs button");
 if (tab){ showTab(tab.dataset.tab); return; }
 const tw = e.target.closest("[data-trwho]");
 if (tw){ state.trWho = tw.dataset.trwho; renderTrenink(); return; }
 if (e.target.id === "doneBtn"){ state.queue = (state.queue+1)%4; store.set("queue", state.queue); renderTrenink(); return; }
 if (e.target.id === "doneBtnV"){ state.fb = (state.fb+1)%2; store.set("fb", state.fb); renderTrenink(); return; }
 if (e.target.id === "clearShop"){ state.shop = {}; store.set("shop", state.shop); renderNakup(); return; }
 if (e.target.id === "checkinBtn"){ state.lastCheckin = new Date().toISOString().slice(0,10); store.set("lastCheckin", state.lastCheckin); renderProgres(); return; }
 const ap = e.target.closest("[data-applyk]");
 if (ap){
  const p = ap.dataset.applyk.split("|");
  store.set("kcal_"+p[0], +p[1]);
  renderAll(); showTab("progres"); return;
 }
 const aw = e.target.closest("[data-addwt]");
 if (aw){
  const who = aw.dataset.addwt;
  const inp = document.getElementById("wt-"+who);
  const kg = parseFloat(String(inp.value).replace(",", "."));
  if (!kg || kg<30 || kg>250) return;
  const iso = new Date().toISOString().slice(0,10);
  const arr = who==="p" ? state.wtP : state.wtV;
  const i = arr.findIndex(x=>x.d===iso);
  if (i>=0) arr[i].kg = kg; else arr.push({d:iso,kg:kg});
  store.set(who==="p"?"wtP":"wtV", arr);
  renderProgres(); return;
 }
 const dw = e.target.closest("[data-delwt]");
 if (dw){
  const p = dw.dataset.delwt.split("|");
  const arr = p[0]==="p" ? state.wtP : state.wtV;
  const i = arr.findIndex(x=>x.d===p[1]);
  if (i>=0){ arr.splice(i,1); store.set(p[0]==="p"?"wtP":"wtV", arr); renderProgres(); }
  return;
 }
 const am = e.target.closest("[data-addmr]");
 if (am){
  const who = am.dataset.addmr;
  const fields = who==="p" ? ["pas","hrud","paze"] : ["pas","boky","stehno"];
  const entry = { d: new Date().toISOString().slice(0,10) };
  let any = false;
  fields.forEach(f=>{
   const el = document.getElementById("mr-"+who+"-"+f);
   const v = parseFloat(String(el.value).replace(",", "."));
   if (v && v>20 && v<250){ entry[f] = v; any = true; }
  });
  if (!any) return;
  const arr = who==="p" ? state.mrP : state.mrV;
  const i = arr.findIndex(x=>x.d===entry.d);
  if (i>=0) arr[i] = Object.assign(arr[i], entry); else arr.push(entry);
  store.set(who==="p"?"mrP":"mrV", arr);
  renderProgres(); return;
 }
 const dm = e.target.closest("[data-delmr]");
 if (dm){
  const p = dm.dataset.delmr.split("|");
  const arr = p[0]==="p" ? state.mrP : state.mrV;
  const i = arr.findIndex(x=>x.d===p[1]);
  if (i>=0){ arr.splice(i,1); store.set(p[0]==="p"?"mrP":"mrV", arr); renderProgres(); }
  return;
 }
});

(function theme(){
 const root = document.documentElement, btn = document.getElementById("themeBtn");
 const saved = store.get("theme", null);
 if (saved) root.setAttribute("data-theme", saved);
 const isDark = ()=>{
  const t = root.getAttribute("data-theme");
  if (t==="dark") return true;
  if (t==="light") return false;
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
 };
 const sync = ()=> btn.textContent = isDark() ? "Světlý" : "Tmavý";
 btn.addEventListener("click", ()=>{
  const next = isDark() ? "light" : "dark";
  root.setAttribute("data-theme", next); store.set("theme", next); sync();
 });
 sync();
})();

document.getElementById("todayLine").textContent = "Dnes je "+DAYFULL[todayIdx]+" · "+DAYNOTE[todayIdx].replace(/^[^\s]+\s/,"");
renderAll();
showTab("dnes");
</script>
</body>
</html>
